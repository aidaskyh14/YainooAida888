<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ทดลองแข่งเรือ – ในสวนของยัยหนู</title><link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,900&family=Mali:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--cocoa:#6E4B3A;--soft:#9A7A68;--aqua:#5BB6D4;--mint:#BDEBDD;--pig:#F6A9BD;--cream:#FFFBF5}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;overflow:hidden;background:#2b6fb5}
body{font-family:'Mali',sans-serif;color:var(--cocoa);font-size:.85rem;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;overflow:hidden}
#view::before{content:"";position:absolute;inset:-40px;background:var(--bg) center/cover no-repeat;filter:blur(18px) brightness(.8)}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-size:100% 100%}
.line{position:absolute;border-top:2px dashed rgba(255,255,255,.55);pointer-events:none}
.line.fin{border-top:3px solid rgba(255,255,255,.9)}
.lbl{position:absolute;transform:translate(-100%,-50%);background:rgba(20,50,90,.72);color:#fff;border-radius:999px;padding:.05rem .4rem;font-size:.58rem;font-weight:700;white-space:nowrap;display:flex;gap:.15rem;align-items:center;pointer-events:none}
.lbl i{font-style:normal;font-size:.6rem;opacity:.95}
.boat{position:absolute;transform:translate(-50%,-50%);transition:top 1.2s cubic-bezier(.3,.1,.3,1),left 1.2s;cursor:pointer;z-index:2}
.boat img.hull{width:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,30,60,.35));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3%) rotate(1deg)}}
.boat .num{position:absolute;left:50%;top:35.5%;transform:translate(-50%,-50%);font-weight:800;font-size:1.05em;line-height:1;pointer-events:none}
.boat .tag{position:absolute;left:50%;top:102%;transform:translateX(-50%);background:rgba(255,251,245,.94);border:2px solid #fff;border-radius:999px;padding:.05rem .4rem;font-size:.55rem;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;gap:.2rem}
.boat .tag b{color:#B9761F}
.boat.mine .tag{background:#FFF3C9}
.boat .win{position:absolute;left:50%;top:-22%;transform:translateX(-50%);font-size:.62rem;font-weight:800;background:#FFD86B;border:2px solid #fff;border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.boat .stopv{position:absolute;inset:-6%;border-radius:40%;background:rgba(120,180,255,.35);box-shadow:0 0 0 3px rgba(160,210,255,.8) inset;display:grid;place-items:center;font-size:1.2em}
.gift{position:absolute;transform:translate(-50%,-50%);width:9%;cursor:pointer;z-index:3;animation:gb 1.2s ease-in-out infinite}
.gift img{width:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
@keyframes gb{50%{transform:translate(-50%,-62%)}}
.gift.other{opacity:.7;animation:none;cursor:default}
.top{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + .5rem) .6rem 0;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,251,245,.94);border:3px solid #fff;border-radius:999px;padding:.3rem .7rem;font-weight:700;font-size:.74rem;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap}
.chip.mine{background:#FFF3C9}
.spacer{margin-left:auto}
.rbtn{width:2.7rem;height:2.7rem;border-radius:50%;border:3px solid #fff;font-size:1.2rem;display:grid;place-items:center;cursor:pointer;padding:0;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#E9FBF4);box-shadow:0 4px 0 rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.3)}
.bar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);display:flex;gap:.4rem;align-items:center}
.big{border:3px solid #fff;border-radius:999px;font:inherit;font-weight:800;font-size:.9rem;padding:.6rem 1.2rem;cursor:pointer;background:#6CC9A8;color:#fff;box-shadow:0 4px 0 #4DAA8A,0 8px 16px rgba(0,0,0,.25);white-space:nowrap}
.big:disabled{background:#cfd8d6;box-shadow:none;color:#fff}
.lock{position:fixed;z-index:5;left:.6rem;right:.6rem;top:calc(env(safe-area-inset-top,0px) + 3.6rem);background:rgba(50,30,70,.9);color:#fff;border:3px solid #FFD86B;border-radius:1rem;padding:.5rem .8rem;text-align:center;font-weight:700;font-size:.82rem;display:none}
.lock small{display:block;font-weight:500;font-size:.68rem;opacity:.85}
.lock.on{display:block}
.ann{position:fixed;z-index:12;left:50%;top:calc(env(safe-area-inset-top,0px) + 3.6rem);transform:translate(-50%,-10px);opacity:0;background:var(--cream);border:2px solid var(--mint);border-radius:1rem;padding:.35rem .8rem .35rem .35rem;font-size:.78rem;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:.25s;pointer-events:none;width:max-content;max-width:94vw;display:flex;gap:.4rem;align-items:center}
.ann img{width:2rem;height:2rem;flex:none}.ann.show{opacity:1;transform:translate(-50%,0)}.ann.err{border-color:var(--pig);background:#FFF4F6}
.shade{position:fixed;inset:0;z-index:8;background:rgba(10,30,60,.5);opacity:0;pointer-events:none;transition:.2s}.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:9;left:50%;bottom:0;width:min(27rem,100vw);transform:translate(-50%,105%);transition:transform .18s ease-out;background:var(--cream);border:3px solid #fff;border-bottom:0;border-radius:1.6rem 1.6rem 0 0;padding:.9rem .9rem calc(env(safe-area-inset-bottom,0px) + 1.1rem);max-height:86vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
h3{margin:0 0 .3rem;font-size:1.02rem;text-align:center}.hint{font-size:.7rem;color:var(--soft);text-align:center;margin-bottom:.5rem}
.mem{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid #F3E9DE;border-radius:.9rem;padding:.35rem .6rem;margin-bottom:.3rem;font-size:.8rem}
.mem b{flex:1}.mem span{font-size:.68rem;color:#B9761F;font-weight:700}
.mem.me{border-color:#9EDDBE;background:#F1FBF6}
.opt{display:flex;align-items:center;gap:.6rem;width:100%;border:2px solid #fff;background:#fff;border-radius:1rem;padding:.5rem .7rem;margin-bottom:.35rem;font:inherit;color:var(--cocoa);cursor:pointer;text-align:left;box-shadow:0 3px 8px rgba(70,150,180,.12)}
.opt img{width:2.6rem;height:2.6rem;object-fit:contain}.opt b{flex:1;font-size:.85rem}.opt span{font-size:.72rem;font-weight:700;color:#B9761F}
.opt:disabled{opacity:.45}
.opt b small{display:block;font-size:.66rem;font-weight:600;color:var(--soft,#9A7A68)}
.sendq{display:flex;align-items:center;gap:.35rem;margin:.2rem 0 .1rem;font-size:.78rem;font-weight:700}
.sendq button{flex:1;border:2px solid #F3E9DE;background:#fff;border-radius:999px;padding:.3rem;font:inherit;font-size:.78rem;cursor:pointer;color:var(--cocoa)}
.sendq button.on{background:#FFE7A8;border-color:#F2C35A}
.combo{background:linear-gradient(180deg,#FFF8E6,#FFF);border:2px solid #FFE0A3;border-radius:1rem;padding:.45rem .6rem;margin:.3rem 0 .45rem}
.combo .ct{display:flex;justify-content:space-between;font-size:.8rem}.combo .ct span{font-weight:800;color:#B9761F}
.combo .cbar{height:.55rem;background:#F6E7C8;border-radius:999px;overflow:hidden;margin:.25rem 0}.combo .cbar i{display:block;height:100%;background:linear-gradient(90deg,#FFC85A,#F39A3A);border-radius:999px;transition:width .4s}
.combo .cm{display:flex;flex-wrap:wrap;gap:.25rem}.combo .cm span{position:relative;width:2rem;height:2rem;border-radius:.6rem;background:#fff;border:2px solid #F3E9DE;display:grid;place-items:center;font-size:.7rem;filter:grayscale(.8);opacity:.6}
.combo .cm span.ok{filter:none;opacity:1;border-color:#7ED6A0}.combo .cm img{width:1.6rem;height:1.6rem;object-fit:contain}.combo .cm span.ok::after{content:"✅";position:absolute;right:-.3rem;top:-.35rem;font-size:.6rem}
.combo small{display:block;font-size:.62rem;color:#9A7A68;margin-top:.2rem}
.stay{text-align:center}.stay .sh{font-size:1.05rem;font-weight:800;color:#D9506E;margin-bottom:.3rem}
.stay .q{background:#FFF6EE;border:2px dashed #F3C9A8;border-radius:1rem;padding:.5rem .6rem;font-size:.82rem;line-height:1.55;margin:.2rem 0 .4rem}
.scost{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin:.35rem 0}
.sc{background:#fff;border:2px solid #F3E9DE;border-radius:.9rem;padding:.3rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.05rem}
.sc img{width:1.9rem;height:1.9rem;object-fit:contain}.sc .e{font-size:1.5rem;line-height:1.9rem}.sc b{font-size:.62rem}.sc span{font-size:.78rem;font-weight:800}.sc small{font-size:.58rem;color:#9A7A68}
.sc.ok{border-color:#9EDDB6}.sc.no{border-color:#FFC7D3;background:#FFF4F6}.sc.no span{color:#D9506E}
.sgain{font-size:.82rem;margin:.2rem 0 .4rem}.sgain b{color:#3E9E6E}
.tg{display:grid;grid-template-columns:1fr auto;gap:.3rem;align-items:center;background:#fff;border:2px solid #F3E9DE;border-radius:.9rem;padding:.3rem .5rem;margin-bottom:.3rem}
.tg b{font-size:.8rem}.tg .bs{display:flex;gap:.2rem}
.tg .bs button{width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid #fff;background:#EEE;font:inherit;font-weight:800;font-size:.75rem;cursor:pointer;color:#fff}
.tg .bs button.on{box-shadow:0 0 0 2px var(--cocoa)}
.sum{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;margin-bottom:.5rem}.sum span{font-size:.68rem;font-weight:700;border-radius:999px;padding:.1rem .5rem;color:#fff}
.row{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0}
.btn{border:0;border-radius:999px;font:inherit;font-weight:700;font-size:.8rem;padding:.5rem .9rem;cursor:pointer;background:var(--aqua);color:#fff;box-shadow:0 3px 0 #3F98B6}
.btn.g{background:#6CC9A8;box-shadow:0 3px 0 #4DAA8A}.btn.r{background:#F39AB2;box-shadow:0 3px 0 #D97C96}.btn.gray{background:#EEE;color:var(--soft);box-shadow:none}
.log{font-size:.7rem;line-height:1.5;max-height:9rem;overflow:auto;background:#fff;border-radius:.8rem;padding:.4rem .6rem;border:2px solid #F3E9DE}
/* เปิดกล่อง */
.pop{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:rgba(10,25,55,.82);padding:1rem;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#popBody{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%}
.pop.on{display:flex}
.chest{width:min(16rem,70vw);aspect-ratio:1;background-size:400% 400%;cursor:pointer}
.pop h3{color:#fff;margin:.6rem 0 .2rem}.pop .hint{color:#dde}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;width:min(26rem,96vw)}
.tc{aspect-ratio:300/430;perspective:600px;cursor:pointer;opacity:0;transform:translateY(30px) scale(.8);transition:.35s}
.tc.in{opacity:1;transform:none}
.tc .i{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.tc.flip .i{transform:rotateY(180deg)}
.tc .f,.tc .k{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tc .f img,.tc .k img{width:100%;height:100%;object-fit:contain}
.tc .f{transform:rotateY(180deg)}
.tc.dim{opacity:.4}.tc.pick{transform:scale(1.08)}
.res{color:#fff;text-align:center;margin-top:.7rem;font-weight:700;font-size:.95rem;min-height:2.6rem}
.res small{display:block;font-weight:500;font-size:.75rem;opacity:.85}

.opt.sel{border-color:#9EDDBE;background:#F1FBF6}
.boat .tag{font-size:.8em;padding:.02rem .3rem}
.boat .num{font-size:1.25em}
.boat.mine::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,.55),rgba(255,240,170,0) 65%);animation:mg 1.8s ease-in-out infinite;pointer-events:none}
@keyframes mg{50%{transform:scale(1.15);opacity:.6}}
.boat .ripple{position:absolute;left:50%;top:60%;width:140%;aspect-ratio:2/1;transform:translate(-50%,-50%) scale(.3);border:2px solid rgba(255,255,255,.8);border-radius:50%;animation:rp .9s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.gift{width:6%}
.gift::before{content:"";position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,rgba(255,230,120,.75),rgba(255,230,120,0) 65%);animation:mg 1.2s ease-in-out infinite;z-index:-1}
.chest.burst{filter:drop-shadow(0 0 25px rgba(255,230,140,.95))}
.confetti{position:fixed;inset:0;z-index:30;pointer-events:none}

.picked{width:min(14rem,62vw);animation:pk .5s cubic-bezier(.3,1.5,.5,1)}
.picked img{width:100%;filter:drop-shadow(0 0 22px rgba(255,225,140,.8))}
@keyframes pk{from{transform:scale(.5) rotate(-8deg);opacity:0}}

.gift{transition:top 1.2s cubic-bezier(.3,.1,.3,1),left 1.2s}
.flash{position:fixed;inset:0;z-index:21;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,250,210,.95),rgba(255,230,140,.5) 30%,rgba(255,230,140,0) 65%);animation:fl .7s ease-out forwards}
@keyframes fl{from{opacity:0;transform:scale(.6)}25%{opacity:1}to{opacity:0;transform:scale(1.4)}}
.chest.burst{animation:cb .5s ease-out}
@keyframes cb{50%{transform:scale(1.12)}}
.tc.deal{transition:opacity .35s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.confetti i{position:absolute;top:-4%;width:.55rem;height:.9rem;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{top:105%;transform:rotate(720deg) translateX(3rem)}}
.px{position:absolute;top:calc(env(safe-area-inset-top,0px) + .6rem);right:.7rem;width:2.3rem;height:2.3rem;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:1rem;cursor:pointer}
.tagx{font-size:.66rem!important;color:#fff!important;background:#9AB7D0;border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.opt b small{display:block;font-size:.66rem;font-weight:500;color:var(--soft)}
.sec{font-weight:800;font-size:.75rem;margin:.5rem 0 .25rem}
.mem.out{opacity:.6}.mem.out span{color:#D45}
.pop .tgt{width:min(24rem,94vw);max-height:46vh;overflow:auto;margin-top:.6rem}
.kt{background:rgba(255,255,255,.95);border-radius:1rem;padding:.4rem .5rem;margin-bottom:.35rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.kt b{width:100%;font-size:.8rem}
.chipb{border:2px solid #F3E9DE;background:#fff;border-radius:999px;font:inherit;font-size:.75rem;padding:.2rem .6rem;cursor:pointer;color:var(--cocoa)}
.chipb.on{border-color:#F39AB2;background:#FFE3EA;font-weight:700}
.picked.sm{width:min(8rem,40vw)}
.pop .face{width:6rem;height:6rem;animation:pk .5s cubic-bezier(.3,1.5,.5,1)}
.pop .row .btn{font-size:.9rem;padding:.6rem 1.2rem}

/* ===== fix13: เอฟเฟกต์ฉาก (transform/opacity เท่านั้น เบาบนมือถือ) ===== */
.fxc{position:fixed;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none}
.boat{--d:0s}
.boat img.hull{position:relative;z-index:1;transform-origin:50% 70%;animation:rock 3.2s ease-in-out infinite;animation-delay:var(--d)}
@keyframes rock{0%,100%{transform:translateY(0) rotate(-1.6deg)}25%{transform:translateY(-3.5%) rotate(0deg)}50%{transform:translateY(-1%) rotate(1.8deg)}75%{transform:translateY(2%) rotate(0deg)}}
.boat .wake{position:absolute;left:50%;top:80%;width:320%;height:250%;background:radial-gradient(ellipse 9% 34% at 50% 0,rgba(255,255,255,.75),rgba(255,255,255,0) 100%);transform:translateX(-50%);pointer-events:none;z-index:0}
.boat .wake i{position:absolute;left:50%;top:0;width:34%;aspect-ratio:2.2/1;border:.3em solid rgba(255,255,255,.9);border-top-color:transparent;border-radius:50%;transform:translate(-50%,0) scale(.4);opacity:0;animation:wk 2.4s linear infinite;animation-delay:calc(var(--d) + var(--k,0s))}
.boat .wake i:nth-child(2){--k:.8s}.boat .wake i:nth-child(3){--k:1.6s}
@keyframes wk{0%{transform:translate(-50%,0) scale(.35);opacity:0}15%{opacity:.85}100%{transform:translate(-50%,95%) scale(1.5,1.2);opacity:0}}
.boat .wake::before,.boat .wake::after{content:"";position:absolute;top:-2%;width:2.4%;height:72%;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.5) 40%,rgba(255,255,255,0));border-radius:999px;transform-origin:50% 0;opacity:.85;animation:wv 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wv{50%{opacity:.35}}
.boat .wake::before{left:48.6%;transform:rotate(22deg)}.boat .wake::after{right:48.6%;transform:rotate(-22deg)}
.boat.surge img.hull{animation:surge .7s cubic-bezier(.25,1.4,.5,1),rock 3.2s ease-in-out .7s infinite}
@keyframes surge{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-14%) scale(1.06,.96) rotate(-2deg)}100%{transform:translateY(0) scale(1)}}
.boat.boost img.hull{filter:drop-shadow(0 0 .5em #6FF0A0) drop-shadow(0 4px 3px rgba(0,30,60,.35));animation:surge .8s cubic-bezier(.25,1.4,.5,1) 3,rock 3.2s ease-in-out 2.4s infinite}
.boat.boost .wake i{animation-duration:.9s;border-color:rgba(200,255,225,.95);border-top-color:transparent}
.boat.boost .wake::before,.boat.boost .wake::after{opacity:1;height:130%;background:linear-gradient(rgba(170,255,210,.95),rgba(170,255,210,0))}
.boat.hit img.hull{animation:hit .5s ease-in-out 2}
@keyframes hit{20%{transform:translateX(-8%) rotate(-7deg)}40%{transform:translateX(7%) rotate(6deg)}60%{transform:translateX(-5%) rotate(-3deg)}80%{transform:translateX(3%)}}
.boat .stopv{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(160,220,255,.35) 45%,rgba(90,170,240,.25) 70%);box-shadow:0 0 0 .14em rgba(200,235,255,.95) inset,0 0 .9em rgba(140,210,255,.8);z-index:3;inset:-14%;border-radius:50%}
.boat .stopv::after{content:"";position:absolute;inset:-12%;border-radius:50%;background:conic-gradient(#BFE9FF calc(var(--left,1)*360deg),rgba(255,255,255,.12) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - .22em),#000 calc(100% - .2em));mask:radial-gradient(farthest-side,transparent calc(100% - .22em),#000 calc(100% - .2em))}
.fxf{position:absolute;transform:translate(-50%,-50%);z-index:6;font-weight:800;font-size:2.6em;-webkit-text-stroke:.07em #1E4E86;paint-order:stroke fill;white-space:nowrap;pointer-events:none;text-shadow:0 .1em 0 rgba(20,50,90,.6),0 0 .4em rgba(0,0,0,.35);animation:fxf 1.4s ease-out forwards}
@keyframes fxf{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.line.glow{animation:lg 2.1s ease-out}
@keyframes lg{0%,60%{border-top-color:#FFE27A;box-shadow:0 0 .5em .15em rgba(255,226,122,.95),0 0 1.6em .3em rgba(255,200,80,.6)}100%{box-shadow:none}}
.gift.drop{animation:drop .75s cubic-bezier(.5,0,.75,0) both,gland .5s cubic-bezier(.3,1.6,.5,1) .75s both}
@keyframes drop{from{transform:translate(-50%,-50%) translateY(-55vh) rotate(-25deg);opacity:.2}to{transform:translate(-50%,-50%)}}
@keyframes gland{0%{transform:translate(-50%,-38%) scale(1.25,.75)}100%{transform:translate(-50%,-50%) scale(1)}}
.gift .tmr{position:absolute;left:50%;top:100%;transform:translateX(-50%);background:#2A2140;color:#FFE27A;border:.1em solid #fff;border-radius:999px;font-size:.55em;font-weight:800;padding:0 .35em;white-space:nowrap}
.gift .tmr.kick{background:#B0213F;color:#fff}
.fxpk{position:absolute;transform:translate(-50%,-50%);font-size:2.4em;z-index:6;pointer-events:none;animation:pkf .72s cubic-bezier(.55,0,.9,.4) both;filter:drop-shadow(0 .2em .2em rgba(0,0,0,.4))}
@keyframes pkf{from{transform:translate(-50%,-50%) translateY(-22em) rotate(-200deg) scale(.7)}to{transform:translate(-50%,-50%) rotate(0) scale(1.1)}}
.fxice{position:absolute;transform:translate(-50%,-50%);width:6em;aspect-ratio:1;z-index:5;pointer-events:none}
