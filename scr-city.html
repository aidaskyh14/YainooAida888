<style>#pgBig{display:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;text-align:center;font-weight:800;font-size:20px;line-height:1.5;color:#fff;padding:18px 24px;border-radius:22px;background:rgba(40,12,70,.72);backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.35);animation:pgIn .6s ease;max-width:86vw}

.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:linear-gradient(#fff9ee,#ffefd6);border-radius:24px 24px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 30px rgba(70,40,10,.3);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet.on{transform:none}.sheet h3{margin:0 0 6px;font-size:1.05rem;display:flex;align-items:center;gap:8px}.sheet h3 .x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#f3dcb8;color:#8a5a2e;font:800 15px sans-serif;box-shadow:0 2px 0 #d2ac78}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:.76rem;color:#8a6a5a}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.it{background:#fff;border:2px solid #f1e3d3;border-radius:14px;padding:6px 4px;text-align:center;font-size:.72rem;cursor:pointer}.it img{width:46px;height:46px;object-fit:contain}.it b{display:block;font-size:.7rem}.it small{color:#999}.it.on{border-color:#ff8fc0;background:#fff0f6}

#pg{left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 94px)}#pg .box{background:rgba(40,10,50,.82);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:18px;padding:10px 12px;font-size:.85rem}#pg .box h4{margin:0 0 4px;font-size:1rem;color:#ffd27a}

<div id="top" class="hud"><span class="pill" id="pFuel">⛽ —</span><span class="pill" id="pTime">🕒 —</span><span class="pill" id="pN">👥 —</span><span class="pill" id="pMsg" style="display:none"></span></div>
<div id="pg" class="hud"></div>
<div id="bar" class="hud"><button id="bHeart" class="r"><i>💗</i><span>หัวใจของฉัน</span></button><button id="bHome" class="y" style="display:none"><i>🏡</i><span>สามี</span></button><button id="bPg" class="b" style="display:none"><i>👑</i><span>ประกวด</span></button><button id="bMap" class="g"><i>🗺️</i><span>แผนที่</span></button><button id="bBack"><i>🌾</i><span>กลับฟาร์ม</span></button></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="shMan"></div><div class="sheet" id="shGift"></div><div class="sheet" id="shHeart"></div><div class="sheet" id="shHome"></div><div class="sheet" id="shBuild"></div><div class="sheet" id="shPg"></div>
<div id="toast"></div>
<div id="drive"><div class="t">🚗 กำลังขับรถไปนครยัยหนู…</div><div class="car">🚗</div></div>
<script type="module">
import {MEN,MAN,BUILDINGS,BUILDING,DATES,HARD,HARD_NAME,MOODS,PAGEANT,HOUSE_UP,KIDS,SEASONS,SEASON_DAYS,HEART,HEARTS,LOCK_HEARTS,IDLE_SOFT_MIN,IDLE_KICK_MIN,GIFT_KIND} from './city-public.js?h=6c06eee4';
import {CATALOG} from './catalog.js?h=751f4cba';
const Host=parent.__HOST;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const F=$('#s4f');const send=m=>{try{F.contentWindow.postMessage({city:m},'*');}catch(e){}};
const BY=Object.fromEntries(CATALOG.map(c=>[c.k,c]));const img=k=>BY[k]&&BY[k].i?('images/'+BY[k].i.replace(/^\.\.\/farm3d\//,'../farm3d/')):'';
let V=null,W=null,P=null,PRES=[],ADMIN=false,ME=Host?.uid||'',MYNAME='ผู้เล่น',men={},lastTap=Date.now(),sceneReady=false,curMan=null,pgLast=null;
const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms);};
const sheets=['shMan','shGift','shHeart','shHome','shBuild','shPg'];const open=id=>{sheets.forEach(s=>$('#'+s).classList.toggle('on',s===id));$('#veil').classList.add('on');};const closeAll=()=>{sheets.forEach(s=>$('#'+s).classList.remove('on'));$('#veil').classList.remove('on');};$('#veil').onclick=closeAll;
/* ---------- สถานะจากเซิร์ฟเวอร์ ---------- */
async function cloud(input){try{const out=await Host.cloud('city',input);if(out&&out.view)V=out.view;if(out&&out.world)W={...W,...out.world};paint();return out;}catch(e){toast(e.message||'ไม่สำเร็จ');throw e;}}
async function refresh(){try{let out=await Host.cloud('city',{type:'status'});if(out.sync)out=await Host.cloud('city',{type:'sync'});V=out.view;W={...W,...out.world};paint();}catch(e){toast(e.message||'โหลดไม่สำเร็จ');}}
function myBag(){try{return JSON.parse(Host.get('s3all-v1')||'{}').bag||{};}catch(e){return {};}}
function paint(){if(!V)return;$('#pFuel').textContent='⛽ '+V.fuel;$('#pN').textContent='👥 '+PRES.length;const d=V.seasonDay,sn=SEASONS[V.season||0];$('#pTime').textContent=(V.rain?'🌧️ ':'☀️ ')+sn+' วันที่ '+d;
 $('#bHome').style.display=V.husband?'':'none';$('#bPg').style.display=(P&&P.state!=='idle')?'':'none';send({c:'state',view:V,world:W,me:ME,admin:ADMIN,now:Date.now()});
 const pend=(V.husband&&V.husband.pend||[]);if(pend.length&&!$('#shHome').classList.contains('on'))setTimeout(()=>{if(!document.querySelector('.sheet.on'))openHome();},800);}
/* ---------- ผู้ชาย ---------- */
const heartsHtml=(h,lock,p)=>{let s='';for(let i=1;i<=HEARTS;i++){s+=i<=h?'❤️':(i===lock?'🔒':'🤍');}return '<span class="hearts">'+s+'</span> <small>'+(h<HEARTS?(p||0)+'/'+HEART:'ครบ')+'</small>';};
const moodImg=m=>m?'<img class="mood" src="images/city-mood-'+esc(m)+'.webp" alt="'+esc(MOODS[m]?.n||'')+'" title="'+esc(MOODS[m]?.n||'')+'">':'';
function openMan(id){curMan=id;const M=MAN[id];if(!M)return;const L=(V&&V.love&&V.love[id])||{h:0,p:0,dates:0,lock:0,hint:''};const st=men[id]||'walk';const mood=V&&V.moods&&V.moods[id];const hb=V&&V.husband&&V.husband.id===id;const ex=V&&(V.ex||[]).includes(id);const hard=HARD[M.hard]||HARD.mid;
 const B=BUILDING[M.work];const bday=M.bday===(V&&V.seasonDay);
 $('#shMan').innerHTML=`<h3>${moodImg(mood)} ${esc(M.name)} <small style="font-weight:500;color:#8a6a5a">${esc(M.job)} · ${esc(B?.n||'')}</small><button class="x" id="xMan">✕</button></h3>
  <div>${heartsHtml(L.h,L.lock,L.p)} ${hb?'<b style="color:#c2185b">💍 สามี</b>':ex?'<small>อดีตสามี</small>':''} <small>· ระดับ ${HARD_NAME[M.hard]}${bday?' · 🎂 วันเกิดวันนี้!':''}</small></div>
  <div class="say" id="say">${L.hint?esc(L.hint):'…'}</div>
  <div class="note">เดตแล้ว ${L.dates||0}/${hard.dates} ครั้ง${L.lock?' · ดวงที่ '+L.lock+' ติดล็อก: ต้องมาเจอเขา'+esc(L.hint.replace(/^.*ลองมาเจอฉัน/,'').replace(/สิ$/,'')||'ตามคำใบ้'):''}${L.bored?' · 😑 เขาเบื่อของซ้ำอยู่ (3 ชม.)':''}</div>
  <div class="row" style="margin-top:.5rem">${st==='walk'?`<button class="btn" id="mTalk">💬 คุย</button><button class="btn y" id="mGift">🎁 ให้ของ</button>${!hb?`<button class="btn g" id="mDate">☕ ชวนเดต</button>`:''}${!hb&&L.h>=HEARTS&&!V.husband?`<button class="btn" id="mRing" style="background:linear-gradient(#fff,#ffd27a);box-shadow:0 4px 0 #b9852a">💍 ขอแต่งงาน</button>`:''}`:`<span class="note">${st==='work'?'🏢 กำลังทำงานที่'+esc(B?.n||''):st==='rest'?'💤 กำลังพัก ไม่อยู่ในนคร':'💑 กำลังเดตกับคนอื่น'} · คุยและให้ของได้ตอนเขาเดินเล่นเท่านั้น</span>`}</div>`;
 open('shMan');$('#xMan').onclick=closeAll;
 const bt=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn;};
 bt('mTalk',async()=>{const o=await cloud({type:'talk',man:id});const t=o.talk;$('#say').textContent=t.hint||'…';if(t.unlocked)toast('💗 ปลดล็อกหัวใจดวงที่ '+t.unlocked+'!');else if(t.first)toast('+'+t.pts+' คะแนน (คุยครั้งแรกของวัน)');send({c:'act',man:id,act:'talk'});openMan(id);});
 bt('mGift',()=>openGift(id));bt('mDate',()=>openDate(id));bt('mRing',()=>propose(id));}
function openGift(id){const bag=myBag();const items=[];for(const c of CATALOG){if(!c.p)continue;const v=c.p.split('.').reduce((o,k)=>o?.[k],bag);const n=Math.floor(Number(v)||0);if(n>0&&isGift(c))items.push([c,n]);}
 $('#shGift').innerHTML=`<h3>🎁 ให้ของ ${esc(MAN[id].name)}<button class="x" id="xGift">✕</button></h3><p class="note">วันละ 3 ชิ้นต่อคน · ของเดิมซ้ำใน 3 ชม. เขาจะเบื่อ · ของที่เขาชอบต้องสังเกตจากบทพูด</p>${items.length?`<div class="grid">${items.map(([c,n])=>`<div class="it" data-k="${esc(c.k)}"><img src="${img(c.k)}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(c.n.replace(/^[^\p{L}\d]+/u,''))}</b><small>×${n}</small></div>`).join('')}</div>`:'<p>ไม่มีของที่ให้ได้ในกระเป๋า</p>'}`;
 open('shGift');$('#xGift').onclick=()=>openMan(id);$('#shGift').querySelectorAll('.it').forEach(e=>e.onclick=async()=>{e.classList.add('on');try{const o=await cloud({type:'gift',man:id,item:e.dataset.k});const g=o.gift;toast((g.pts>0?'+':'')+g.pts+' คะแนน'+(g.birthday?' 🎂×3':''));send({c:'act',man:id,act:g.pts>0?'happy':'sad'});openMan(id);$('#say').textContent=g.line;}catch(err){e.classList.remove('on');}});}
const isGift=c=>['ผัก','ดอกไม้','ผลไม้','หญ้า ไม้ หิน','ผลผลิตสัตว์','นก เม่น','อัลปาก้า','ไอเท็ม','อาหารบ้าน','เมนูมีคลาส','อาหารสวน','เครื่องดื่มป่า'].includes(c.g)&&!/^(tree-|license|fuel|collar|fert)/.test(c.k);
function openDate(id){const M=MAN[id];const hard=HARD[M.hard]||HARD.mid;const L=V.love[id]||{h:0};$('#shGift').innerHTML=`<h3>☕ ชวน${esc(M.name)}ไปเดต<button class="x" id="xGift">✕</button></h3><p class="note">ยิ่งแพงยิ่งได้คะแนนมาก · ระหว่างเดตเขาจะไม่ออกมาเดินในนคร · ต้องเดตครบ ${hard.dates} ครั้งก่อนขอแต่งงาน · สัปดาห์ละไม่เกิน 3 ครั้งต่อคน</p>
  ${Object.entries(DATES).map(([k,d])=>`<button class="btn" style="width:100%;margin:.25rem 0;text-align:left;background:#fff;box-shadow:0 3px 0 #e8c9d6" data-d="${k}" ${(d.minHearts&&L.h<d.minHearts)||L.h<2?'disabled':''}>${esc(d.n)} · ${d.h} ชม. · <b>${fmt(d.merit*hard.dateCost)}</b> กุศล${d.minHearts?' · ต้อง '+d.minHearts+' หัวใจ':''}</button>`).join('')}`;
 open('shGift');$('#xGift').onclick=()=>openMan(id);$('#shGift').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const o=await cloud({type:'date',man:id,place:b.dataset.d});toast('💑 ไปเดตที่'+DATES[b.dataset.d].n+' · กลับ '+new Date(o.date.until).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));send({c:'act',man:id,act:'date',place:b.dataset.d});closeAll();});}
function propose(id){const M=MAN[id];if(!(V.ring>0))return toast('ไม่มีแหวน (ได้จากยัยหนูเท่านั้น)');$('#shGift').innerHTML=`<h3>💍 ขอ${esc(M.name)}แต่งงาน<button class="x" id="xGift">✕</button></h3><p>แหวนจะหายไป 1 วง · ถ้าให้ผิดคน แหวนหาย · ยืนยัน 2 ชั้น</p><p>พิมพ์ชื่อ <b>${esc(M.name)}</b> เพื่อยืนยัน</p><input id="ringName" style="width:100%;padding:.5rem;border-radius:12px;border:2px solid #f1e3d3;font:inherit"><div class="row" style="margin-top:.5rem"><button class="btn gray" id="ringNo">ยกเลิก</button><button class="btn y" id="ringYes">มอบแหวน</button></div>`;
 open('shGift');$('#xGift').onclick=$('#ringNo').onclick=()=>openMan(id);$('#ringYes').onclick=async()=>{if($('#ringName').value.trim()!==M.name)return toast('ชื่อไม่ตรง');if(!confirm('ยืนยันขอ'+M.name+'แต่งงาน? (ชั้นที่ 2)'))return;const o=await cloud({type:'propose',man:id,confirm:id});toast('💒 เขาตอบตกลง! งานแต่งจะเริ่มในอีกสักครู่ ทุกคนจะเห็น');send({c:'act',man:id,act:'propose'});closeAll();};}
/* ---------- ตารางหัวใจ ---------- */
function openHeart(){const rows=MEN.map(m=>{const L=(V.love||{})[m.id]||{h:0,p:0,dates:0,lock:0};return {m,L};}).sort((a,b)=>(b.L.h-a.L.h)||(b.L.p-a.L.p)||(a.m.no-b.m.no));
 $('#shHeart').innerHTML=`<h3>💗 หัวใจของฉัน<button class="x" id="xH">✕</button></h3><p class="note">${V.husband?'💍 สามี: <b>'+esc(V.husband.name)+'</b> · ':''}${(V.ex||[]).length?'อดีตสามี: '+V.ex.map(x=>esc(MAN[x]?.name)).join(', ')+' · ':''}วันเกิดวันนี้: ${MEN.filter(m=>m.bday===V.seasonDay).map(m=>esc(m.name)).join(', ')||'—'}</p>
  <table>${rows.map(({m,L})=>`<tr data-m="${m.id}" style="cursor:pointer"><td>${moodImg(V.moods&&V.moods[m.id])}</td><td><b>${esc(m.name)}</b><br><small>${esc(m.job)} · ${esc(BUILDING[m.work]?.n||'')} · ${HARD_NAME[m.hard]}</small></td><td>${heartsHtml(L.h,L.lock,L.p)}<br><small>${({walk:'🚶 เดินเล่น',work:'🏢 ทำงาน',rest:'💤 พัก',date:'💑 เดต'})[men[m.id]||'rest']} · เดต ${L.dates||0} · 🎂 วันที่ ${m.bday}</small></td></tr>`).join('')}</table>`;
 open('shHeart');$('#xH').onclick=closeAll;$('#shHeart').querySelectorAll('tr[data-m]').forEach(tr=>tr.onclick=()=>openMan(tr.dataset.m));}
/* ---------- สามี / บ้าน / ลูก ---------- */
function openHome(){const h=V.husband;if(!h)return;const M=MAN[h.id];const lv=h.house?.lv||1,up=h.house?.up;const next=HOUSE_UP[lv+1];

 else if(['quiz','final'].includes(P.state)){h+=P.quiz?(me&&me.alive?(P.quiz.answered.includes(ME)?'ตอบแล้ว ✅':'<b>❓ มีคำถาม! กด 👑 ตอบ</b>'):'❓ '+esc(P.quiz.q)):'รอคำถามถัดไป';}
 else if(P.state==='count')h+='⚖️ กรรมการกำลังประมวลผลคะแนน…';else if(P.state==='result'&&P.result)h+='🥇 '+esc(P.result[0]?.name||'')+' · 🥈 '+esc(P.result[1]?.name||'')+' · 🥉 '+esc(P.result[2]?.name||'');
 h+='</div>';box.innerHTML=h;
 /* เปิดหน้าตอบ/โชว์ทันทีเมื่อมีคำถามใหม่ */const key=P.state+':'+(P.quiz?P.quiz.id:'')+':'+(P.talent?P.talent.round:'');if(key!==pgLast){pgLast=key;if(me&&me.alive&&((P.quiz&&!P.quiz.answered.includes(ME))||(P.talent&&P.state==='thai'&&!P.talent.done.includes(ME))))openPg();if(P.state==='result')openPg();}}
function openPg(){if(!P||P.state==='idle')return;const me=P.contestants&&P.contestants[ME];const now=Date.now();const list=Object.entries(P.contestants||{}).sort((a,b)=>a[1].no-b[1].no);

 else if(P.state==='thai'&&P.talent&&me&&me.alive&&!P.talent.done.includes(ME)){if(pgTalentSeq.join()!==P.talent.seq.join()){pgTalentSeq=P.talent.seq.slice();pgTalentPick=[];}const shuf=pgTalentSeq.map((k,i)=>[k,i]).sort((a,b)=>((a[1]*7919+P.talent.round*31)%13)-((b[1]*7919+P.talent.round*31)%13));

 else{h+=`<table>${list.map(([u,c])=>`<tr style="${c.alive?'':'opacity:.45'}"><td><b>${c.no}</b></td><td>${esc(c.name)}${u===ME?' (ฉัน)':''}${c.gray?' สละสิทธิ์':''}</td><td class="${P.state==='final'||P.state==='count'?'blur':''}">${c.total==null?'??':c.total}</td><td>🌸${c.garland||0}</td><td>${!me&&c.alive&&P.state!=='idle'?`<button class="btn" style="padding:.3rem .5rem;font-size:.75rem" data-g="${esc(u)}">🌸 50,000</button>`:''}</td></tr>`).join('')}</table>${P.result?'<p>🏆 '+P.result.map(r=>r.rank+'. <b>'+esc(r.name)+'</b> '+r.total).join(' · ')+'</p>':''}${me&&me.alive&&!['result','party'].includes(P.state)?'<button class="btn gray" id="pgLeave" style="margin-top:.5rem">🚪 สละสิทธิ์</button>':''}`;}

function pageantLite(p){/* เอกสารโลกมีเฉลย → ตัดก่อนใช้ (ผู้เล่นไม่มีทางเห็น) */const V={state:p.state,startAt:p.startAt,round:p.round||0,n:Object.keys(p.contestants||{}).length,contestants:Object.fromEntries(Object.entries(p.contestants||{}).map(([u,c])=>[u,{no:c.no,name:c.name,o:c.o,oThai:c.oThai,oSwim:c.oSwim,tribe:c.tribe,alive:c.alive,gray:!!c.gray,garland:c.garland||0,total:(p.state==='final'||p.state==='count')?null:Math.round(([...(c.scores?.talent||[]),...(c.scores?.quiz||[]),...(c.scores?.final||[])].reduce((a,b)=>a+b,0))*100)/100,paid:!!c.paid}])),lights:p.lights?{out:p.lights.out||[],paid:p.lights.paid||[]}:null,talent:p.talent?{round:p.talent.round,seq:p.talent.seq,startAt:p.talent.startAt,done:Object.keys(p.talent.done||{})}:null,quiz:p.quiz?{id:p.quiz.id,q:p.quiz.q,choices:p.quiz.choices,startAt:p.quiz.startAt,answered:Object.keys(p.quiz.answers||{})}:null,result:p.result||null,swimAt:p.swimAt||0,countAt:p.countAt||0,resultAt:p.resultAt||0,partyAt:p.partyAt||0};return V;}
refresh();setInterval(()=>{if(!document.hidden)refresh();},90000);/* ส่งตำแหน่งต่ออายุทุก 2 นาที ทำในฉาก */
