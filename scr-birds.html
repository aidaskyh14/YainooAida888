function foodOpts(sp,n,mode,id){return Object.entries(FOOD).filter(([,f])=>f[0]===sp).map(([k,f])=>{const need=f[2]*n;return '<button class="opt" data-food="'+k+'" data-mode="'+mode+'" data-id="'+(id||'')+'"'+(S.food[k]<need?' disabled':'')+'><img src="'+IMG['f-'+k]+'"><b>'+f[1]+'<small>'+f[4].map(([p,q])=>'⭐'.repeat(TIER[p])+' '+PN[p]).join(' หรือ ')+' ×'+f[4][0][1]+' • รอ '+f[3]+' นาที • '+f[2]+' ชิ้น/ตัว</small></b><span>ใช้ '+need+' • มี '+S.food[k]+'</span></button>'}).join('')}
function tapBird(id){const b=S.pens[pen].find(x=>x.id===id);if(!b)return;const cd=b.cd-NOW();
 open('<h3>'+SP[b.sp].e+' '+SP[b.sp].n+'</h3><div class="hint">⏳ อายุเหลือ '+fmtL(left(b))+(pen===1?' • 📜 ได้จากการล่อนก':'')+'</div>'+(cd>0?'<div class="hint" style="font-weight:700">🍽️ ให้อาหารได้อีกใน '+Math.ceil(cd/MIN)+' นาที</div>':'<div class="hint">🥣 เลือกอาหาร</div>'+foodOpts(b.sp,1,'one',b.id))+
  (pen===2?'<div class="row" style="margin-top:.5rem"><button class="btn gray" id="sell">💸 ขายออก (+'+(b.sp==='dodo'?30:20)+' กุศล)</button></div>':''));
 if($('sell'))$('sell').onclick=()=>open('<h3>💸 ขาย'+SP[b.sp].n+'ตัวนี้?</h3><div class="hint">ขายแล้วเอาคืนไม่ได้ • ผลผลิตบนพื้นยังอยู่</div><div class="row"><button class="btn gray" id="sn">ไม่ขาย</button><button class="btn" id="sy">ขายออก</button></div>'),setTimeout(()=>{if(!$('sy'))return;$('sn').onclick=closeAll;$('sy').onclick=()=>{S.pens[2]=S.pens[2].filter(x=>x.id!==id);S.merit+=b.sp==='dodo'?30:20;save();closeAll();draw();ann('💸 ขาย'+SP[b.sp].n+'แล้ว')}},0)}
document.addEventListener('click',e=>{const bt=e.target.closest('#sb [data-food]');if(!bt||bt.disabled)return;const k=bt.dataset.food,f=FOOD[k];
 const list=bt.dataset.mode==='one'?S.pens[pen].filter(b=>b.id===bt.dataset.id):S.pens[pen].filter(b=>b.sp===f[0]&&b.cd<=NOW());const need=f[2]*list.length;if(!list.length||S.food[k]<need)return;
 S.food[k]-=need;list.forEach(b=>{b.cd=NOW()+f[3]*MIN;const a=actors.find(x=>x.b.id===b.id);const[ox,oy]=a?[a.x,a.y]:rndPt();const[p,q]=f[4][Math.floor(Math.random()*f[4].length)];
  S.drops[pen].push({k:p,q,x:Math.max(80,Math.min(860,ox+(Math.random()*90-45))),y:Math.max(500,Math.min(1250,oy+10+Math.random()*30))});if(a)a.b.cd=b.cd});
 save();closeAll();drawDrops();ann('🥣 ให้'+f[1]+' '+list.length+' ตัว ผลผลิตหล่นบนพื้นแล้ว!');if(bt.dataset.mode==='all'&&S.pens[pen].some(b=>b.cd<=NOW()))setTimeout(feedAll,350)});
function collect(idx){const D=S.drops[pen];const take=idx?idx.map(i=>D[i]).filter(Boolean):D.slice();if(!take.length)return ann('ไม่มีของบนพื้น',1);const got={};take.forEach(d=>{got[d.k]=(got[d.k]||0)+d.q;S.bag[d.k]=(S.bag[d.k]||0)+d.q});
 S.drops[pen]=idx?D.filter((d,i)=>!idx.includes(i)):[];save();drawDrops();
 if(idx&&idx.length===1){const[k,q]=Object.entries(got)[0];return ann('🧺 เก็บ'+PN[k]+' ×'+q+' เข้ากระเป๋าแล้ว')}
 const list=Object.entries(got).sort((a,b)=>TIER[b[0]]-TIER[a[0]]);open('<h3>🧺 เก็บของบนพื้นแล้ว!</h3><div class="grid">'+list.map(([k,q])=>'<div class="cell t'+(TIER[k]-1)+'"><img src="'+IMG[k]+'"><b>'+'⭐'.repeat(TIER[k])+'<br>'+PN[k]+'</b><span>×'+q+'</span></div>').join('')+'</div><div class="row"><button class="btn g" id="okc">เยี่ยมเลย</button></div>');$('okc').onclick=closeAll}
function feedAll(){const hungry=S.pens[pen].filter(b=>b.cd<=NOW());const os=hungry.filter(b=>b.sp==='ostrich').length,dd=hungry.filter(b=>b.sp==='dodo').length;
 if(!hungry.length)return ann('ยังไม่มีนกที่พร้อมกิน รอ ⏳ ก่อนนะ',1);
 open('<h3>🥣 ให้อาหารทั้งหมด</h3><div class="hint">นกพร้อมกิน '+hungry.length+' จาก '+S.pens[pen].length+' ตัว (🦢 '+os+' • 🦤 '+dd+')</div>'+(os?'<div class="hint" style="font-weight:700">🦢 นกกระจอกเทศ '+os+' ตัว</div>'+foodOpts('ostrich',os,'all'):'')+(dd?'<div class="hint" style="font-weight:700;margin-top:.4rem">🦤 นกโดโด้ '+dd+' ตัว</div>'+foodOpts('dodo',dd,'all'):''))}
function needHTML(o){let ok=true;const h=Object.entries(o).map(([k,q])=>{const have=S.mats[k]||0;if(have<q)ok=false;let c=null;try{c=__H.catalogName?.(k)||__H.catalogName?.(k.replace(/จันทร์$/,''));}catch(e){}const im=c?.i?'<img src="images/'+c.i+'" alt="" style="width:1.3em;height:1.3em;object-fit:contain;vertical-align:middle;margin-right:.15em" onerror="this.remove()">':'';return '<span class="'+(have<q?'no':'')+'">'+im+k+' '+have+'/'+q+'</span>'}).join('');return[ok,h]}
function openScroll(){if(pen!==1)go(1);open('<h3>📜 ร่างคัมภีร์ล่อนก</h3><div class="hint">เลือกนกที่อยากล่อ • หักวัตถุดิบทันทีตอนร่าง • วัตถุดิบเป็นของชั่วคราว</div>'+['ostrich','dodo'].map(sp=>{const[ok,h]=needHTML(SCROLL[sp].need);return '<button class="opt" data-sc="'+sp+'"'+(ok?'':' disabled')+'><img src="'+IMG['scroll-'+sp]+'"><b>คัมภีร์ล่อ'+SP[sp].n+'<small><span class="need" style="justify-content:flex-start">'+h+'</span></small></b></button>'}).join(''));
 document.querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>sendScroll(x.dataset.sc))}
let scrollBusy=false;
async function sendScroll(sp){if(scrollBusy)return;scrollBusy=true;document.querySelectorAll('[data-sc]').forEach(b=>b.disabled=true);
 const done=()=>{S.sent[0]++;save();closeAll();draw();ann('📜 ส่งคัมภีร์ล่อ'+SP[sp].n+'แล้ว รอยัยหนูอนุมัติ อนุมัติแล้วนกเข้าคอก 1 • ถ้าปฏิเสธ กุศลปลอบใจเข้าไปรษณีย์')};
 try{
  if(__H&&typeof __H.lureRequest==='function'){
   const out=await __H.lureRequest(sp);
   // The server deducted the materials and created the request in one transaction: take its amounts.
   if(!out||!out.legacy){const fresh=JSON.parse(__H.get(KEY)||'null');if(fresh&&fresh.mats)S.mats=fresh.mats;if(fresh&&typeof fresh.merit==='number')S.merit=fresh.merit;done();return;}
  }
  Object.entries(SCROLL[sp].need).forEach(([k,q])=>S.mats[k]-=q);if(__H)__H.birdReq(sp);done();
 }catch(e){closeAll();ann('ส่งคำขอไม่สำเร็จ: '+(e&&e.message||'ลองใหม่อีกครั้ง'),1,6000)}
 finally{scrollBusy=false}}
function openCraft(){open('<h3>🍽️ คราฟอาหารนก</h3><div class="hint">ใช้ผักจากแปลง • สำเร็จ 100% • ทีละ 10 ถ้วย • สูตรชั่วคราว</div>'+Object.entries(FOOD).map(([k,f])=>{const n10=Object.fromEntries(Object.entries(FOODNEED[k]).map(([a,q])=>[a,q*10]));const[ok,h]=needHTML(n10);return '<button class="opt" data-cf="'+k+'"'+(ok?'':' disabled')+'><img src="'+IMG['f-'+k]+'"><b>'+f[1]+' ×10<small><span class="need" style="justify-content:flex-start">'+h+'</span></small></b><span>มี '+S.food[k]+'</span></button>'}).join(''));
 document.querySelectorAll('[data-cf]').forEach(x=>x.onclick=()=>{const k=x.dataset.cf;Object.entries(FOODNEED[k]).forEach(([a,q])=>S.mats[a]-=q*10);S.food[k]+=10;save();closeAll();showCraftResult({title:'คราฟอาหารนก',results:Array(10).fill(true),outputs:[{name:FOOD[k][1],image:IMG['f-'+k],quantity:10}],consumed:Object.entries(FOODNEED[k]).map(([a,q])=>({name:a,quantity:q*10}))},openCraft)})}
function openVault(){if(S.pens[2].length>=10)return ann('คอก 2 เต็ม 10 ตัวแล้ว',1);open('<h3>🦤 คลังนก</h3><div class="hint">ปล่อยลงคอก 2 แล้ว<b>นับอายุ 48 ชม. ทันที</b> และเอาคืนไม่ได้</div>'+['ostrich','dodo'].map(sp=>'<button class="opt" data-pv="'+sp+'"'+(S.vault[sp]<1?' disabled':'')+'><span style="width:2.6rem;height:2.6rem;flex:none;background:url('+IMG[sp+'-idle']+') 0 0/400% 400%"></span><b>'+SP[sp].n+'</b><span>มี '+S.vault[sp]+' ตัว</span></button>').join(''));
 document.querySelectorAll('[data-pv]').forEach(x=>x.onclick=()=>{const sp=x.dataset.pv;open('<h3>ยืนยันปล่อย'+SP[sp].n+'?</h3><div class="hint">อายุ 48 ชม. เริ่มนับทันที ยกเลิกไม่ได้</div><div class="row"><button class="btn gray" id="pn">ยกเลิก</button><button class="btn g" id="py">ปล่อยเลย</button></div>');$('pn').onclick=closeAll;$('py').onclick=()=>{S.vault[sp]--;S.pens[2].push(mk(sp,NOW()));save();closeAll();draw();ann(SP[sp].e+' ปล่อย'+SP[sp].n+'ลงคอก 2 แล้ว!')}})}
function openAdmin(){const W8=S.reqs.filter(r=>r.status==='wait');open('<h3>👑 ศูนย์แอดมิน • คำขอล่อนก</h3><div class="hint">(ในเกมจริงอยู่ในศูนย์แอดมิน) • มดแดง คอก 1: '+S.pens[1].length+'/10</div>'+(W8.length?W8.map(r=>'<div class="req"><img src="'+IMG['scroll-'+r.sp]+'"><b>มดแดง<br><small>ล่อ'+SP[r.sp].n+'</small></b><button class="btn g" data-ok="'+r.id+'">อนุมัติ</button><button class="btn" style="background:#F39AB2;box-shadow:0 3px 0 #D97C96" data-no="'+r.id+'">ปฏิเสธ</button></div>').join(''):'<div class="hint">ไม่มีคำขอรออยู่</div>')+
 '<h3 style="margin-top:.8rem">🏆 แรงค์นักล่อนก</h3>'+Object.entries({...S.rank,'มดแดง':S.sent}).sort((a,b)=>b[1][0]-a[1][0]).map(([n,v],i)=>'<div class="req"><b>'+(['🥇','🥈','🥉'][i]||i+1)+' '+n+'</b><span style="font-size:.68rem">ส่ง '+v[0]+' • ✅'+v[1]+' • ❌'+v[2]+' • 🕊️'+v[3]+'</span></div>').join(''));
 document.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>decide(x.dataset.ok,true));document.querySelectorAll('[data-no]').forEach(x=>x.onclick=()=>decide(x.dataset.no,false))}
function decide(id,ok){const r=S.reqs.find(x=>x.id===id);const g=100+Math.floor(Math.random()*101);
 if(ok&&S.pens[1].length<10){S.pens[1].push(mk(r.sp,NOW()));r.status='ok';S.sent[1]++;save();openAdmin();if(pen===1)draw();ann('📮 แจ้งเตือนผู้เล่น: 🎉 คำขอได้รับอนุมัติ! '+SP[r.sp].n+'บินมาอยู่ในคอก 1 แล้ว',0,9000)}
 else if(ok){r.status='flew';S.merit+=g;S.sent[3]++;save();openAdmin();ann('📮 แจ้งเตือนผู้เล่น: 🕊️ คำขอได้รับอนุมัติ แต่คอก 1 ไม่มีที่ว่าง '+SP[r.sp].n+'เลยบินหนีไปแล้ว เสียใจด้วยนะคะ • ได้กุศลปลอบใจ +'+g,1,9000)}
 else{r.status='no';S.merit+=g;S.sent[2]++;save();openAdmin();ann('📮 แจ้งเตือนผู้เล่น: เสียใจด้วยค่ะ '+SP[r.sp].n+'ไม่ชอบคุณ การล่อนกครั้งนี้ไม่สำเร็จ • ได้กุศลปลอบใจ +'+g,1,9000)}}

 $('gift').onclick=()=>{S.vault.ostrich+=2;S.vault.dodo+=2;save();closeAll();draw();ann('🎁 รับนกจากกล่องของขวัญ เข้าคลังนกแล้ว')};$('nocd').onclick=()=>{Object.values(S.pens).flat().forEach(b=>b.cd=0);save();closeAll();ann('ข้ามเวลารอแล้ว')};$('rst').onclick=()=>{S=fresh();pen=1;save();closeAll();draw()}}
