<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>แรลลี่ฟักทอง – ในสวนของยัยหนู</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a portrait game screen like the other minigames — lobby → canvas race → results, all inside one 9:16 stage on a dark purple ground. Single look (night Halloween), matching the game's Mali/Itim and cream panels. */
:root{--cocoa:#6E4B3A;--soft:#9A7A68;--cream:#FFFBF5;--line:#F3E9DE;--grape:#2A1840;--pump:#F28C28;--gold:#FFC94D;--mint:#6CC9A8;--pink:#F27E9B;--red:#E5534B;--disp:'Itim','Mali',sans-serif;--body:'Mali',system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120A1E;font-family:var(--body);color:#fff;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#1A0F2B;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* lobby */
#lobby{background:url(images/funrun/fr-poster.webp) center/cover;flex-direction:row}
#lobby::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(26,15,43,.15),rgba(26,15,43,.35) 45%,rgba(26,15,43,.85) 60%)}
.lt{position:relative;flex:1;text-align:center;padding:3% 2% 0;display:flex;flex-direction:column;align-items:center}
.lt .back{margin-top:auto;margin-bottom:4%;border:2px solid rgba(255,255,255,.6);background:rgba(26,15,43,.7);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12px}
.lt h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(26px,9vw,40px);color:#FFE08A;text-shadow:0 3px 0 #6A2C9E,0 0 18px rgba(255,180,60,.6)}
.lt p{margin:.15rem 0 0;font-size:12px;font-weight:700;opacity:.9}

.room{position:relative;width:min(48%,420px);margin-left:auto;overflow:auto;background:linear-gradient(180deg,rgba(58,30,92,.88),rgba(24,12,42,.95));backdrop-filter:blur(8px);color:#F5EAFF;border-left:2px solid rgba(255,201,77,.55);border-radius:24px 0 0 24px;padding:10px 12px 12px;box-shadow:-10px 0 30px rgba(120,60,200,.35)}
.fee{display:flex;gap:6px;justify-content:center;margin:0 0 8px;font-size:11px;font-weight:800}
.fee span{background:rgba(255,255,255,.1);border:1px solid rgba(255,201,77,.4);border-radius:999px;padding:2px 9px;color:#FFE08A}
.rw{font-size:10.5px;font-weight:800;color:var(--soft)}
.rw.p{color:#2F8F6C}.rw.n{color:#D2463C}
.room h2{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.room h2 span{margin-left:auto;font-family:var(--body);font-size:11px;font-weight:800;background:rgba(255,201,77,.18);color:#FFE08A;border-radius:999px;padding:2px 8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{min-height:64px!important;position:relative;background:radial-gradient(circle at 50% 35%,rgba(255,170,80,.22),rgba(255,255,255,.05) 70%);color:#fff;border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:4px 2px 5px;text-align:center;font-size:10px;font-weight:800;min-height:78px}
.slot img{width:100%;height:52px;object-fit:contain}
.spr{display:block;margin:0 auto;width:52px;height:52px;background-size:1600% 100%;background-repeat:no-repeat;animation:spr 1.4s steps(15) infinite}
.spr.big{width:84px;height:84px;animation-duration:1.1s}
@keyframes spr{from{background-position:0 0}to{background-position:100% 0}}
.slot.empty{border-style:dashed;color:rgba(255,255,255,.35);display:grid;place-items:center;font-size:20px}
.slot .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-size:12px;border:2px solid #fff}
.slot.me{border-color:#FFC94D;background:radial-gradient(circle at 50% 35%,rgba(255,201,77,.4),rgba(255,140,40,.1) 70%);box-shadow:0 0 14px rgba(255,180,60,.5)}
.pick{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.pick button{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);padding:2px}
.pick button img{width:100%;height:100%;object-fit:contain}
.pick button[aria-pressed="true"]{border-color:#FFC94D;background:rgba(255,201,77,.22);box-shadow:0 0 12px rgba(255,180,60,.6)}
.ready{margin-top:8px;width:100%;border:0;border-radius:16px;padding:12px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(180deg,#FFB14A,#F07A1E);box-shadow:0 4px 0 #A9480E,0 0 18px rgba(255,140,40,.5);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.ready.wait{background:rgba(255,255,255,.12);color:#E7DBF7;box-shadow:none}
.cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:90px;color:#FFE08A;text-shadow:0 6px 0 #6A2C9E,0 0 30px rgba(255,180,60,.7);pointer-events:none}
.cd span{animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}

/* hud */
#hud{position:absolute;inset:0;pointer-events:none}
#game,#game *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{touch-action:manipulation;overscroll-behavior:none}
canvas{will-change:contents}
@keyframes gshake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
.aim{position:absolute;right:3%;bottom:15%;display:flex;gap:6px;pointer-events:auto}
.aim button{border:3px solid #fff;border-radius:999px;background:linear-gradient(180deg,#B9C2D9,#7E88A6);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.feed{position:absolute;left:3%;top:9%;display:grid;gap:3px;max-width:62%}
.feed div{background:rgba(26,15,43,.72);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:800;color:#fff;animation:fin .25s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed div.me{background:rgba(229,35,63,.85)}
@keyframes fin{from{transform:translateX(-20px);opacity:0}}
.hearts{position:absolute;left:3%;top:3%;display:flex;gap:2px}
.hearts img{width:26px}
.slotbtn{position:absolute;right:3%;bottom:4%;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#FFE6CF);box-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.4);display:grid;place-items:center;pointer-events:auto}
.slotbtn img{width:46px}
.slotbtn.empty{opacity:.45}
.jumpbtn{position:absolute;left:3%;bottom:4%;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#E4F7EF);box-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.4);display:grid;place-items:center;font-size:24px;pointer-events:auto;color:var(--cocoa)}
.rank{position:absolute;right:3%;top:3%;display:grid;gap:3px;font-size:10px;font-weight:800}
.rank div{display:flex;align-items:center;gap:4px;background:rgba(26,15,43,.7);border-radius:999px;padding:1px 8px 1px 2px}
.rank img{width:20px;height:20px;object-fit:contain}
.rank .me{background:rgba(242,140,40,.9)}
.rank .out{opacity:.45;text-decoration:line-through}
.prog{position:absolute;left:24%;right:24%;top:5%;height:8px;border-radius:9px;background:rgba(255,255,255,.2)}
.prog i{position:absolute;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background-size:cover;border:2px solid #fff}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);font-size:28px;color:#FFE08A;text-shadow:0 3px 0 #6A2C9E,0 0 14px rgba(0,0,0,.5);animation:pop 1.6s ease-out forwards}

/* results */
#results{background:radial-gradient(circle at 50% 30%,#4A2A78,#120A20 75%);display:grid!important;grid-template-columns:40% 1fr;grid-template-rows:auto auto 1fr auto;column-gap:3%;align-items:start;padding:2.5% 3%}
#results[hidden]{display:none!important}
#results h1,#results .timer,#results .podium{grid-column:1}
#results .list{grid-column:2;grid-row:1/4;overflow:auto;max-height:100%}
#results .home{grid-column:1}
#results h1{margin:0;font-family:var(--disp);font-weight:400;font-size:30px;color:#FFE08A;text-shadow:0 3px 0 #6A2C9E}
.timer{font-size:11px;opacity:.85;margin:2px 0 8px}
.podium{display:flex;align-items:flex-end;gap:6px;margin-bottom:10px}
.pod{text-align:center;font-size:11px;font-weight:800}
.pod img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto}
.pod .b{border-radius:10px 10px 0 0;color:#fff;font-family:var(--disp);font-size:22px;display:grid;place-items:center}
.list{width:100%;align-self:stretch;background:rgba(255,251,245,.97);color:var(--cocoa);border-radius:18px;padding:8px 10px;display:grid;gap:4px}
.row{display:grid;grid-template-columns:22px 30px 1fr auto;gap:6px;align-items:center;font-size:11px;padding:3px 0;border-bottom:1.5px dashed var(--line)}
.row:last-child{border-bottom:0}
.row img{width:30px;height:30px;object-fit:contain}
.row .sc{display:flex;gap:4px;color:var(--soft);font-weight:700;font-size:10px}
.row b{font-family:var(--disp);font-weight:400;font-size:16px;color:#B8601A;text-align:right;min-width:40px}
.row.me{background:#FFF3E3;border-radius:10px}
.home{margin-top:10px;width:100%;border:0;border-radius:16px;padding:12px;font-weight:800;font-size:15px;color:#fff;background:var(--pump);box-shadow:0 4px 0 #B8601A}
.conf{position:absolute;top:-5%;font-size:18px;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><style>
#rot{position:fixed;inset:0;z-index:90;background:#120A1E;color:#FFE08A;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--disp);font-size:22px;text-align:center;padding:20px}
#rot span{font-size:64px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
.minbal{font-size:10.5px;font-weight:700;text-align:center;margin:-2px 0 6px;color:#E7DBF7}
.adm{position:absolute;top:8px;left:8px;z-index:3;border:2px solid #fff;border-radius:999px;background:rgba(229,83,75,.9);color:#fff;font-weight:800;font-size:11px;padding:4px 10px}
.wait{font-size:12px;font-weight:800;text-align:center;color:#FFE08A;margin-top:6px}
.slot.r{opacity:.55}
.lead{position:absolute;right:3%;top:24%;font-size:11px;font-weight:800;background:rgba(26,15,43,.7);border-radius:999px;padding:2px 9px}
</style></head><body>
<div id="rot"><span>📱</span>หมุนมือถือเป็นแนวนอน<small style="font-family:var(--body);font-size:13px;color:#E7DBF7">แรลลี่ฟักทองเล่นแนวนอน เห็นทางข้างหน้าได้ไกลกว่า</small></div>
<div id="wrap">
  <section class="scr" id="lobby">
    <div class="lt"><h1>🎃 แรลลี่ฟักทอง</h1><p>ห้องละ 6 คน · ครบแล้วทุกคนกดพร้อม → เริ่มใน 10 วินาที</p><button class="back" id="back">‹ กลับหน้ามินิเกม</button></div>
    <div class="room">
      <h2>🚪 ห้องแข่ง · 3 ด่าน <span id="cnt">0/6</span></h2>
      <div class="fee"><span>🎟️ ค่าเข้า</span><span>🪙 20</span><span>🎩 100</span><span>🎵 100</span></div>
      <div class="minbal">✨ ต้องมีกุศล 15,000+ · 🥇 +50k~100k · 🥈 +25k~45k · 🥉 +10k~25k · 4️⃣ 0 · 5️⃣6️⃣ −3k~−15k</div>
      <div class="slots" id="slots"></div>
      <div class="pick" id="pick" role="group" aria-label="เลือกตัวละคร"></div>
      <button class="ready" id="ready">🪑 เข้าห้อง</button><div class="wait" id="wait"></div>
    </div>
    <div class="cd" id="lcd"></div><button class="adm" id="adm" hidden>🧹 ล้างห้อง</button>
  </section>
  <section class="scr" id="game" hidden>
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hearts" id="hearts"></div><div class="feed" id="feed"></div>
      <div class="prog" id="prog"></div>
      <div class="rank" id="rank"></div><div class="lead" id="spect" hidden></div>
      <button class="jumpbtn" id="jump" aria-label="กระโดด">⬆️</button>
      <div class="aim" id="aim" hidden><button data-dir="-1">◀ โยนหลัง</button><button data-dir="1">โยนหน้า ▶</button></div><button class="slotbtn empty" id="use" aria-label="ใช้ไอเทม"><img id="useimg" alt=""></button>
    </div>
    <div class="cd" id="gcd"></div><button class="adm" id="adm2" hidden style="top:auto;bottom:8px;left:50%;transform:translateX(-50%)">🧹 ล้างห้อง</button>
  </section>
  <section class="scr" id="results" hidden>
    <h1 id="rtitle">🏁 สรุปคะแนน</h1>
    <div class="timer" id="rt"></div>
    <div class="podium" id="podium"></div>
    <div class="list" id="rlist"></div>
    <button class="home" id="home">🏠 กลับหน้ามินิเกม</button>
  </section>
</div>
<script type="module" src="funrun.js?v=ss3-fix15"></script>
</body></html>
