   focus(t);}paintHud();}
/* ---------- หน้าต่าง ---------- */
function open(h){closeWin();$('sheet').innerHTML=h;$('sheet').classList.add('on');$('shade').classList.add('on');const x=$('sheet').querySelector('.x');if(x)x.onclick=closeAll;}
function closeAll(){$('sheet').classList.remove('on');$('shade').classList.remove('on');}$('shade').onclick=closeAll;
function teamsSheet(t0){if(!R)return;const order=Array.from({length:N},(_,i)=>i+1).sort((a,b)=>(R.p[b-1]||0)-(R.p[a-1]||0)||a-b);
  open('<h3>👥 ทีมผีพราย<button class="x">✕</button></h3>'+order.map((t,r)=>{const m=members(t),w=R.want?.[t]?food(R.want[t]).n:'';return '<div class="tm" id="tm'+t+'"><b><i style="background:'+PH_COLORS[t-1]+'">ทีม '+t+'</i>'+(r===0&&(R.p[t-1]||0)>0?'👑 ':'')+(R.p[t-1]||0)+'/'+PH_GOAL+(R.team[ME]===t?' ⭐':'')+'</b><small>'+(m.length?m.map(u=>nameOf(u)+(R.sent?.[u]?' ('+R.sent[u]+')':'')).join(' · '):'ยังไม่มีสมาชิก')+(w&&R.status==='running'?'<br>🍽️ อยากกิน: '+esc(w):'')+'</small></div>';}).join(''));
  if(t0){const el=$('tm'+t0);if(el)el.scrollIntoView({block:'center'});}}
$('bTeams').onclick=()=>teamsSheet();
$('bLog').onclick=()=>open('<h3>📜 บันทึกการแข่ง<button class="x">✕</button></h3>'+((R?.log||[]).map(l=>'<div class="lg"><small>'+new Date(l.at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+'</small>'+esc(l.t)+'</div>').join('')||'<p class="hint">ยังไม่มีบันทึก</p>'));
/* ---------- แอดมิน ---------- */
async function adminSheet(){try{roster=await Host.roster();}catch(e){}const st=R.status,run=st==='running'||st==='paused';
  open('<h3>⚙️ จัดการศึกพรายชิงธง<button class="x">✕</button></h3><div class="hint">สถานะ: <b>'+esc({setup:'ตั้งค่า (ยังไม่เริ่ม)',running:'กำลังแข่ง',paused:'พักอยู่',finished:'จบแล้ว'}[st])+'</b> · จัดทีมแล้ว '+Object.keys(R.team).length+' คน · ตั้งเสบียงแล้ว '+Object.keys(R.menus||{}).length+'/'+N+' ทีม</div>'
   +'<div class="row">'+(st==='setup'?'<button class="btn g" data-a="start">▶ เริ่มแข่ง</button>':'')+(st==='running'?'<button class="btn y" data-a="pause">⏸ พัก</button>':'')+(st==='paused'?'<button class="btn g" data-a="resume">▶ แข่งต่อ</button>':'')+(st!=='setup'?'<button class="btn r" data-a="reset">↺ รีเซ็ตรอบ (ทีม/เสบียงยังอยู่)</button>':'')+'</div>'
   +'<div class="row"><button class="btn" id="aTeams">👥 '+(run?'เพิ่มสมาชิกเข้าทีม':'จัดทีม')+'</button>'+(run?'':'<button class="btn" id="aMenus">🍱 ตั้งเสบียง</button>')+(st==='setup'?'<button class="btn" id="aFlags">🚩 เปิด/ปิดธง</button>':'')+'</div>'+(st==='setup'?'<div class="hint">ธงที่เปิด: '+(Array.from({length:N},(_,i)=>i+1).filter(t=>!shut(t)).join(', ')||'-')+(Object.keys(R.off||{}).length?' · ปิด '+Object.keys(R.off).length+' ธง':'')+'</div>':'')+'<div class="hint">จัดทีม/ตั้งเสบียงได้ก่อนเริ่มรอบ · ระหว่างแข่งเพิ่มสมาชิกใหม่เข้าทีมได้ (ย้ายทีมไม่ได้)</div>');
  $('sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;if(a==='reset'&&!b.dataset.ok){open('<div class="dlg"><div class="big">↺</div><h3>รีเซ็ตรอบนี้?</h3><div class="hint">แต้มทุกทีมกลับเป็น 0 และกลับไปหน้าตั้งค่า<br>ทีมและเสบียงที่ตั้งไว้ยังอยู่</div><div class="row"><button class="btn" id="rNo">ยกเลิก</button><button class="btn r" id="rYes">↺ รีเซ็ตเลย</button></div></div>');$('rNo').onclick=adminSheet;$('rYes').onclick=async e=>{e.currentTarget.disabled=true;if(await call({type:'reset'}))note({icon:'↺',title:'รีเซ็ตรอบแล้ว',sub:'ทีมและเสบียงยังอยู่ พร้อมเริ่มรอบใหม่',tone:'gold'});adminSheet();};return;}b.disabled=true;const out=await call({type:a});if(out){toast({start:'🏁 เริ่มแข่งแล้ว',pause:'⏸ พักการแข่ง',resume:'▶ แข่งต่อ',reset:'↺ รีเซ็ตแล้ว'}[a]);adminSheet();}else b.disabled=false;});
  const af=$('aFlags');if(af)af.onclick=()=>flagEdit();
  $('aTeams').onclick=()=>teamEdit(1);const am=$('aMenus');if(am)am.onclick=()=>menuEdit(0);}
/* 🚩 เปิด/ปิดธง: แตะสลับทีละเสา (เทา = ปิด) · ปุ่มลัดเปิด N เสาแรก · บันทึกแล้วมีผลทันที (ก่อนเริ่มรอบ) */
function flagEdit(init){const off=new Set(init||Object.keys(R.off||{}).map(Number));
  const paint=()=>{open('<h3>🚩 เปิด/ปิดธง<button class="x">✕</button></h3><div class="hint">แตะเสาเพื่อเปิด/ปิด · เสาที่ปิดจะเป็นสีเทา ทีมนั้นไม่ร่วมแข่งรอบนี้ และไม่อยู่ในสรุปผล</div><div class="fsel">'+Array.from({length:N},(_,i)=>'<button data-f="'+(i+1)+'" class="'+(off.has(i+1)?'shut':'')+'" style="background:'+PH_COLORS[i]+'">ทีม '+(i+1)+'<small>'+(off.has(i+1)?'ปิด':'เปิด · '+members(i+1).length+' คน')+'</small></button>').join('')+'</div><div class="row"><button class="btn" data-q="10">เปิดครบ 10</button><button class="btn" data-q="5">เปิด 5 เสาแรก</button><button class="btn" data-q="2">เปิด 2 เสาแรก</button></div><div class="row"><button class="btn" id="fBack">← กลับ</button><button class="btn g" id="fSave">บันทึก (เปิด '+(N-off.size)+' ธง)</button></div>');
    $('sheet').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const t=+b.dataset.f;off.has(t)?off.delete(t):off.add(t);paint();});
    $('sheet').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q;off.clear();for(let t=q+1;t<=N;t++)off.add(t);paint();});
    $('fBack').onclick=adminSheet;$('fSave').onclick=async e=>{if(off.size>=N){toast('ต้องเปิดธงไว้อย่างน้อย 1 ทีม',1);return;}e.currentTarget.disabled=true;if(await call({type:'flags',off:[...off].sort((a,b)=>a-b)})){note({icon:'🚩',title:'บันทึกธงแล้ว',sub:'เปิด '+(N-off.size)+' ธง · ปิด '+off.size+' ธง',tone:'gold'});adminSheet();}else e.currentTarget.disabled=false;};};paint();}
function tsel(cur,all){return '<div class="tsel">'+(all?'<button data-t="0" class="'+(cur===0?'on':'')+'" style="background:#8a6a4a;grid-column:span 5">ทุกทีมใช้เสบียงเดียวกัน</button>':'')+Array.from({length:N},(_,i)=>'<button data-t="'+(i+1)+'" class="'+(cur===i+1?'on':'')+(shut(i+1)?' shut':'')+'" style="background:'+PH_COLORS[i]+'">ทีม '+(i+1)+(shut(i+1)?' 🚫':'')+'<small>'+(all?(R.menus?.[i+1]||[]).length+' เมนู':members(i+1).length+' คน')+'</small></button>').join('')+'</div>';}
function teamEdit(t){const run=R.status==='running'||R.status==='paused',ps=roster.filter(p=>!p.admin).sort((a,b)=>String(a.name).localeCompare(String(b.name),'th'));
  open('<h3>👥 '+(run?'เพิ่มสมาชิกเข้าทีม':'จัดทีม')+'<button class="x">✕</button></h3>'+tsel(t)+'<div class="hint">'+(run?'ติ๊กคนที่ยังไม่มีทีมเพื่อเพิ่มเข้าทีม '+t+' (คนที่มีทีมแล้วย้ายไม่ได้ระหว่างแข่ง)':'ติ๊กสมาชิกของทีม '+t+' แล้วกดบันทึก · คนที่อยู่ทีมอื่นถ้าติ๊กจะย้ายมาทีมนี้')+' · รายชื่อทั้งหมด '+ps.length+' คน (สมาชิกใหม่ขึ้นเองอัตโนมัติ)</div><div class="plist">'+ps.map(p=>{const cur=R.team[p.uid]||0;return '<label><input type="checkbox" value="'+esc(p.uid)+'" '+(cur===t?'checked':'')+(run&&cur?' disabled':'')+'><span>'+esc(p.name||'สมาชิก')+'</span>'+(cur&&cur!==t?'<i style="background:'+PH_COLORS[cur-1]+'">'+cur+'</i>':'')+'</label>';}).join('')+'</div><div class="row" style="position:sticky;bottom:0;background:#ffefd9;padding:.4rem 0"><button class="btn g" id="tSave">💾 บันทึกทีม '+t+'</button><button class="btn" id="tBack">‹ กลับ</button></div>');
  $('sheet').querySelectorAll('.tsel [data-t]').forEach(b=>b.onclick=()=>teamEdit(+b.dataset.t));$('tBack').onclick=adminSheet;
  $('tSave').onclick=async e=>{e.currentTarget.disabled=true;const ids=[...$('sheet').querySelectorAll('.plist input:checked:not(:disabled)')].map(i=>i.value);let okN=0;
    if(run){for(const u of ids.filter(u=>!R.team[u])){if(await call({type:'addMember',uid:u,team:t}))okN++;}toast(okN?'เพิ่ม '+okN+' คนเข้าทีม '+t+' แล้ว':'ไม่มีคนใหม่ให้เพิ่ม');}
    else if(await call({type:'teams',team:t,members:ids}))toast('บันทึกทีม '+t+' แล้ว ('+ids.length+' คน)');teamEdit(run?t:(t<N?t+1:1));};}
function menuEdit(t){const cur=new Set(t===0?(R.menus?.[1]||[]):(R.menus?.[t]||[]));
  const render=()=>{open('<h3>🍱 ตั้งเสบียง<button class="x">✕</button></h3>'+tsel(t,true)+'<div class="hint">เลือก 1–'+PH_MENU_MAX+' เมนู (เลือกแล้ว <b>'+cur.size+'</b>) · ระหว่างแข่ง ผีพรายจะสุ่ม "อยากกิน" ทีละอย่างจากรายการนี้ ทุกเส้น 10</div><div class="fgrid">'+ALL_FOODS.map(k=>{const f=food(k);return '<button data-k="'+esc(k)+'" class="'+(cur.has(k)?'on':'')+'">'+(f.img?'<img src="'+esc(f.img)+'" alt="" loading="lazy">':'')+'<span>'+esc(f.n)+'</span></button>';}).join('')+'</div><div class="row" style="position:sticky;bottom:0;background:#ffefd9;padding:.4rem 0"><button class="btn g" id="mSave">💾 บันทึก'+(t===0?'ให้ทุกทีม':'ทีม '+t)+'</button><button class="btn" id="mBack">‹ กลับ</button></div>');
    $('sheet').querySelectorAll('.tsel [data-t]').forEach(b=>b.onclick=()=>menuEdit(+b.dataset.t));$('mBack').onclick=adminSheet;
    $('sheet').querySelectorAll('.fgrid [data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(cur.has(k))cur.delete(k);else{if(cur.size>=PH_MENU_MAX)return toast('เลือกได้ไม่เกิน '+PH_MENU_MAX+' เมนู',true);cur.add(k);}const top=$('sheet').scrollTop;render();$('sheet').scrollTop=top;});
    $('mSave').onclick=async e=>{if(!cur.size)return toast('เลือกอย่างน้อย 1 เมนู',true);e.currentTarget.disabled=true;if(await call(t===0?{type:'menus',all:true,menus:[...cur]}:{type:'menus',team:t,menus:[...cur]})){toast('บันทึกเสบียง'+(t===0?'ทุกทีม':'ทีม '+t)+' แล้ว');menuEdit(t===0?0:(t<N?t+1:1));}else e.currentTarget.disabled=false;};};render();}
if(ADMIN){$('bSet').hidden=false;$('bSet').onclick=adminSheet;}
/* ---------- เริ่ม ---------- */
window.__phrai={state:()=>({R,MEI,off}),refresh:()=>call({type:'status'},true)};
(async()=>{build();try{roster=await Host.roster();}catch(e){}const out=await call({type:'status'});if(out&&R.team[ME])setTimeout(()=>focus(R.team[ME]),400);
  setInterval(()=>{if(R)paintHud();},1000);
  /* ไม่มีการฟังแบบสด: ถามสถานะทุก 10 วิ ตอนหน้านี้เปิดอยู่และไม่ได้กำลังส่งของ */setInterval(()=>{if(!document.hidden&&!busy&&!$('sheet').classList.contains('on'))call({type:'status'},true);},10000);
  let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{build();paintScene(null);},250);});})();
</script></body></html>
