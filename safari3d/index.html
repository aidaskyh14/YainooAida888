async function loadJ(name){/* S4: ตัวละครโหลดจากไฟล์เดียวกับฟาร์ม (ไฟล์ไบนารีที่โหลดไว้แล้ว) — เร็วกว่าและไม่ต้องโหลดไฟล์ใหญ่อีกก้อน (iPhone เคยไม่ขึ้นตัวละคร) */if(name==='punk'){try{const ab=await (await fetch('../farm3d/punk.gltf.json')).arrayBuffer();if(new DataView(ab).getUint32(0,true)===0x46546C67)return await new Promise((res,rej)=>L.parse(ab,new URL('../farm3d/',location.href).href,res,rej));}catch(e){console.log('punk glb',e&&e.message);}}/* S4: ไฟล์โมเดลถูกแปลงเป็นไบนารีตอนสร้างพรีวิว → อ่านตรงๆ ไม่ต้องถอดรหัส base64 บนเครื่อง (ช้ามากบน iPhone = ค้าง) */const __ab=await (await fetch('m/'+name+'.gltf.json')).arrayBuffer();if(new DataView(__ab).getUint32(0,true)===0x46546C67)return await new Promise((res,rej)=>L.parse(__ab,new URL('./m/',location.href).href,res,rej));
  const j=JSON.parse(new TextDecoder().decode(__ab));const __b64=j.buffers[0].uri.split(',')[1];const bin=new Uint8Array(await (await fetch('data:application/octet-stream;base64,'+__b64)).arrayBuffer());delete j.buffers[0].uri;
  const js=new TextEncoder().encode(JSON.stringify(j));const jl=Math.ceil(js.length/4)*4,bl=Math.ceil(bin.length/4)*4;
  const out=new Uint8Array(28+jl+bl);const dv=new DataView(out.buffer);
  dv.setUint32(0,0x46546C67,true);dv.setUint32(4,2,true);dv.setUint32(8,out.length,true);dv.setUint32(12,jl,true);dv.setUint32(16,0x4E4F534A,true);out.fill(0x20,20,20+jl);out.set(js,20);
  dv.setUint32(20+jl,bl,true);dv.setUint32(24+jl,0x004E4942,true);out.set(bin,28+jl);
  return new Promise((res,rej)=>L.parse(out.buffer,new URL('./m/',location.href).href,res,rej));}

async function fenceRun(x0,z0,x1,z1,gap,gapR=1.2){const g=await get('c2_sf_fence');

(function fxLoop(){requestAnimationFrame(fxLoop);const dt=1/60;for(let i=FXS.length-1;i>=0;i--){const f=FXS[i];if(f.delay>0){f.delay-=dt;if(f.delay<=0)f.m.visible=true;continue;}f.t+=dt;const k=f.t/f.life;
  if(f.ring){f.m.scale.setScalar(1+k*9);f.m.material.opacity=Math.max(0,1-k);}else{f.vy-=f.g*dt;f.m.position.x+=f.vx*dt;f.m.position.y+=f.vy*dt;f.m.position.z+=f.vz*dt;f.m.material.opacity=Math.min(1,(1-k)*2.2);f.m.scale.setScalar(f.sz*(1+f.grow*k)*(k<.12?k/.12:1));f.m.material.rotation+=f.spin*dt;}
