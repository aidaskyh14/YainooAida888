 for(const [uid,ch] of Object.entries(stage.cont)){if(!ch)continue;if(!ch.swimWalk&&P&&P.contestants&&P.contestants[uid]){const pod=stage.pods[P.contestants[uid].no-1];if(pod&&ch.g.visible){ch.g.position.set(stage.group.position.x+pod.position.x,pod.position.y+2.5,stage.group.position.z+pod.position.z);}}if(ch.spinIn){const k=Math.min(1,(performance.now()-ch.spinIn)/1100);ch.g.scale.setScalar(.01+.99*k);if(k>=1)ch.spinIn=0;}}
 stage.sweepers.forEach((s,i)=>{const on=!!P&&['lights','party','announce','podium'].includes(P.state);s.cone.visible=on;s.sp.visible=on;if(!on)return;const a=now/1300+i*2.1;const tx=Math.sin(a)*10,tz=Math.cos(a*.7)*5;s.sp.target.position.set(tx,2,tz);const dir=new THREE.Vector3(tx,2,tz).sub(s.sp.position).normalize();s.cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir);s.cone.position.copy(s.sp.position).add(dir.clone().multiplyScalar(8.5));});

let perfA=0,perfN=0,perfLv=/iPhone|iPad|Android/i.test(navigator.userAgent)?1:0,perfAt=0;/* เก็บตก: มือถือเริ่มที่ระดับประหยัด (ไม่มีเงา · ความละเอียด 1x · ผู้ชายไกลซ่อน) กันเครื่องร้อน */function applyPerf(){perfAt=performance.now();rd.setPixelRatio(perfLv>=1?1:Math.min(devicePixelRatio,/iPhone|iPad|Android/i.test(navigator.userAgent)?1.25:1.75));rd.shadowMap.enabled=perfLv<1;sun.castShadow=perfLv<1;sc.traverse(o=>{if(o.material&&o.material.needsUpdate!==undefined)o.material.needsUpdate=true;});MAX_PEER_MODELS=perfLv>=2?10:perfLv>=1?16:24;window.__perfLv=perfLv;console.log('perf level',perfLv);}
