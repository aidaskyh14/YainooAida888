/* ส่วน ④: ปุ่มเครื่องมือปุ่มเดียว · สาเหตุเดิมที่กดไม่ติด: all:unset ทำให้ pointer-events กลับไป inherit 'none' จาก .hud → ต้องใส่ pointer-events:auto เอง พับ/กางได้ เล็ก ไม่บังตัวละคร (ไม่ให้ s4fit ย่อซ้ำ → กดติดบน iPhone) */
#fab{right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:row;align-items:flex-end;gap:6px;z-index:30}

/* แถบแบบเดิม (ไอคอน+ชื่อใต้) แต่เล็กลง ~45% · เลื่อนออกจากขวา · ไม่บังตัวละคร */

/* ส่วน ⑥: คำถามแบบเกมโชว์ (คนที่อยู่ในรอบตอบได้ · ผู้ชมเห็นคำถาม) + แถบผู้ชม 👏/🌸 */
#pgq{position:fixed;z-index:45;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 86px);display:none;pointer-events:none}#pgq.on{display:block}

#pgq .a button:active{transform:translateY(2px);box-shadow:0 1px 0 #d9a85a}#pgq .a button.ok{background:linear-gradient(#e6ffe9,#9fe6b0);border-color:#6ad38a}#pgq .a button.no{background:linear-gradient(#ffe0e0,#ffb3b3)}#pgq .a button:disabled{opacity:.55}
#pgq .bar{height:7px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:8px}#pgq .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ac6,#ffd27a);transition:width .9s linear}#pgq .st{font-size:.68rem;color:#f5c6e8;margin-top:5px;text-align:center}

#pgq .seq2{display:flex;gap:5px;justify-content:center;margin:4px 0 8px}#pgq .seq2 .c{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);border:2px solid rgba(255,210,122,.6);position:relative;display:flex;align-items:center;justify-content:center;transition:transform .2s}#pgq .seq2 .c img{width:34px;height:34px;object-fit:contain}#pgq .seq2 .c b{position:absolute;left:-6px;top:-8px;width:18px;height:18px;border-radius:50%;background:linear-gradient(#ffe9a8,#f3c54a);color:#4a2a00;font-size:.66rem;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}#pgq .seq2 .c.done{opacity:.35;transform:scale(.9)}#pgq .seq2 .c.now{box-shadow:0 0 0 3px #ffd27a,0 0 16px #ffd27a;transform:scale(1.1)}
#pgq .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}#pgq .tiles button{all:unset;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(180deg,#fffaf0,#ffe2ef);border:2px solid #fff;border-radius:12px;padding:5px 3px;box-shadow:0 2px 0 #d9a85a;color:#3a1a2a;font:800 .66rem Mali;position:relative;overflow:hidden}#pgq .tiles button img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}#pgq .tiles button:active{transform:scale(.94)}
#pgq .tiles button.hit{background:linear-gradient(180deg,#fff7c4,#ffd27a);border-color:#ffe9a8;animation:tileHit .45s ease}#pgq .tiles button.hit::after{content:'✨';position:absolute;right:4px;top:2px;font-size:.9rem;animation:tileStar .6s ease forwards}@keyframes tileHit{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes tileStar{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-14px) scale(1.4)}}
#pgq .tiles button.bad{animation:tileBad .4s ease;background:linear-gradient(180deg,#ffe0e0,#ffb3b3)}@keyframes tileBad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}#pgq .tiles button:disabled{opacity:.45}

.face{--s:44px;width:var(--s);height:var(--s);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,#ffd6ea,#9ad9ff);border:2px solid #fff;box-shadow:0 2px 6px rgba(60,20,40,.25);font:800 calc(var(--s)*.42) Mali;color:#5a1a3a;vertical-align:middle;flex:none;position:relative}

/* ส่วน ③/⑦ ความสวย: แผงกรอบชมพู-ทอง + ริบบิ้นหัวข้อ (โครง CSS · รอรูปลวดลายบัว/หัวใจจากยัยหนูมาแปะทับ) */

<script type="module">
import {MEN,MAN,BUILDINGS,BUILDING,DATES,HARD,HARD_NAME,MOODS,PAGEANT,HOUSE_UP,KIDS,SEASONS,SEASON_DAYS,HEART,HEARTS,LOCK_HEARTS,IDLE_SOFT_MIN,IDLE_KICK_MIN,GIFT_KIND,WED} from '../city-public.js';

const F=$('#s4f');/* ส่วน ⑤: บอกฉากว่าเข้าด้วยรถคันไหน (ฉากขับรถ 3D ระหว่างโหลด) */{let q='';try{const d=Host.cityDrive&&Host.cityDrive();if(d&&d.car)q=(F.dataset.src.includes('?')?'&':'?')+'drive='+encodeURIComponent(d.car)+'&fuel='+encodeURIComponent(d.fuel||'');}catch(e){}F.src=F.dataset.src+q;}const send=m=>{try{F.contentWindow.postMessage({city:m},'*');}catch(e){}};

let V=null,W=null,P=null,PRES=[],ADMIN=false,ME=Host?.uid||'',MYNAME='ผู้เล่น',men={},lastTap=Date.now(),sceneReady=false,curMan=null,pgLast=null;

async function cloud(input){try{const out=await Host.cloud('city',input);if(out&&out.view)V=out.view;if(out&&out.world)W={...W,...out.world};paint();return out;}catch(e){toast(e.message||'ไม่สำเร็จ');throw e;}}

function paint(){if(!V)return;$('#pFuel').textContent='⛽ '+V.fuel;$('#pN').textContent='👥 '+PRES.length;const d=V.seasonDay,sn=SEASONS[V.season||0];$('#pTime').textContent=(V.rain?'🌧️ ':'☀️ ')+sn+' วันที่ '+d;
 $('#bHome').style.display=V.husband?'':'none';$('#bPg').style.display=(P&&P.state!=='idle')?'':'none';send({c:'state',view:V,world:W,me:ME,admin:ADMIN,now:Date.now()});
 const pend=(V.husband&&V.husband.pend||[]);if(pend.length&&!$('#shHome').classList.contains('on'))setTimeout(()=>{if(!document.querySelector('.sheet.on'))openHome();},800);}
/* ---------- ผู้ชาย ---------- */
const heartsHtml=(h,lock,p)=>{let s='';for(let i=1;i<=HEARTS;i++){s+=i<=h?'❤️':(i===lock?'🔒':'🤍');}return '<span class="hearts">'+s+'</span> <small>'+(h<HEARTS?(p||0)+'/'+HEART:'ครบ')+'</small>';};
const faceHtml=(id,s)=>{const M=MAN[id]||{};return '<span class="face" style="--s:'+(s||44)+'px"><i>'+esc((M.name||'?').slice(0,1))+'</i><img src="men-face/'+esc(id)+'.webp" alt="" onload="this.parentNode.classList.add(\'on\')" onerror="this.remove()"></span>';};
const moodImg=m=>m?'<img class="mood" src="../images/city-mood-'+esc(m)+'.webp" alt="'+esc(MOODS[m]?.n||'')+'" title="'+esc(MOODS[m]?.n||'')+'">':'';
function openMan(id){curMan=id;const M=MAN[id];if(!M)return;const L=(V&&V.love&&V.love[id])||{h:0,p:0,dates:0,lock:0,hint:''};const st=men[id]||'walk';const mood=V&&V.moods&&V.moods[id];const hb=V&&V.husband&&V.husband.id===id;const ex=V&&(V.ex||[]).includes(id);const hard=HARD[M.hard]||HARD.mid;
 const B=BUILDING[M.work];const bday=M.bday===(V&&V.seasonDay);
 $('#shMan').innerHTML=`<h3>${faceHtml(id,48)} ${moodImg(mood)} ${esc(M.name)} <small style="font-weight:500;color:#8a6a5a">${esc(M.job)} · ${esc(B?.n||'')}</small><button class="x" id="xMan">✕</button></h3>
  <div>${heartsHtml(L.h,L.lock,L.p)} ${hb?'<b style="color:#c2185b">💍 สามี</b>':ex?'<small>อดีตสามี</small>':''} <small>· ระดับ ${HARD_NAME[M.hard]}${bday?' · 🎂 วันเกิดวันนี้!':''}</small></div>
  <div class="say" id="say">${L.hint?esc(L.hint):'…'}</div>
  <div class="note">เดตแล้ว ${L.dates||0}/${hard.dates} ครั้ง${L.lock?' · ดวงที่ '+L.lock+' ติดล็อก: ต้องมาเจอเขา'+esc(L.hint.replace(/^.*ลองมาเจอฉัน/,'').replace(/สิ$/,'')||'ตามคำใบ้'):''}${L.bored?' · 😑 เขาเบื่อของซ้ำอยู่ (3 ชม.)':''}</div>
  <div class="row" style="margin-top:.5rem">${st==='walk'?`<button class="btn" id="mTalk">💬 คุย</button><button class="btn y" id="mGift">🎁 ให้ของ</button>${!hb?`<button class="btn g" id="mDate">☕ ชวนเดต</button>`:''}${!hb&&L.h>=HEARTS&&!V.husband?`<button class="btn" id="mRing" style="background:linear-gradient(#fff,#ffd27a);box-shadow:0 4px 0 #b9852a">💍 ขอแต่งงาน</button>`:''}`:`<span class="note">${st==='work'?'🏢 กำลังทำงานที่'+esc(B?.n||''):st==='rest'?'💤 กำลังพัก ไม่อยู่ในนคร':'💑 กำลังเดตกับคนอื่น'} · คุยและให้ของได้ตอนเขาเดินเล่นเท่านั้น</span>`}</div>`;
 open('shMan');$('#xMan').onclick=closeAll;
 const bt=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn;};
 bt('mTalk',async()=>{const o=await cloud({type:'talk',man:id});const t=o.talk;/* ส่วน ②: บทพูดประจำตัว + ใบ้ของบางครั้ง (ไม่โจ่งแจ้ง) */const hh=new Date(Date.now()+7*3600000);const hour=hh.getUTCHours();const seed=Math.floor(Date.now()/3600000)+id.charCodeAt(2)*7;const line=pickLine(id,{hour,hearts:t.hearts||0,rain:!!(V&&V.rain),first:!!t.first,seed});const showHint=t.unlocked||(t.hint&&((seed%10)<4));$('#say').textContent=line+(showHint&&t.hint?' — '+t.hint:'');if(t.unlocked)toast('💗 ปลดล็อกหัวใจดวงที่ '+t.unlocked+'!');else if(t.first)toast('💬 คุยครั้งแรกของวัน เขาดูดีใจ');send({c:'act',man:id,act:'talk'});openMan(id);});
 bt('mGift',()=>openGift(id));bt('mDate',()=>openDate(id));bt('mRing',()=>propose(id));}
/* ส่วน ②: กระเป๋าของขวัญ — id = ให้คนนี้เลย · id ว่าง = โหมดกระเป๋า: เลือกของ "ถือไว้" แล้วแตะผู้ชายคนไหนก็ให้ทันที */
let HOLD=null,giftCat='all';const GCAT={all:['ทั้งหมด','🎁'],veg:['ผัก ผลไม้','🥬'],flower:['ดอกไม้','🌸'],food:['อาหาร','🍲'],drink:['เครื่องดื่ม','🍷'],other:['อื่นๆ','📦']};
const catOf=c=>['ผัก','ผลไม้'].includes(c.g)?'veg':c.g==='ดอกไม้'?'flower':['อาหารบ้าน','เมนูมีคลาส','อาหารสวน'].includes(c.g)?'food':c.g==='เครื่องดื่มป่า'||/^(drink-|wine-)/.test(c.k)?'drink':'other';
function giftItems(){const bag=myBag();const items=[];for(const c of CATALOG){if(!c.p)continue;const v=c.p.split('.').reduce((o,k)=>o?.[k],bag);const n=Math.floor(Number(v)||0);if(n>0&&isGift(c))items.push([c,n]);}return items;}
async function giveTo(id,k,el){try{const o=await cloud({type:'gift',man:id,item:k});const g=o.gift;toast(({love:'😍 ชอบมากเลย!',like:'😊 ชอบนะ',neutral:'🙂 ขอบคุณนะ',dislike:'😕 ไม่ค่อยชอบ…',hate:'😠 ไม่ชอบเลย',repeat:'😐 ซ้ำอีกแล้ว…'})[g.cat]||'🎁 ให้แล้ว'+(g.birthday?' 🎂 วันเกิดเขาพอดี!':''));/* ไม่โชว์ตัวเลขคะแนน (ความลับระบบ) */send({c:'act',man:id,act:g.pts>0?'happy':'sad'});openMan(id);$('#say').textContent=g.line;setHold(null);}catch(err){if(el)el.classList.remove('on');}}
function setHold(h){HOLD=h;const e=$('#hold');if(!h){e.style.display='none';return;}e.style.display='';e.innerHTML=`<img src="${img(h.k)}" alt="" onerror="this.style.visibility='hidden'"><span>ถือ <b>${esc(h.n)}</b> · แตะผู้ชายเพื่อให้</span><button id="xHold">✕</button>`;$('#xHold').onclick=()=>setHold(null);}
function openGift(id){const all=giftItems();const items=all.filter(([c])=>giftCat==='all'||catOf(c)===giftCat);const M=id&&MAN[id];
 $('#shGift').innerHTML=`<h3>${M?'🎁 ให้ของ '+esc(M.name):'🎒 กระเป๋าของขวัญ'}<button class="x" id="xGift">✕</button></h3><p class="note">${M?'วันละ 3 ชิ้นต่อคน · ของเดิมซ้ำใน 3 ชม. เขาจะเบื่อ · ของที่เขาชอบต้องสังเกตจากบทพูด':'เลือกของแล้วแตะผู้ชายในนครเพื่อให้ · วันละ 3 ชิ้นต่อคน'}</p><div class="tabs">${Object.entries(GCAT).map(([k,[n,e]])=>`<button data-c="${k}" class="${k===giftCat?'on':''}">${e} ${n}</button>`).join('')}</div>${items.length?`<div class="grid">${items.map(([c,n])=>`<div class="it" data-k="${esc(c.k)}"><img src="${img(c.k)}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(c.n.replace(/^[^\p{L}\d]+/u,''))}</b><small>×${n}</small></div>`).join('')}</div>`:'<p class="note">ไม่มีของหมวดนี้ในกระเป๋า</p>'}`;
 open('shGift');$('#xGift').onclick=()=>M?openMan(id):closeAll();$('#shGift').querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{giftCat=b.dataset.c;openGift(id);});
 $('#shGift').querySelectorAll('.it').forEach(e=>e.onclick=()=>{e.classList.add('on');if(M)giveTo(id,e.dataset.k,e);else{const c=CATALOG.find(x=>x.k===e.dataset.k);setHold({k:c.k,n:c.n.replace(/^[^\p{L}\d]+/u,'')});closeAll();toast('🎁 ถือ'+c.n+'แล้ว · แตะผู้ชายเพื่อให้');}});}
const isGift=c=>['ผัก','ดอกไม้','ผลไม้','หญ้า ไม้ หิน','ผลผลิตสัตว์','นก เม่น','อัลปาก้า','ไอเท็ม','อาหารบ้าน','เมนูมีคลาส','อาหารสวน','เครื่องดื่มป่า'].includes(c.g)&&!/^(tree-|license|fuel|collar|fert)/.test(c.k);
function openDate(id){const M=MAN[id];const hard=HARD[M.hard]||HARD.mid;const L=V.love[id]||{h:0};$('#shGift').innerHTML=`<h3>☕ ชวน${esc(M.name)}ไปเดต<button class="x" id="xGift">✕</button></h3><p class="note">ยิ่งแพงยิ่งได้คะแนนมาก · ระหว่างเดตเขาจะไม่ออกมาเดินในนคร · ต้องเดตครบ ${hard.dates} ครั้งก่อนขอแต่งงาน · สัปดาห์ละไม่เกิน 3 ครั้งต่อคน</p>
  ${Object.entries(DATES).map(([k,d])=>`<button class="btn" style="width:100%;margin:.25rem 0;text-align:left;background:#fff;box-shadow:0 3px 0 #e8c9d6" data-d="${k}" ${(d.minHearts&&L.h<d.minHearts)||L.h<2?'disabled':''}>${esc(d.n)} · ${d.h} ชม. · <b>${fmt(d.merit*hard.dateCost)}</b> กุศล${d.minHearts?' · ต้อง '+d.minHearts+' หัวใจ':''}</button>`).join('')}`;
 open('shGift');$('#xGift').onclick=()=>openMan(id);$('#shGift').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const o=await cloud({type:'date',man:id,place:b.dataset.d});toast('💑 ไปเดตที่'+DATES[b.dataset.d].n+' · กลับ '+new Date(o.date.until).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));send({c:'act',man:id,act:'date',place:b.dataset.d});closeAll();});}
function propose(id){const M=MAN[id];if(!(V.ring>0))return toast('ไม่มีแหวน (ได้จากยัยหนูเท่านั้น)');$('#shGift').innerHTML=`<h3>💍 ขอ${esc(M.name)}แต่งงาน<button class="x" id="xGift">✕</button></h3><p>แหวนจะหายไป 1 วง · ถ้าให้ผิดคน แหวนหาย · ยืนยัน 2 ชั้น</p><p>พิมพ์ชื่อ <b>${esc(M.name)}</b> เพื่อยืนยัน</p><input id="ringName" style="width:100%;padding:.5rem;border-radius:12px;border:2px solid #f1e3d3;font:inherit"><div class="row" style="margin-top:.5rem"><button class="btn gray" id="ringNo">ยกเลิก</button><button class="btn y" id="ringYes">มอบแหวน</button></div>`;

function openLoveGuide(){const hard=HARD.mid;$('#shHeart').innerHTML=`<h3>📖 ขั้นตอนความรัก<button class="x" id="xH">✕</button></h3>
 <div class="steps">

Host.watchPageant(p=>{try{const now=Date.now();P=p?pageantLite(p):null;}catch(e){P=null;}paintPg();paint();send({c:'pageant',p:P});/* ร่วมยินดี 15 วิ แล้วทุกคน (รวมผู้ชม) กลับฟาร์มของตัวเอง */if(P&&P.state==='party'&&!ADMIN){clearTimeout(window.__partyT);window.__partyT=setTimeout(()=>{toast('🎉 จบการประกวด กลับฟาร์ม');setTimeout(leave,1500);},Math.max(1000,15000-(Date.now()-(P.partyAt||Date.now()))));}});
function pageantLite(p){/* เอกสารโลกมีเฉลย → ตัดก่อนใช้ (ผู้เล่นไม่มีทางเห็น) */const V={state:p.state,startAt:p.startAt,round:p.round||0,n:Object.keys(p.contestants||{}).length,contestants:Object.fromEntries(Object.entries(p.contestants||{}).map(([u,c])=>[u,{no:c.no,name:c.name,o:c.o,oThai:c.oThai,oSwim:c.oSwim,tribe:c.tribe,alive:c.alive,gray:!!c.gray,garland:c.garland||0,total:(p.state==='final'||p.state==='count')?null:Math.round(([...(c.scores?.talent||[]),...(c.scores?.quiz||[]),...(c.scores?.final||[])].filter(Number.isFinite).reduce((a,b)=>a+b,0))*100)/100,paid:!!c.paid}])),lights:p.lights?{out:p.lights.out||[],paid:p.lights.paid||[]}:null,talent:p.talent?{round:p.talent.round,seq:p.talent.seq,startAt:p.talent.startAt,done:Object.keys(p.talent.done||{})}:null,quiz:p.quiz?{id:p.quiz.id,q:p.quiz.q,choices:p.quiz.choices,startAt:p.quiz.startAt,answered:Object.keys(p.quiz.answers||{})}:null,result:p.result||null,swimAt:p.swimAt||0,countAt:p.countAt||0,resultAt:p.resultAt||0,partyAt:p.partyAt||0};return V;}
refresh();setInterval(()=>{if(!document.hidden)refresh();},90000);
/* ส่วน ⑥: รอบโชว์ 3 รอบต่อเนื่องอัตโนมัติ (เครื่องของยัยหนู/พิธีกรเป็นคนสั่ง): ทุกคนส่งครบ หรือหมดเวลา 25 วิ → รอบถัดไปทันที · ครบ 3 รอบ → ไปรอบคำถาม */
let pgAutoKey='';if(ADMIN)setInterval(()=>{try{if(!P||P.state!=='thai'||!P.talent)return;const alive=Object.values(P.contestants||{}).filter(c=>c.alive&&!c.gray).length;const done=(P.talent.done||[]).length;const over=Date.now()-(P.talent.startAt||0)>27000;if(!(done>=alive||over))return;const key='r'+P.talent.round;if(pgAutoKey===key)return;pgAutoKey=key;Host.cloud('pageantAdmin',{type:P.talent.round<PAGEANT.talentRounds?'talent':'next'}).then(()=>toast(P.talent.round<PAGEANT.talentRounds?'🎯 โชว์รอบถัดไปเริ่ม':'❓ ไปรอบคำถาม')).catch(e=>{pgAutoKey='';});}catch(e){}},2000);/* ส่งตำแหน่งต่ออายุทุก 2 นาที ทำในฉาก */
window.__city={openMan,openHeart,openHome,openPg,openBuild,refresh,closeAll,get V(){return V;},get P(){return P;}};
</script></body></html>
