<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎲 สุ่มตัวละคร (พรีวิว)</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700;800&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#140a1f;font-family:Mali,sans-serif}
#s4roll iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#140a1f}#s4roll .top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6)}#s4roll .top h2{margin:0;font-size:1.35rem}#s4roll .top p{margin:.25rem 14px 0;font-size:.78rem;opacity:.85}
#s4roll .bot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent,rgba(20,10,31,.92) 40%);text-align:center}
#s4roll .plate{display:none;margin:0 auto 12px;width:min(88vw,360px);background:linear-gradient(#fff6d6,#f3c86a);border:3px solid #fff;border-radius:20px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 30px rgba(255,210,122,.5)}#s4roll .plate b{display:block;font-size:1.25rem;color:#5a2a3c}#s4roll .plate small{color:#7a4a5c;font-size:.8rem}
#s4roll .btn{width:min(88vw,360px);font-size:1.1rem;padding:14px;border-radius:18px;border:0;background:linear-gradient(#fff3c4,#e8b64c);color:#4a2333;font-weight:800;box-shadow:0 5px 0 #b9852a,0 10px 24px rgba(0,0,0,.4)}#s4roll .btn:disabled{opacity:.6}
#s4roll .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;background:#140a1f;transition:opacity .4s}#s4roll .ld.off{opacity:0;pointer-events:none}</style></head>
<body><div id="s4roll" style="position:fixed;inset:0;overflow:hidden"><iframe src="roll3d/index.html" allow="autoplay" title="เวที"></iframe><div class="ld" id="ld">✨ กำลังเตรียมเวที…</div>
<div class="top"><h2>🎲 สุ่มตัวละครของคุณ</h2><p>พรีวิว: สุ่มได้ไม่จำกัด · ของจริงสุ่มได้ครั้งเดียว</p></div>
<div class="bot"><div class="plate" id="res"></div><button class="btn" id="btn" disabled>กำลังโหลด…</button></div></div>
<script>const T={pink:['💗','ชมพู'],mint:['💚','หัวเขียว'],red:['❤️','หัวแดง'],bob:['🖤','ผมบ็อบดำ']};const btn=document.getElementById('btn'),ifr=document.querySelector('iframe'),ld=document.getElementById('ld');let ready=false,tribe=null;
const ok=()=>{if(ready)return;ready=true;ld.classList.add('off');btn.disabled=false;btn.textContent='🎲 ทอยลูกเต๋า';};
addEventListener('message',e=>{const m=e.data&&e.data.s4roll;if(!m)return;if(m.t==='ready'||m.t==='fail')ok();else if(m.t==='done'){const r=document.getElementById('res');r.style.display='block';r.innerHTML='<b>'+T[tribe][0]+' ตัวละคร'+T[tribe][1]+'</b><small>ได้ชุดเริ่มต้นเข้าตู้เสื้อผ้าแล้ว</small>';btn.disabled=false;btn.textContent='🎲 ทอยอีกครั้ง (พรีวิว)';}});setTimeout(ok,12000);
const send=m=>{try{ifr.contentWindow.postMessage({s4roll:m},'*');}catch(e){}};
btn.onclick=()=>{btn.disabled=true;btn.textContent='กำลังสุ่ม…';document.getElementById('res').style.display='none';send({t:'spin'});tribe=['pink','mint','red','bob'][Math.floor(Math.random()*4)];setTimeout(()=>send({t:'stop',tribe}),1800);};</script></body></html>
