<script>
const IMG={"happy": "images/honey-face-happy.webp", "oops": "images/honey-face-oops.webp", "pen-chicken": "images/animals-pen-chicken.webp", "an-chicken": "images/animal-chicken.webp", "pen-fish": "images/animals-pen-fish.webp", "an-fish": "images/animal-fish.webp", "pen-pig": "images/animals-pen-pig.webp", "an-pig": "images/animal-pig.webp", "pen-cow": "images/animals-pen-cow.webp", "an-cow": "images/animal-cow.webp", "p-egg": "images/animals-product-egg.webp", "p-feather": "images/animals-product-feather.webp", "p-drumstick": "images/animals-product-drumstick.webp", "p-fishmeat": "images/animals-product-fishmeat.webp", "p-roe": "images/animals-product-roe.webp", "p-scale": "images/animals-product-scale.webp", "p-truffle": "images/animals-product-truffle.webp", "p-pork": "images/animals-product-pork.webp", "p-trotter": "images/animals-product-trotter.webp", "p-milk": "images/animals-product-milk.webp", "p-cheese": "images/animals-product-cheese.webp", "p-cream": "images/animals-product-cream.webp", "i-pestle": "images/animals-item-pestle.webp", "i-hay": "images/animals-item-hay.webp", "i-musicbox": "images/animals-item-musicbox.webp", "i-bell": "images/animals-item-bell.webp", "i-medicine": "images/animals-item-medicine.webp"};const W=941,H=1672,$=id=>document.getElementById(id);
const TYPES={chicken:{e:'🐔',n:'เล้าไก่',an:'ไก่',prod:3,life:3,p:['egg','feather','drumstick'],rows:[[625,[210,465,720]],[845,[190,462,740]],[1075,[165,462,762]]],tr:[470,1385,560,140]},

function fresh(){const now=Date.now(),s={pen:'chicken',animals:{},trough:{},bag:{},items:{pestle:0,hay:0,musicbox:0,bell:0,medicine:0},stock:{chicken:0,fish:0,pig:0,cow:0},cool:0,lastVisit:now,sneeze:{day:'',who:[]}};
 ORDER.forEach((t,k)=>{s.animals[t]=Array(9).fill(null).map((_,i)=>false?{born:now-i*HOUR*3,next:now+HOUR*TYPES[t].prod*(0.15+Math.random()*.8),sick:false}:null);s.trough[t]={n:0,pestle:0,hay:0,musicbox:0,bell:0}});return s}

const release=(t,i)=>{const a=S.animals[t][i];if(a&&__H&&typeof __H.barnRelease==='function')__H.barnRelease(t,i,a.born)};

 if(away>=4){ORDER.forEach(t=>{const healthy=S.animals[t].map((a,i)=>a&&!a.sick&&!dead(t,a)?i:-1).filter(i=>i>=0);const n=away>=9?3+Math.round(Math.random()):away>=6?1+Math.round(Math.random()):(Math.random()<.5?1:0);
  healthy.sort(()=>Math.random()-.5).slice(0,n).forEach(i=>S.animals[t][i].sick=true);if(Math.min(n,healthy.length))msg.push(TYPES[t].e+' '+Math.min(n,healthy.length))})}
 S.lastVisit=Date.now();save();if(msg.length)ann('🤒 ไม่ได้มาดูนาน '+Math.floor(away)+' ชม. สัตว์ติดหวัด: '+msg.join(' • '),1)}

 S.animals[pen].forEach((a,i)=>{const[x,y]=slotXY(pen,i);if(!a){const e=document.createElement('div');e.className='empty';e.style.left=x/W*100+'%';e.style.top=(y-40)/H*100+'%';e.innerHTML='＋ ว่าง';e.onclick=()=>placeAnimal(i);s.appendChild(e);els.push(null);return}
  const d=document.createElement('div');const dd=dead(pen,a);d.className='an'+(a.sick?' sick':'')+(dd?' dead':'');d.style.left=x/W*100+'%';d.style.top=y/H*100+'%';

  d.onclick=()=>tapAnimal(i);s.appendChild(d);els.push({d,f:(i*5)%16})});

function tapAnimal(i){const a=S.animals[pen][i],T=TYPES[pen];
 if(dead(pen,a))return open('<h3>🕊️ '+T.an+'ช่องที่ '+(i+1)+' หมดอายุแล้ว</h3><div class="hint">ครบ '+T.life+' วันแล้ว ผลผลิตที่ผลิตไว้ยังอยู่ในราง</div><div class="row"><button class="btn g" id="clr">ปล่อยไปและเคลียร์ช่อง</button></div>'),$('clr').onclick=()=>{release(pen,i);S.animals[pen][i]=null;save();closeAll();draw()};
 if(a.sick)return open('<h3>🤒 '+T.an+'ช่องที่ '+(i+1)+' ติดหวัด</h3><div class="hint">หยุดผลิตจนกว่าจะรักษา</div><button class="opt" id="cure"'+(S.items.medicine<1?' disabled':'')+'><img src="'+IMG['i-medicine']+'"><b>ใช้ยาน้ำผึ้งมะนาว<small>1 ชิ้นต่อ 1 ตัว</small></b><span>มี '+S.items.medicine+'</span></button>'),$('cure').onclick=()=>{S.items.medicine--;a.sick=false;a.next=Date.now()+T.prod*HOUR;save();closeAll();draw();ann('🍯 '+T.an+'หายหวัดแล้ว กลับมาผลิตต่อ')};
 open('<h3>'+T.e+' '+T.an+' ช่องที่ '+(i+1)+'</h3><div class="hint">ผลิตเสร็จในอีก '+gameT(a.next-Date.now())+' • อายุเหลือ '+gameT(lifeLeft(a))+'</div>'+boostOpts(1,'one',i)+'<div class="row" style="margin-top:.6rem"><button class="btn gray" id="sell">💸 ขายออก (+'+SELL[pen]+' กุศล)</button></div>');$('sell').onclick=()=>sellAnimal(i)}
function boostOpts(n,mode,i){const cd=S.cool-Date.now();if(cd>0)return '<div class="hint" style="font-weight:700">⏱️ เพิ่งใช้ของเร่งไป รออีก '+fmt(cd)+' (กันกดรัวให้ระบบบันทึกทัน)</div>';
 return '<div class="hint">⚡ เร่งให้ผลิตเสร็จทันที'+(n>1?' • '+n+' ตัว':'')+'</div>'+BOOST.map(([k,nm,per,r])=>{const need=per*n;return '<button class="opt" data-k="'+k+'" data-mode="'+mode+'" data-i="'+(i??'')+'"'+(S.items[k]<need?' disabled':'')+'><img src="'+IMG['i-'+k]+'"><b>'+nm+'<small>'+r+' • '+per+' ชิ้นต่อตัว</small></b><span>ใช้ '+need+' • มี '+S.items[k]+'</span></button>'}).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('#sb [data-k]');if(!b||b.disabled)return;const k=b.dataset.k,per=BOOST.find(x=>x[0]===k)[2];
 const list=b.dataset.mode==='one'?[+b.dataset.i]:S.animals[pen].map((a,i)=>a&&!a.sick&&!dead(pen,a)?i:-1).filter(i=>i>=0);const need=per*list.length;if(S.items[k]<need)return;
 S.items[k]-=need;list.forEach(i=>{const a=S.animals[pen][i];S.trough[pen][k]++;a.next=Date.now()+TYPES[pen].prod*HOUR;slide(i)});S.cool=Date.now()+60000;save();closeAll();drawTrough();updBars();ann('⚡ เร่ง '+list.length+' ตัวแล้ว! ผลผลิตไหลไปที่ราง • ใช้ของเร่งครั้งถัดไปได้ใน 1 นาที')});
const tTot=t=>Object.values(S.trough[t]).reduce((x,y)=>x+y,0);
function rollFrom(t,src){const p=TYPES[t].p;if(src==='bell')return p[2];if(src==='musicbox')return p[1];if(src==='hay')return Math.random()<.5?p[0]:p[1];return p[0]}
function collect(pens){const got={};let rounds=0;pens.forEach(t=>{Object.entries(S.trough[t]).forEach(([src,n])=>{rounds+=n;for(let k=0;k<n;k++){const q=Math.random()<.82?2:3;const it=rollFrom(t,src);got[it]=(got[it]||0)+q}S.trough[t][src]=0})});
 if(!rounds)return ann('ยังไม่มีผลผลิตในราง',1);Object.entries(got).forEach(([k,q])=>S.bag[k]=(S.bag[k]||0)+q);save();drawTrough();closeAll();
 const tier=k=>ORDER.reduce((r,t)=>{const i=TYPES[t].p.indexOf(k);return i>=0?i:r},0);const list=Object.entries(got).sort((a,b)=>tier(b[0])-tier(a[0]));
 open('<h3>🧺 เก็บผลผลิตแล้ว!</h3><div class="hint">'+rounds.toLocaleString()+' รอบการผลิต • เข้ากระเป๋าแล้ว</div><div class="grid">'+list.map(([k,q])=>'<div class="cell t'+tier(k)+'"><img src="'+IMG['p-'+k]+'"><b>'+'⭐'.repeat(tier(k)+1)+'<br>'+PN[k]+'</b><span>×'+q.toLocaleString()+'</span></div>').join('')+'</div><div class="row"><button class="btn g" id="okc">เยี่ยมเลย</button></div>');$('okc').onclick=closeAll}
/* ---------- เครื่องมือ ---------- */
const FAN=[['⚡','เร่งผลผลิตคอกนี้',()=>{const n=S.animals[pen].filter(a=>a&&!a.sick&&!dead(pen,a)).length;if(!n)return ann('ไม่มีสัตว์ที่ผลิตอยู่ในคอกนี้',1);open('<h3>⚡ เร่งผลผลิต '+TYPES[pen].n+'</h3>'+boostOpts(n,'all'))}],
 ['🧺','เก็บผลผลิตทุกคอก',()=>collect(ORDER)],
 ['🍯','รักษาหวัดทั้งหมด',()=>{const sick=[];ORDER.forEach(t=>S.animals[t].forEach((a,i)=>{if(a&&a.sick&&!dead(t,a))sick.push([t,i])}));if(!sick.length)return ann('ไม่มีสัตว์ป่วย 🎉');
  open('<h3>🍯 รักษาหวัดทั้งหมด</h3><div class="hint">สัตว์ป่วย '+sick.length+' ตัว (ทุกคอก)</div><button class="opt" id="cureAll"'+(S.items.medicine<sick.length?' disabled':'')+'><img src="'+IMG['i-medicine']+'"><b>ยาน้ำผึ้งมะนาว<small>ต้องใช้ '+sick.length+' ชิ้น</small></b><span>มี '+S.items.medicine+'</span></button>'+(S.items.medicine<sick.length?'<div class="hint">ยาไม่พอ แตะรักษาทีละตัวได้</div>':''));
  $('cureAll').onclick=()=>{sick.forEach(([t,i])=>{const a=S.animals[t][i];a.sick=false;a.next=Date.now()+TYPES[t].prod*HOUR});S.items.medicine-=sick.length;save();closeAll();draw();ann('🍯 รักษาหายทั้งหมด '+sick.length+' ตัว')}}],
 ['🎒','กระเป๋า',openBag]];
$('fan').innerHTML=FAN.map((f,i)=>'<button data-i="'+i+'"><i>'+f[0]+'</i>'+f[1]+'</button>').join('');
$('toolBtn').onclick=()=>{$('toolBtn').classList.toggle('open');$('fan').classList.toggle('open')};
$('fan').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!$('fan').classList.contains('open'))return;$('fan').classList.remove('open');$('toolBtn').classList.remove('open');FAN[+b.dataset.i][2]()});
function openSneeze(){const day=new Date().toDateString();if(S.sneeze.day!==day)S.sneeze={day,who:[]};const left=3-S.sneeze.who.length;
 open('<h3>🤧 จามใส่เพื่อน</h3><div class="hint">วันนี้เหลือ '+left+'/3 คน • รีเซ็ตเที่ยงคืน • เพื่อนจะโดนตอนเข้าโรงเรือนครั้งถัดไป</div>'+FRIENDS.map(n=>{const done=S.sneeze.who.includes(n);return '<button class="opt" data-sn="'+n+'"'+(done||left<1?' disabled':'')+'><b>👤 '+n+'</b><span>'+(done?'จามแล้ววันนี้':'🤧 จาม')+'</span></button>'}).join(''));
 document.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{S.sneeze.who.push(b.dataset.sn);save();closeAll();ann('🤧 แอบจามใส่สวน '+b.dataset.sn+' แล้ว! เพื่อนจะได้จดหมายแจ้ง')})}
function openBag(){const rows=Object.entries(S.bag).filter(([,q])=>q>0);open('<h3>🎒 กระเป๋า • ผลผลิตสัตว์</h3><div class="grid">'+(rows.length?rows.map(([k,q])=>'<div class="cell"><img src="'+IMG['p-'+k]+'"><b>'+PN[k]+'</b><span>×'+q.toLocaleString()+'</span></div>').join(''):'<div class="hint" style="grid-column:1/-1">ยังไม่มีผลผลิต</div>')+'</div><h3 style="margin-top:.8rem">🐾 สัตว์ภาคการเกษตร</h3><div class="grid">'+ORDER.map(t=>'<div class="cell"><div style="width:100%;aspect-ratio:1;background:url('+IMG['an-'+t]+') 0 0/400% 400%"></div><b>'+TYPES[t].an+'</b><span>×'+(S.stock[t]||0)+'</span></div>').join('')+'</div><h3 style="margin-top:.8rem">✨ ไอเทม</h3><div class="grid">'+[...BOOST.map(b=>[b[0],b[1]]),['medicine','ยาน้ำผึ้งมะนาว']].map(([k,n])=>'<div class="cell"><img src="'+IMG['i-'+k]+'"><b>'+n+'</b><span>×'+S.items[k]+'</span></div>').join('')+'</div>')}
function openSet(){open('<h3>⚙️ ตั้งค่าทดลอง</h3><div class="hint">1 ชม.ในเกม = 10 วินาที • ปุ่มเหล่านี้มีเฉพาะหน้าทดลอง</div>'+
 '<div class="hint" style="margin-top:.5rem">🤒 จำลองไม่ได้เข้าโรงเรือน แล้วกลับเข้ามา</div><div class="row"><button class="btn" data-aw="4">4 ชม.</button><button class="btn" data-aw="6">6 ชม.</button><button class="btn" data-aw="9">9 ชม.</button></div>'+
 '<div class="hint" style="margin-top:.5rem">🤧 จำลองเพื่อนจามใส่คุณ</div><div class="row"><button class="btn" id="gotSn">ส้มโอจามใส่ฉัน</button></div>'+
 '<div class="hint" style="margin-top:.5rem">🎁 จำลองยัยหนูส่งสัตว์ให้ทางกล่องของขวัญ</div><div class="row"><button class="btn g" id="gift">รับไก่ 3 • ปลา 2 • หมู 1 • วัว 1</button></div><div class="row" style="margin-top:.6rem"><button class="btn gray" id="ncd">ข้ามคูลดาวน์ของเร่ง</button><button class="btn gray" id="rst">เริ่มใหม่ทั้งหมด</button></div>');
 document.querySelectorAll('[data-aw]').forEach(b=>b.onclick=()=>{S.lastVisit=Date.now()-(+b.dataset.aw)*HOUR-500;closeAll();enterBarn();draw()});
 $('gotSn').onclick=()=>{const t=ORDER[Math.floor(Math.random()*4)];const h=S.animals[t].map((a,i)=>a&&!a.sick&&!dead(t,a)?i:-1).filter(i=>i>=0);if(h.length){S.animals[t][h[Math.floor(Math.random()*h.length)]].sick=true;save()}closeAll();draw();ann('📮 จดหมาย: ส้มโอแอบจามใส่สวนคุณ! 🤧 '+TYPES[t].an+'ติดหวัด 1 ตัว',1)};
 $('gift').onclick=()=>{S.stock.chicken+=3;S.stock.fish+=2;S.stock.pig++;S.stock.cow++;save();closeAll();ann('🎁 รับของขวัญจากยัยหนูแล้ว! สัตว์เข้ากระเป๋าแล้ว')};$('ncd').onclick=()=>{S.cool=0;save();closeAll();ann('ข้ามคูลดาวน์แล้ว')};$('rst').onclick=()=>{S=fresh();pen='chicken';save();closeAll();draw();ann('เริ่มใหม่แล้ว')}}
addEventListener('resize',()=>{fit();draw()});fit();produce(false);enterBarn();draw();
setTimeout(()=>ann('🐔 ยินดีต้อนรับสู่โรงเรือน • ปัดซ้ายขวาหรือแตะไอคอนด้านบนเพื่อสลับคอก'),400);

function placeAnimal(i){const T=TYPES[pen],n=S.stock[pen]||0;
 open('<h3>＋ วางสัตว์ลงช่องที่ '+(i+1)+'</h3><div class="hint">วางแล้ว<b>เริ่มนับอายุทันที</b> ('+T.life+' วัน) และ<b>เอากลับเข้ากระเป๋าไม่ได้</b></div><button class="opt" id="put"'+(n<1?' disabled':'')+'><span style="width:2.6rem;height:2.6rem;flex:none;background:url('+IMG['an-'+pen]+') 0 0/400% 400%"></span><b>'+T.an+'<small>ในกระเป๋า • สัตว์ภาคการเกษตร</small></b><span>มี '+n+' ตัว</span></button>'+(n<1?'<div class="hint">ยังไม่มี'+T.an+'ในกระเป๋า รับได้จากกล่องของขวัญของยัยหนู</div>':'')+'<div class="row"><button class="btn gray" id="nput">ยังไม่วาง</button></div>');
 $('nput').onclick=closeAll;if(n<1)return;
 $('put').onclick=()=>{open('<h3>ยืนยันวาง'+T.an+'?</h3><div class="hint">นับอายุ '+T.life+' วันตั้งแต่ตอนนี้ และยกเลิกไม่ได้</div><div class="row"><button class="btn gray" id="pn">ยกเลิก</button><button class="btn g" id="py">วางเลย</button></div>');
  $('pn').onclick=closeAll;$('py').onclick=()=>{S.stock[pen]--;S.animals[pen][i]={born:Date.now(),next:Date.now()+T.prod*HOUR,sick:false};save();closeAll();draw();ann(T.e+' วาง'+T.an+'แล้ว เริ่มผลิตเลย!')}}}
function sellAnimal(i){const T=TYPES[pen];open('<h3>💸 ขาย'+T.an+'ตัวนี้?</h3><div class="hint">ได้ '+SELL[pen]+' กุศล • ขายแล้วเอาคืนไม่ได้ • ผลผลิตในรางยังอยู่</div><div class="row"><button class="btn gray" id="sn">ไม่ขาย</button><button class="btn" id="sy">ขายออก</button></div>');
 $('sn').onclick=closeAll;$('sy').onclick=()=>{release(pen,i);S.animals[pen][i]=null;S.merit=(S.merit||0)+SELL[pen];save();closeAll();draw();ann('💸 ขาย'+T.an+'แล้ว +'+SELL[pen]+' กุศล')}}
</script></body></html>
