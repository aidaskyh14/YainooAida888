const pos=(el,r)=>Object.assign(el.style,{left:r[0]/W*100+'%',top:r[1]/H*100+'%',width:r[2]/W*100+'%',height:r[3]/H*100+'%'});

const fmtT=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return s>=60?Math.floor(s/60)+' นาที '+(s%60)+' วิ':s+' วิ'};
const resting=()=>S.rest&&Date.now()<S.rest.end;
function guard(){if(resting()){toast('กำลังพักผ่อนอยู่ ทำอะไรไม่ได้นะ รอตื่นก่อน',1);return true}return false}

let hedges=[],dropEls={};
function build(){const s=$('stage');s.innerHTML='';hedges=[];dropEls={};s.style.backgroundImage='url('+(room==='up'?IMG['up'+S.lv]:IMG.base)+')';setBg((room==='up'?IMG['up'+S.lv]:IMG.base));
 if(room==='up'){mk('hot',UP.bed,openBed);mk('hot',UP.paint,openFortune);mk('hot',UP.stove,openKitchen);
  
  const r=mk('rest',[300,170,370,200]);r.id='restBox';
  setFan([['🎒','กระเป๋า',openBag],['⬇️','ลงห้องใต้ดิน',()=>go('base')],['🌱','กลับฟาร์ม',()=>{if(resting())return toast('กำลังพักอยู่ ออกจากบ้านไม่ได้นะ',1);goScreen('farm')}]]);}
 else{mk('hot',STAIRS,()=>go('up'));
  FP.forEach((r,i)=>{const d=mk('fplot',r,()=>tapPlot(i),'<div class="pl"></div><div class="bar" style="display:none"><i></i></div>');d.dataset.i=i});
  BAR.forEach((r,i)=>{const d=mk('barrel',r,()=>tapBarrel(i),'<div class="bt" style="display:none"></div><div class="bar" style="display:none"><i></i></div>');d.dataset.i=i});
  const n={1:1,2:3,3:5}[S.lv];for(let k=0;k<n;k++){const e=document.createElement('div');e.className='hedge';e.innerHTML='<span class="hs"></span><span class="sp"></span>';s.appendChild(e);hedges.push({el:e,sp:e.lastChild,x:rnd(PEN.x0,PEN.x1),y:rnd(PEN.y0,PEN.y1),tx:0,ty:0,mode:'sniff',until:Date.now()+rnd(1000,3000),f:k*3,flip:Math.random()<.5})}
  setFan([['🎒','กระเป๋า',openBag],['🌸','ปลูกดอกไม้ทั้งหมด',()=>{if(guard())return;if(!S.plots.some(p=>!p))return toast('แปลงดอกไม้เต็มแล้ว',1);openFlowerPick(-1)}],['🌼','ใส่ปุ๋ยนางฟ้าทั้งหมด',fertAll],['💐','เก็บดอกไม้ทั้งหมด',pickAll],['🦔','เก็บของเม่นทั้งหมด',()=>{if(!S.drops.length)return toast('ยังไม่มีของเม่นหล่นนะ',1);collectDrops(S.drops.map(d=>d.id))}],['🪜','ขึ้นบ้าน',()=>go('up')],['🌱','กลับฟาร์ม',()=>goScreen('farm')]])}
 draw()}
function go(r){if(r==='base'&&guard())return;$('stage').classList.add('fade');setTimeout(()=>{room=r;build();$('stage').classList.remove('fade')},200)}
const rnd=(a,b)=>a+Math.random()*(b-a);
function fStage(p){const k=(Date.now()-p.t)/mins(FLOWERS[p.f][1]);return k>=1?3:k>=.5?2:1}
function draw(){
 if(room==='up'){const r=$('restBox');if(r){if(resting()){const R=REST.find(x=>x[0]===S.rest.type);r.innerHTML='<div>'+R[1]+' '+R[2]+'<small>ตื่นในอีก '+fmtT(S.rest.end-Date.now())+'</small></div>'}else r.innerHTML=''}
  if(S.rest&&!resting()){const R=REST.find(x=>x[0]===S.rest.type);S.merit+=R[4];S.rest=null;save();toast('ตื่นแล้ว! ได้ '+R[4]+' กุศล')}}
 else{document.querySelectorAll('.fplot').forEach(d=>{const i=+d.dataset.i,p=S.plots[i];const pl=d.querySelector('.pl'),bar=d.querySelector('.bar');
   if(!p){if(pl.dataset.k!==''){pl.innerHTML='';pl.dataset.k=''}bar.style.display='none';return}
   const st=fStage(p),k=p.f+st;if(pl.dataset.k!==k){pl.dataset.k=k;pl.innerHTML='<img class="s'+st+'" src="'+(st===1?IMG.s1:st===2?IMG.s2:IMG['fl-'+p.f])+'">'}
   bar.style.display=st<3?'block':'none';if(st<3)bar.firstChild.style.width=Math.min(100,(Date.now()-p.t)/mins(FLOWERS[p.f][1])*100)+'%'});
  document.querySelectorAll('.barrel').forEach(d=>{const i=+d.dataset.i,b=S.barrels[i],bt=d.querySelector('.bt'),bar=d.querySelector('.bar');
   if(!b){bt.style.display='flex';bt.innerHTML='＋ หมักไวน์';bar.style.display='none';return}
   const left=b.end-Date.now();bt.style.display='flex';bt.innerHTML='<img src="'+IMG['wine-'+b.w]+'">'+(left>0?fmtT(left):'พร้อมแล้ว!');
   bar.style.display=left>0?'block':'none';if(left>0)bar.firstChild.style.width=Math.min(100,(1-left/(b.end-b.t))*100)+'%'});
  // ของเม่นหล่น
  if(Date.now()>S.nextDrop){if(S.nextDrop){const n={1:1,2:3,3:5}[S.lv];for(let k=0;k<n;k++)if(S.drops.length<12){const ks=Object.keys(DROPS);S.drops.push({id:Math.random().toString(36).slice(2),k:ks[Math.floor(Math.random()*4)],x:rnd(PEN.x0,PEN.x1),y:rnd(PEN.y0+30,PEN.y1)})}save()}S.nextDrop=Date.now()+mins(30)}
  const ids=new Set(S.drops.map(d=>d.id));Object.keys(dropEls).forEach(id=>{if(!ids.has(id)){dropEls[id].remove();delete dropEls[id]}});
  S.drops.forEach(dd=>{if(dropEls[dd.id])return;const e=document.createElement('div');e.className='drop';e.style.left=dd.x/W*100+'%';e.style.top=dd.y/H*100+'%';e.innerHTML='<img src="'+IMG['hedge-'+dd.k]+'">';e.addEventListener('click',ev=>{ev.stopPropagation();collectDrops([dd.id])});$('stage').appendChild(e);dropEls[dd.id]=e})}}
setInterval(draw,500);
/* ---------- เม่นเดินในคอก (วาดในเครื่องล้วน ไม่แตะฐานข้อมูล) ---------- */
let lastT=0;function anim(t){requestAnimationFrame(anim);if(t-lastT<90)return;lastT=t;const now=Date.now();
 hedges.forEach(h=>{if(now>h.until){const r=Math.random();if(h.mode==='walk'){h.mode=r<.75?'sniff':'curl';h.until=now+(h.mode==='sniff'?rnd(2500,5000):rnd(5000,9000))}else{h.mode='walk';h.tx=rnd(PEN.x0,PEN.x1);h.ty=rnd(PEN.y0,PEN.y1);h.until=now+15000}}
  if(h.mode==='walk'){const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy);if(d<6){h.mode='sniff';h.until=now+rnd(2000,4000)}else{h.x+=dx/d*4;h.y+=dy/d*4;h.flip=dx<0}}
  h.f=(h.f+1)%16;const sheet=h.mode==='walk'?IMG.walk:h.mode==='curl'?IMG.curl:IMG.sniff;
  if(h.sheet!==sheet){h.sp.style.backgroundImage='url('+sheet+')';h.sheet=sheet}
  h.sp.style.backgroundPosition=((h.f%4)*100/3)+'% '+(Math.floor(h.f/4)*100/3)+'%';
  h.el.style.left=(h.x/W*100-3.6)+'%';h.el.style.top=(h.y/H*100-3.4)+'%';h.sp.classList.toggle('flip',h.flip);h.el.classList.toggle('curl',h.mode==='curl');h.el.style.zIndex=Math.round(h.y)});}
requestAnimationFrame(anim);

 open('<h3>🛏️ พักผ่อนบนเตียง</h3><div class="hint">ระหว่างพัก ทำอะไรในฟาร์มไม่ได้ ได้แค่ดู • พักเสร็จได้กุศลอัตโนมัติ</div>'+REST.map(r=>'<button class="opt" data-r="'+r[0]+'"><i>'+r[1]+'</i><span><b>'+r[2]+'</b><small>'+(r[3]>=60?r[3]/60+' ชั่วโมง':r[3]+' นาที')+'</small></span><span class="r">+'+r[4]+' กุศล</span></button>').join(''));
 $('sheetBody').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const R=REST.find(x=>x[0]===b.dataset.r);S.rest={type:R[0],end:Date.now()+mins(R[3])};save();closeAll();draw();toast(R[1]+' เริ่ม'+R[2]+'แล้ว')})}
const CARDK=['merit','growth','chef','honey','hedgehog','clover'];
const FORT6=[['🙏','ดวงเศรษฐีมาเยือน','วันนี้กุศลที่ได้จากทุกระบบเพิ่ม 30%'],['🌱','ดวงชาวสวนมือทอง','วันนี้ผักและดอกไม้โตเร็วขึ้น 30%'],['🍳','ดวงแม่ครัวมือเทพ','วันนี้คราฟอาหารบ้านสำเร็จเพิ่ม 25%'],
 ['🐷','ดวงน้ำผึ้งใจดี','วันนี้ฝากของให้น้องน้ำผึ้ง ได้กุศล ×2'],['🦔','ดวงเม่นนำโชค','วันนี้ของเม่นหล่นเพิ่มอีก 2 ชิ้นทุกครั้ง'],['🍀','ดวงโชคหล่นทับ','รับกุศล +10,000 ทันที!']];
function openFortune(){if(guard())return;const day=new Date().toDateString();
 if(S.fortune&&S.fortune.day===day){const f=FORT6[S.fortune.i];open('<h3>🔮 ดวงของวันนี้</h3><div class="card"><img class="cimg" src="'+IMG['card-'+CARDK[S.fortune.i]]+'"><b>'+f[1]+'</b><p>'+f[2]+'</p><div class="hint">เปิดไพ่ได้วันละ 1 ใบ พรุ่งนี้มาใหม่นะ</div></div>');($('fReset')||{}).onclick=()=>{S.fortune=null;save();openFortune()};return}

  c.classList.add('flip');setTimeout(()=>{$('sheetBody').querySelectorAll('.tcard').forEach(o=>{if(o!==c)o.classList.add('dim')});const f=FORT6[d];$('fRes').innerHTML='<div class="card"><b>'+f[0]+' '+f[1]+'</b><p>'+f[2]+'</p></div>'},550)})}
function needHTML(o){let ok=true;const parts=[];Object.entries(o.c||{}).forEach(([k,q])=>{const h=S.bag.crop[k]||0;if(h<q)ok=false;parts.push('<span class="'+(h<q?'no':'')+'">'+CROPN[k]+' '+h+'/'+q+'</span>')});
 Object.entries(o.f||{}).forEach(([k,q])=>{const h=S.bag.flower[k]||0;if(h<q)ok=false;parts.push('<span class="'+(h<q?'no':'')+'">'+FLOWERS[k][0]+' '+h+'/'+q+'</span>')});return[ok,parts.join('')]}
function needQty(o,n){let ok=true;const parts=[];const add=(have,name,q)=>{if(have<q)ok=false;parts.push('<span class="'+(have<q?'no':'')+'">'+name+' '+have.toLocaleString()+'/'+q.toLocaleString()+'</span>')};
 Object.entries(o.c||{}).forEach(([k,q])=>add(S.bag.crop[k]||0,CROPN[k],q*n));Object.entries(o.f||{}).forEach(([k,q])=>add(S.bag.flower[k]||0,FLOWERS[k][0],q*n));return[ok,parts.join('')]}
function maxCraft(o){let m=10;Object.entries(o.c||{}).forEach(([k,q])=>m=Math.min(m,Math.floor((S.bag.crop[k]||0)/q)));Object.entries(o.f||{}).forEach(([k,q])=>m=Math.min(m,Math.floor((S.bag.flower[k]||0)/q)));return m}
function openKitchen(){if(guard())return;open('<h3>🔥 ครัว • อาหารบ้าน</h3><div class="hint">แตะเมนูเพื่อเลือกจำนวน • ชื่อเมนูและตัวเลขเป็นของชั่วคราว</div>'+FOODS.map((f,i)=>{const[ok,h]=needQty(f[2],1);return '<button class="opt" data-i="'+i+'"><i>'+f[3]+'</i><span><b>'+f[0]+'</b><span class="need">'+h+'</span></span><span class="r">'+f[1]+'%</span></button>'}).join(''));
 $('sheetBody').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openCraft(+b.dataset.i,1))}
function openCraft(i,n){const f=FOODS[i],mx=maxCraft(f[2]);n=Math.max(1,Math.min(10,n));const[ok,h]=needQty(f[2],n);
 open('<h3>'+f[3]+' '+f[0]+'</h3><div class="hint">โอกาสสำเร็จครั้งละ '+f[1]+'% • คราฟได้สูงสุด 10 ครั้งต่อรอบ</div>'+
  '<div class="qty"><button id="qm">−</button><b>'+n+'</b><button id="qp">＋</button><button class="mx" id="qx">สูงสุด ('+Math.max(1,mx)+')</button></div>'+
  '<div class="hint" style="margin:.5rem 0 .2rem">วัตถุดิบที่จะใช้ทั้งหมด</div><div class="need" style="justify-content:center">'+h+'</div>'+
  '<div class="hint" style="margin-top:.5rem">ถ้าไม่สำเร็จ วัตถุดิบก็ถูกใช้ไปแล้วนะ</div>'+
  '<div class="row2"><button class="btn2 gray" id="cNo">ยกเลิก</button><button class="btn2" id="cGo"'+(ok?'':' disabled')+'>'+(ok?'ยืนยันคราฟ '+n+' ครั้ง':'วัตถุดิบไม่พอ')+'</button></div>');
 $('qm').onclick=()=>openCraft(i,n-1);$('qp').onclick=()=>openCraft(i,n+1);$('qx').onclick=()=>openCraft(i,Math.max(1,mx));$('cNo').onclick=openKitchen;
 $('cGo').onclick=()=>{if(!needQty(f[2],n)[0])return;Object.entries(f[2].c||{}).forEach(([k,q])=>S.bag.crop[k]-=q*n);Object.entries(f[2].f||{}).forEach(([k,q])=>S.bag.flower[k]-=q*n);
  const res=[];for(let t=0;t<n;t++)res.push(Math.random()*100<f[1]);const ok2=res.filter(Boolean).length;S.bag.food[f[0]]=(S.bag.food[f[0]]||0)+ok2;save();

   (ok2?'<div class="got"><span>'+f[3]+'</span><b>'+f[0]+' ×'+ok2+'</b></div>':'<div class="hint">วัตถุดิบถูกใช้ไปแล้ว ลองใหม่นะ</div>')+
   '<div class="row2"><button class="btn2 gray" id="rBack">คราฟต่อ</button><button class="btn2" id="rOk">'+(ok2?'🎒 รับเข้ากระเป๋า':'ปิด')+'</button></div></div>');
  $('rOk').onclick=()=>{closeAll();if(ok2)toast(f[0]+' ×'+ok2+' เข้ากระเป๋าแล้ว')};$('rBack').onclick=openKitchen}}
function openFlowerPick(i){open('<h3>🌸 '+(i<0?'ปลูกดอกไม้ทั้งหมด':'ปลูกดอกไม้ แปลงที่ '+(i+1))+'</h3><div class="hint">'+(i<0?'เลือก 1 ชนิด ปลูกทุกแปลงที่ว่าง':'แตะดอกไม้ที่อยากปลูก')+'</div><div class="grid">'+Object.entries(FLOWERS).map(([k,f])=>'<div class="cell" data-k="'+k+'"><img src="'+IMG['fl-'+k]+'"><b>'+f[0]+'</b><span>'+(f[1]>=60?(f[1]/60).toFixed(f[1]%60?1:0)+' ชม.':f[1]+' นาที')+'</span></div>').join('')+'</div>');
 $('sheetBody').querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{const k=c.dataset.k,now=Date.now();if(i<0){let n=0;S.plots.forEach((p,j)=>{if(!p){S.plots[j]={f:k,t:now};n++}});toast('ปลูก'+FLOWERS[k][0]+' '+n+' แปลงแล้ว')}else{S.plots[i]={f:k,t:now};toast('ปลูก'+FLOWERS[k][0]+'แล้ว')}save();closeAll();draw()})}
function tapPlot(i){if(guard())return;const p=S.plots[i];if(!p)return openFlowerPick(i);const st=fStage(p),F=FLOWERS[p.f];
 if(st===3){harvestFlowers([i]);return}
 open('<h3>'+F[0]+' • แปลงที่ '+(i+1)+'</h3><div class="hint">บานในอีก '+fmtT(p.t+mins(F[1])-Date.now())+'</div><button class="opt" id="oF"'+(S.bag.item.fert<F[2]?' disabled':'')+'><i><img src="'+IMG['it-fert']+'"></i><span><b>ใส่ปุ๋ยนางฟ้า</b><small>บานพร้อมเก็บทันที • ใช้ '+F[2]+' ชิ้น</small></span><span class="r">มี '+S.bag.item.fert+'</span></button>');
 $('oF').onclick=()=>{if(S.bag.item.fert<F[2])return toast('ปุ๋ยนางฟ้าไม่พอนะ',1);S.bag.item.fert-=F[2];p.t=Date.now()-mins(F[1]);save();closeAll();draw();toast('🌼 '+F[0]+'บานแล้ว!')}}
function fertAll(){if(guard())return;const l=S.plots.map((p,i)=>p&&fStage(p)<3?i:-1).filter(i=>i>=0);if(!l.length)return toast('ไม่มีดอกไม้ที่กำลังโตนะ',1);
 const need=l.reduce((s,i)=>s+FLOWERS[S.plots[i].f][2],0);
 open('<h3>🌼 ใส่ปุ๋ยนางฟ้าทั้งหมด</h3><div class="hint">ดอกไม้ที่กำลังโต '+l.length+' แปลง • แต่ละชนิดใช้ปุ๋ยไม่เท่ากัน</div><button class="opt" id="oFA"'+(S.bag.item.fert<need?' disabled':'')+'><i><img src="'+IMG['it-fert']+'"></i><span><b>ใส่ทั้งหมด '+l.length+' แปลง</b><small>ต้องใช้ '+need+' ชิ้น</small></span><span class="r">มี '+S.bag.item.fert+'</span></button>'+(S.bag.item.fert<need?'<div class="hint">ปุ๋ยไม่พอ ใส่ทีละแปลงแทนได้</div>':''));
 $('oFA').onclick=()=>{if(S.bag.item.fert<need)return;S.bag.item.fert-=need;l.forEach(i=>S.plots[i].t=Date.now()-mins(FLOWERS[S.plots[i].f][1]));save();closeAll();draw();toast('🌼 ดอกไม้บานทั้งหมด '+l.length+' แปลง')}}
function harvestFlowers(l){const got={};l.forEach(i=>{const p=S.plots[i];if(!p||fStage(p)<3)return;const q=2+Math.floor(Math.random()*4);got[p.f]=(got[p.f]||0)+q;S.bag.flower[p.f]=(S.bag.flower[p.f]||0)+q;S.plots[i]=null});save();draw();
 const t=Object.entries(got).map(([k,q])=>FLOWERS[k][0]+' ×'+q).join(' • ');if(t)toast('💐 เก็บเข้ากระเป๋าดอกไม้: '+t)}
function pickAll(){if(guard())return;const l=S.plots.map((p,i)=>p&&fStage(p)===3?i:-1).filter(i=>i>=0);if(!l.length)return toast('ยังไม่มีดอกไม้บานนะ',1);harvestFlowers(l)}
function tapBarrel(i){if(guard())return;const b=S.barrels[i];
 if(b&&Date.now()>=b.end){S.bag.wine[b.w]=(S.bag.wine[b.w]||0)+1;S.barrels[i]=null;save();draw();return toast('🍷 ได้'+WINES[b.w][0]+' เข้ากระเป๋าแล้ว')}
 if(b)return toast(WINES[b.w][0]+' • อีก '+fmtT(b.end-Date.now()));
 open('<h3>🍷 หมักไวน์ ถังที่ '+(i+1)+'</h3><div class="hint">ใช้ผักจากกระเป๋า • หมักเสร็จแล้วแตะถังเพื่อเก็บ</div>'+Object.entries(WINES).map(([k,w])=>{const[ok,h]=needHTML({c:w[2]});return '<button class="opt" data-w="'+k+'"'+(ok?'':' disabled')+'><i><img src="'+IMG['wine-'+k]+'"></i><span><b>'+w[0]+'</b><span class="need">'+h+'</span></span><span class="r">'+w[1]+' ชม.</span></button>'}).join(''));
 $('sheetBody').querySelectorAll('[data-w]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.w,w=WINES[k];Object.entries(w[2]).forEach(([c,q])=>S.bag.crop[c]-=q);S.barrels[i]={w:k,t:Date.now(),end:Date.now()+mins(w[1]*60)};save();closeAll();draw();toast('เริ่มหมัก'+w[0]+'แล้ว')})}
function collectDrops(ids){if(guard())return;const got={};S.drops=S.drops.filter(d=>{if(ids.includes(d.id)){got[d.k]=(got[d.k]||0)+1;S.bag.hedge[d.k]=(S.bag.hedge[d.k]||0)+1;return false}return true});save();draw();
 toast('🦔 เก็บ '+Object.entries(got).map(([k,q])=>DROPS[k]+' ×'+q).join(' • '))}
let bagTab='flower';
function openBag(){const T={crop:'🥬 ผัก',flower:'🌸 ดอกไม้',wine:'🍷 ไวน์',food:'🍲 อาหารบ้าน',hedge:'🦔 ของเม่น',item:'✨ ไอเทม'};
 const render=()=>{const e=Object.entries(S.bag[bagTab]).filter(([,q])=>q>0);
  const name=k=>bagTab==='crop'?(CROPN[k]||k):bagTab==='flower'?FLOWERS[k][0]:bagTab==='wine'?WINES[k][0]:bagTab==='hedge'?DROPS[k]:bagTab==='item'?{fert:'ปุ๋ยนางฟ้า',cake:'เค้ก',coconut:'มะพร้าว',angel:'ปีกนางฟ้า'}[k]:k;
  const im=k=>{const fi=FOODS.findIndex(f=>f[0]===k);return bagTab==='flower'?'<img src="'+IMG['fl-'+k]+'">':bagTab==='wine'?'<img src="'+IMG['wine-'+k]+'">':bagTab==='hedge'?'<img src="'+IMG['hedge-'+k]+'">':bagTab==='food'&&fi>=0?FOODS[fi][3]:bagTab==='item'&&k==='fert'?'<img src="'+IMG['it-fert']+'">':'<div style="font-size:1.8rem">'+(bagTab==='crop'?'🥬':bagTab==='item'?({cake:'🍰',coconut:'🥥',angel:'🪽'}[k]||'✨'):'🍲')+'</div>'};
  open('<h3>🎒 กระเป๋า</h3><div class="hint">🙏 '+S.merit.toLocaleString()+' กุศล</div><div class="tabs">'+Object.entries(T).map(([k,v])=>'<button data-t="'+k+'" class="'+(k===bagTab?'on':'')+'">'+v+'</button>').join('')+'</div><div class="grid">'+(e.length?e.map(([k,q])=>'<div class="cell">'+im(k)+'<b>'+name(k)+'</b><span>×'+q.toLocaleString()+'</span></div>').join(''):'<div class="empty">ยังไม่มีของในแผนกนี้</div>')+'</div>');
  $('sheetBody').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{bagTab=b.dataset.t;render()})};render()}
function openSet(){open('<h3>⚙️ ตั้งค่าหน้าทดลอง</h3><div class="hint">มีเฉพาะในตัวอย่างนี้</div><div class="hint" style="margin:.2rem 0">⏱️ ความเร็วเวลา</div><div class="speed" id="sp"><button data-s="60">1 ชม. = 1 นาที</button><button data-s="360">1 ชม. = 10 วิ</button><button data-s="1800">1 ชม. = 2 วิ</button></div>'+
 '<div class="hint" style="margin:.8rem 0 .2rem">🏠 เลเวลบ้าน (จำนวนเม่น 1 / 3 / 5 ตัว)</div><div class="speed" id="lv"><button data-l="1">Lv.1</button><button data-l="2">Lv.2</button><button data-l="3">Lv.3</button></div>'+
 '<div style="text-align:center;margin-top:1rem"><button class="link" id="rs">ล้างข้อมูลทดลองทั้งหมด</button></div>');
 $('sp').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.s===speed);b.onclick=()=>{speed=+b.dataset.s;closeAll();toast('เปลี่ยนความเร็วเวลาแล้ว')}});
 $('lv').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.l===S.lv);b.onclick=()=>{S.lv=+b.dataset.l;save();closeAll();build();toast('บ้าน Lv.'+S.lv+' • เม่น '+({1:1,2:3,3:5}[S.lv])+' ตัว')}});
 $('rs').onclick=()=>{if(!confirm('ล้างข้อมูลทดลองทั้งหมด?'))return;S=fresh();save();closeAll();build();toast('เริ่มใหม่แล้ว')}}
addEventListener('resize',fit);fit();build();

function setFan(items){const f=$('fan');f.innerHTML=items.map((it,i)=>'<button data-i="'+i+'"><i>'+it[0]+'</i>'+it[1]+'</button>').join('');f._items=items;f.classList.remove('open');$('toolBtn').classList.remove('open')}
$('toolBtn').onclick=()=>{$('toolBtn').classList.toggle('open');$('fan').classList.toggle('open')};
$('fan').addEventListener('click',e=>{const b=e.target.closest('button');const f=$('fan');if(!b||!f.classList.contains('open'))return;f.classList.remove('open');$('toolBtn').classList.remove('open');f._items[+b.dataset.i][2]()});

</script><script>/* ===== 🧰 เมนูเครื่องมือ 2 ชั้น: หมวด → รายการ ===== */
(function(){
const fan=document.getElementById('fan'),tool=document.getElementById('toolBtn');if(!fan||!tool)return;
const st=document.createElement('style');st.textContent='.fan .fg-hide{display:none!important}.fan .fcat i{background:#FFF3C9!important}.fan .fcat.back i{background:#EEE!important}.fan .fcat b{font-weight:700}';document.head.appendChild(st);
const CATS=[['other','⚙️','อื่นๆ',/ตั้งค่าทดลอง|กลับฟาร์ม|กระเป๋า|ขึ้นบ้าน|ลงห้องใต้ดิน/],['box','🎁','กล่องสุ่ม',/กล่องสุ่ม/],['animal','🐾','สัตว์',/^วาง(แมว|แฮมสเตอร์)/],
 ['care','💕','ดูแล',/อาบน้ำ|นวด|เอนเตอร์เทน/],['food','🍽️','อาหาร',/คราฟอาหาร|เตา|ให้อาหาร|ดื่ม/],['craft','🔨','คราฟ',/คราฟ/],
 ['harvest','🧺','เก็บ',/เก็บ|เกี่ยว/],['grow','🌱','ดูแลแปลง',/ปลูก|รดน้ำ|หนอน|เร่ง|ปีก|ปุ๋ย/]];
let cur='',self=false;
const items=()=>[...fan.children].filter(b=>b.tagName==='BUTTON'&&!b.classList.contains('fcat'));
const usable=b=>b.style.display!=='none';
const label=b=>[...b.childNodes].filter(n=>n.nodeName!=='I').map(n=>n.textContent).join('').replace(/\s+/g,' ').trim();
function catOf(b){const t=label(b);for(const c of CATS)if(c[3].test(t))return c[0];return 'other'}
function render(){self=true;fan.querySelectorAll('.fcat').forEach(e=>e.remove());const list=items(),av=list.filter(usable);
 if(av.length<=4){list.forEach(b=>b.classList.remove('fg-hide'));setTimeout(()=>{self=false},0);return}
 const groups={};av.forEach(b=>{const c=catOf(b);(groups[c]=groups[c]||[]).push(b)});
 if(!cur||!groups[cur]){cur='';list.forEach(b=>b.classList.add('fg-hide'));
  CATS.slice().reverse().forEach(([k,ic,nm])=>{const g=groups[k];if(!g)return;
   if(g.length===1){g[0].classList.remove('fg-hide');fan.appendChild(g[0]);return}
   const c=document.createElement('button');c.className='fcat';c.dataset.cat=k;c.innerHTML='<i>'+ic+'</i><b>'+nm+'</b> <small style="opacity:.6">('+g.length+')</small>';fan.appendChild(c)})}
 else{list.forEach(b=>b.classList.toggle('fg-hide',!groups[cur].includes(b)));const back=document.createElement('button');back.className='fcat back';back.dataset.cat='';back.innerHTML='<i>↩</i>หมวดทั้งหมด';fan.insertBefore(back,fan.firstChild)}
 setTimeout(()=>{self=false},0)}
fan.addEventListener('click',e=>{const c=e.target.closest('.fcat');if(!c)return;e.stopImmediatePropagation();e.preventDefault();cur=c.dataset.cat;render()},true);
tool.addEventListener('click',()=>{cur='';setTimeout(render,0)},true);
new MutationObserver(()=>{if(self)return;cur='';render()}).observe(fan,{childList:true});
render();
})();
</script><script>(function(){const H=parent.__HOST;
const UP={2:{wood:2000,stone:2000,rope:100,steel:100},3:{wood:5000,stone:5000,rope:300,steel:300}};
window.openUpgrade=function(){const nx=(S.lv||1)+1;if(nx>3)return toast('🏠 บ้านเลเวลสูงสุดแล้ว');const need=UP[nx],f=S.bag.forest||{};let ok=true;
 const rows=Object.entries(need).map(([k,n])=>{const h=f[k]||0;if(h<n)ok=false;return '<div style="display:flex;justify-content:space-between;padding:.2rem 0"><span>'+{wood:'ไม้',stone:'หิน',rope:'เชือก',steel:'เหล็ก'}[k]+'</span><b style="color:'+(h>=n?'#2F8A65':'#C8443D')+'">'+Math.min(h,n).toLocaleString()+' / '+n.toLocaleString()+'</b></div>'}).join('');
 H.ask('🏠 อัปเกรดบ้านเป็น Lv.'+nx,rows+'<div style="font-size:.75rem;color:#9A7A68;margin-top:.3rem">บ้านใหญ่ขึ้น เม่นแคระเพิ่มเป็น '+({2:3,3:5}[nx])+' ตัว</div>',ok?'อัปเกรดเลย':'',()=>{for(const k in need)S.bag.forest[k]-=need[k];S.lv=nx;save();build();toast('🎉 บ้านเลเวล '+nx+' แล้ว!')})};
const b=document.createElement('button');b.textContent='🏠⬆️';b.title='อัปเกรดบ้าน';b.style.cssText='position:fixed;left:.6rem;bottom:calc(env(safe-area-inset-bottom,0px) + .7rem);z-index:30;border:2px solid #fff;border-radius:999px;background:rgba(255,251,245,.92);font-size:1.05rem;padding:.35rem .6rem;box-shadow:0 3px 8px rgba(0,0,0,.2)';b.onclick=()=>openUpgrade();document.body.appendChild(b);
})();</script></body></html>
