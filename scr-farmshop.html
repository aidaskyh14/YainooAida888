<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ทดลองร้านค้าหน้าฟาร์ม</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--cocoa:#6E4B3A;--soft:#9A7A68;--aqua:#5BB6D4;--mint:#BDEBDD;--pig:#F6A9BD;--cream:#FFFBF5}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;overflow:hidden;background:#8fcf8f}
body{font-family:'Mali',sans-serif;color:var(--cocoa);font-size:.85rem;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;overflow:hidden}
#view::before{content:"";position:absolute;inset:-40px;background:var(--bg) center/cover no-repeat;filter:blur(18px) brightness(.85)}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-size:100% 100%;transition:opacity .2s}
.stage.fade{opacity:0}
.an{position:absolute;transform:translate(-50%,-88%);width:13%;aspect-ratio:1;cursor:pointer}
.an .sp{position:absolute;inset:0;background-size:400% 400%}
.an .sh{position:absolute;left:18%;right:18%;bottom:-3%;height:16%;border-radius:50%;background:radial-gradient(ellipse,rgba(60,35,10,.35),rgba(60,35,10,0) 70%)}
.an.sick .sp{filter:saturate(.5) brightness(.95)}
.an .bd{position:absolute;left:50%;top:-14%;transform:translateX(-50%);font-size:1.05rem;background:#fff;border-radius:50%;width:1.7rem;height:1.7rem;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.an .bar{position:absolute;left:20%;right:20%;bottom:-10%;height:.28rem;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
.an .bar i{display:block;height:100%;background:linear-gradient(90deg,#FFE08A,#F2A23A)}
.an.dead .sp{filter:grayscale(1) opacity(.5)}
.empty{position:absolute;transform:translate(-50%,-50%);font-size:.72rem;color:#6E4B3A;font-weight:700;cursor:pointer;background:rgba(255,251,245,.75);border:2px dashed rgba(110,75,58,.4);border-radius:999px;padding:.15rem .6rem}
.trough{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;justify-content:center}
.trough .pile{display:flex;flex-wrap:wrap;justify-content:center;width:100%}
.trough .pile img{width:8.5%;margin:-.5% -.6%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.trough .cnt{position:absolute;right:-2%;top:-30%;background:#F25C7A;color:#fff;font-weight:800;font-size:.75rem;border:2px solid #fff;border-radius:999px;padding:.05rem .45rem;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.trough .hint2{position:absolute;bottom:-34%;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:700;background:rgba(255,251,245,.9);border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.flyp{position:absolute;width:5%;pointer-events:none;transition:left .9s ease-in,top .9s ease-in,opacity .9s;z-index:3}
.dots{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + .55rem);display:flex;gap:.3rem;background:rgba(255,251,245,.9);border:2px solid #fff;border-radius:999px;padding:.2rem .35rem;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.dots button{border:0;background:none;font-size:1.05rem;width:2rem;height:2rem;border-radius:50%;cursor:pointer;opacity:.45}
.dots button.on{opacity:1;background:#FFF3C9}
.tool{position:fixed;z-index:6;right:.6rem;bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);width:3.1rem;height:3.1rem;border-radius:50%;border:3px solid #fff;font-size:1.3rem;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#FFF7D6,#FFD86B);box-shadow:0 4px 0 rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.25);transition:transform .25s}
.tool.open{transform:rotate(45deg)}
.fan{position:fixed;z-index:6;right:.7rem;bottom:calc(env(safe-area-inset-bottom,0px) + 4rem);display:flex;flex-direction:column-reverse;gap:.35rem;align-items:flex-end;pointer-events:none}
.fan button{pointer-events:none;display:flex;align-items:center;gap:.35rem;border:2px solid #fff;border-radius:999px;background:rgba(255,251,245,.97);font:inherit;font-weight:600;font-size:.76rem;color:var(--cocoa);padding:.2rem .75rem .2rem .25rem;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;opacity:0;transform:translateY(1rem) scale(.8);transition:.2s}
.fan button i{font-style:normal;width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;background:#EAF6F3;font-size:.9rem}
.fan.open button{opacity:1;transform:none;pointer-events:auto}
.shade{position:fixed;inset:0;z-index:8;background:rgba(40,60,40,.4);opacity:0;pointer-events:none;transition:.2s}.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:9;left:50%;bottom:0;width:min(27rem,100vw);transform:translate(-50%,105%);transition:transform .18s ease-out;background:var(--cream);border:3px solid #fff;border-bottom:0;border-radius:1.6rem 1.6rem 0 0;padding:.9rem .9rem calc(env(safe-area-inset-bottom,0px) + 1.1rem);max-height:84vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
h3{margin:0 0 .3rem;font-size:1.02rem;text-align:center}.hint{font-size:.7rem;color:var(--soft);text-align:center;margin-bottom:.5rem}
.opt{display:flex;align-items:center;gap:.6rem;width:100%;border:2px solid #fff;background:#fff;border-radius:1rem;padding:.45rem .7rem;margin-bottom:.35rem;font:inherit;color:var(--cocoa);cursor:pointer;text-align:left;box-shadow:0 3px 8px rgba(70,150,180,.12)}
.opt img{width:2.6rem;height:2.6rem;object-fit:contain}.opt b{flex:1;font-size:.84rem}.opt b small{display:block;font-weight:500;font-size:.66rem;color:var(--soft)}.opt span{font-size:.72rem;font-weight:700;color:#B9761F;white-space:nowrap}
.opt:disabled{opacity:.45}
.row{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0}
.btn{border:0;border-radius:999px;font:inherit;font-weight:700;font-size:.8rem;padding:.5rem .9rem;cursor:pointer;background:var(--aqua);color:#fff;box-shadow:0 3px 0 #3F98B6}
.btn.g{background:#6CC9A8;box-shadow:0 3px 0 #4DAA8A}.btn.gray{background:#EEE;color:var(--soft);box-shadow:none}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.cell{background:#fff;border:2px solid #F3E9DE;border-radius:.9rem;padding:.3rem .15rem;text-align:center;position:relative}
.cell img{width:100%;aspect-ratio:1;object-fit:contain}.cell b{display:block;font-size:.6rem;line-height:1.2}.cell span{font-size:.7rem;font-weight:800;color:#B9761F}
.cell.t1{border-color:#BFE3F5;background:#F3FAFE}.cell.t2{border-color:#FFD86B;background:#FFFBEA}.cell.t2::after{content:"✨";position:absolute;right:.15rem;top:.1rem;font-size:.7rem}
.ann{position:fixed;z-index:12;left:50%;top:calc(env(safe-area-inset-top,0px) + 3.6rem);transform:translate(-50%,-10px);opacity:0;background:var(--cream);border:2px solid var(--mint);border-radius:1rem;padding:.3rem .8rem .3rem .3rem;font-size:.78rem;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:.25s;pointer-events:none;width:max-content;max-width:94vw;display:flex;gap:.4rem;align-items:center}
.ann img{width:2rem;height:2rem;flex:none}.ann.show{opacity:1;transform:translate(-50%,0)}.ann.err{border-color:var(--pig);background:#FFF4F6}
.sign{position:absolute;left:14.5%;right:14.5%;top:8.8%;height:8%;display:grid;place-items:center;cursor:pointer;font-weight:800;color:#5A3A22;text-shadow:0 1px 0 rgba(255,235,200,.7);font-size:1.25rem;letter-spacing:.02em;text-align:center;line-height:1.1}
.crate{position:absolute;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.crate .pile{position:absolute;left:10%;right:10%;bottom:22%;height:85%;display:flex;align-items:flex-end;justify-content:center}
.crate .pile img{max-width:70%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.crate .pile img.b2{position:absolute;max-width:48%;left:6%;bottom:0;transform:rotate(-10deg)}.crate .pile img.b3{position:absolute;max-width:48%;right:6%;bottom:0;transform:rotate(9deg)}
.crate .lb{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);background:rgba(255,251,245,.96);border:2px solid #fff;border-radius:999px;padding:.05rem .45rem;font-size:.6rem;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.crate .lb b{color:#B9761F}
.crate .plus{font-size:.66rem;font-weight:700;color:rgba(110,75,58,.6);margin-bottom:28%}
.crate.sold .pile{filter:grayscale(.6) opacity(.55)}
.crate .stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid #D9506E;color:#D9506E;font-weight:900;font-size:.8rem;padding:.05rem .4rem;border-radius:.4rem;background:rgba(255,255,255,.8)}
.board{position:absolute;left:3%;top:76.5%;width:52%;height:18%;background:#2F4A3A;border:.35rem solid #8B5A30;border-radius:.6rem;box-shadow:0 6px 12px rgba(0,0,0,.3),inset 0 0 18px rgba(0,0,0,.35);color:#F4F0E6;padding:.4rem .55rem;font-size:.75rem;line-height:1.35;cursor:pointer;overflow:hidden}
.board small{display:block;opacity:.7;font-size:.6rem}
.cash{position:absolute;right:3%;top:77.5%;width:39%;height:16%;background:linear-gradient(180deg,#FFE7A8,#E8B440);border:3px solid #fff;border-radius:.8rem;box-shadow:0 6px 12px rgba(0,0,0,.25);padding:.4rem .5rem;font-size:.68rem;font-weight:700;color:#6E4B3A;display:flex;flex-direction:column;justify-content:center;gap:.15rem;text-align:center}
.cash big{font-size:1rem;font-weight:900}
.closed{position:absolute;inset:0;background:rgba(20,25,60,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:.3rem;z-index:5}
.closed div{font-size:3rem}.closed b{font-size:1.1rem}.closed small{font-size:.75rem;opacity:.85}
.topbar{position:fixed;z-index:6;left:.6rem;right:.6rem;top:calc(env(safe-area-inset-top,0px) + .5rem);display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
.topbar button{border:2px solid #fff;border-radius:999px;background:rgba(255,251,245,.95);font:inherit;font-size:.68rem;font-weight:700;padding:.25rem .6rem;color:#6E4B3A;box-shadow:0 3px 8px rgba(0,0,0,.2);cursor:pointer}
.topbar button.on{background:#FFF3C9}
.qty{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:.4rem 0}
.qty button{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid #fff;background:#EAF6F3;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;color:var(--cocoa)}
.qty input{width:5rem;text-align:center;font:inherit;font-size:16px;font-weight:800;border:2px solid #EEE;border-radius:.6rem;padding:.25rem;color:var(--cocoa)}
.tabs{display:flex;gap:.25rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.4rem}
.tabs button{flex:none;border:2px solid #fff;border-radius:999px;background:#EAF6F3;font:inherit;font-size:.72rem;font-weight:700;padding:.25rem .65rem;color:var(--cocoa);cursor:pointer}
.tabs button.on{background:#6CC9A8;color:#fff}
.cell{cursor:pointer}.cell.dis{opacity:.4}
.inp{width:100%;font:inherit;font-size:16px;border:2px solid #EEE;border-radius:.8rem;padding:.5rem .7rem;color:var(--cocoa);margin:.3rem 0}
</style></head><body>
<div id="view"><div class="stage" id="stage"></div></div>
<div class="topbar" id="topbar"></div>
<div class="shade" id="shade"></div>
<section class="sheet" id="sheet"><div id="sb"></div></section>
<div class="ann" id="ann"><img id="aImg"><span id="aTxt"></span></div>
<script src="farmshop.js"></script></body></html>
