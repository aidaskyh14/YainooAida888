<html lang="th" style="--bg: url(ASSET_REMOVED);"><head><script src="craft-result.js?v=ss3-boxes-fixes4"></script><!-- frame-runtime --><!-- /frame-runtime --><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทดลองตกปลา – ในสวนของยัยหนู</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--cocoa:#6E4B3A;--soft:#9A7A68;--aqua:#5BB6D4;--mint:#BDEBDD;--pig:#F6A9BD;--cream:#FFFBF5;--gold:#E9B949;--deep:#1d5d86;--red:#E8677E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cocoa:#6E4B3A;--cream:#FFFBF5}}
:root[data-theme="dark"]{--cocoa:#6E4B3A;--cream:#FFFBF5}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
html,body{height:100%;margin:0;overflow:hidden;background:#2b6fb5}
body{font-family:'Mali','Sukhumvit Set','Leelawadee UI',sans-serif;color:var(--cocoa);font-size:.85rem;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#view{position:fixed;inset:0;overflow:hidden}

.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-size:100% 100%;container-type:inline-size}
/* top + bottom bars */
.top{position:fixed;z-index:6;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + .45rem) .5rem 0;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,251,245,.95);border:3px solid #fff;border-radius:999px;padding:.25rem .6rem;font-weight:700;font-size:.72rem;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap;cursor:default}
.chip.btn{cursor:pointer}
.chip.closed{background:#5a4a6b;color:#fff;border-color:#FFD86B}
.chip.adm{background:#FFF3C9}
.spacer{margin-left:auto}
.rbtn{width:2.7rem;height:2.7rem;border-radius:50%;border:3px solid #fff;font-size:1.2rem;display:grid;place-items:center;cursor:pointer;padding:0;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#E9FBF4);box-shadow:0 4px 0 rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.3)}
.bar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);display:flex;gap:.4rem;align-items:center;width:max-content;max-width:98vw;justify-content:center;flex-wrap:wrap}
.big{border:3px solid #fff;border-radius:999px;font-weight:800;font-size:.86rem;padding:.55rem 1.05rem;cursor:pointer;background:#6CC9A8;color:#fff;box-shadow:0 4px 0 #4DAA8A,0 8px 16px rgba(0,0,0,.25);white-space:nowrap}
.big.info{background:rgba(255,251,245,.96);color:var(--cocoa);box-shadow:0 4px 0 rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.25);cursor:default}
.big.hot{background:var(--red);box-shadow:0 4px 0 #c24a62,0 8px 16px rgba(0,0,0,.3);animation:pulse .8s ease-in-out infinite}
.big.gold{background:linear-gradient(#F5CF6A,#E2A93B);box-shadow:0 4px 0 #b9822a,0 8px 16px rgba(0,0,0,.3)}
.big:disabled{background:#cfd8d6;box-shadow:none;color:#fff;animation:none}
.big small{font-weight:600;font-size:.68rem;opacity:.9}
@keyframes pulse{50%{transform:scale(1.06)}}
.skip{border:2px solid #fff;border-radius:999px;background:#8A7BD1;color:#fff;font-weight:700;font-size:.66rem;padding:.3rem .55rem;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
/* lobby */
.board{position:absolute;left:5%;right:5%;top:5.5%;height:39%;background:rgba(255,251,245,.93);border:3px solid #fff;border-radius:1.2rem;box-shadow:0 8px 22px rgba(0,40,80,.35);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:.3rem;padding:.45rem .45rem 0}
.tab{flex:1;border:2px solid #F3E9DE;background:#fff;border-radius:999px;padding:.28rem .2rem;font-weight:700;font-size:.72rem;cursor:pointer;text-align:center}

.bnote{font-size:.62rem;color:var(--soft);text-align:center;padding:.25rem .5rem 0}
.blist{flex:1;overflow:auto;padding:.3rem .45rem .5rem}
.row{display:flex;align-items:center;gap:.4rem;background:#fff;border:2px solid #F3E9DE;border-radius:.8rem;padding:.22rem .5rem;margin-bottom:.22rem;font-size:.76rem}

.row b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .w{font-weight:800;color:#2E7FA6}

.day{background:#fff;border:2px solid #F3E9DE;border-radius:.9rem;padding:.35rem .5rem;margin-bottom:.35rem}

.closedbox{flex:1;display:grid;place-items:center;text-align:center;padding:1rem;font-weight:700;color:var(--soft)}
.ponds{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;width:min(25rem,94vw)}
.pbtn{border:3px solid #fff;border-radius:1rem;padding:.4rem .5rem;font-weight:800;font-size:.8rem;cursor:pointer;background:linear-gradient(#8ED6F0,#5BB6D4);color:#fff;box-shadow:0 4px 0 #3e8fae,0 8px 14px rgba(0,0,0,.25);text-align:left;display:flex;align-items:center;gap:.3rem}
.pbtn small{display:block;font-weight:600;font-size:.62rem;opacity:.95}
.pbtn.vip{background:linear-gradient(#F5CF6A,#E2A93B);box-shadow:0 4px 0 #b9822a,0 8px 14px rgba(0,0,0,.25)}
.pbtn.locked{filter:grayscale(.8) brightness(.95);opacity:.75}
.pbtn.mine{outline:3px solid #fff;outline-offset:2px}
.lobbyrow{display:flex;gap:.4rem;justify-content:center;width:100%}
/* pond */
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lines line{stroke:rgba(255,255,255,.85);stroke-width:1.4}
.dock{position:absolute;width:17%;height:8%;transform:translate(-50%,-50%);cursor:pointer;border-radius:12%}
.tag{position:absolute;left:50%;top:-8%;transform:translate(-50%,-100%);background:rgba(255,251,245,.95);border:2px solid #fff;border-radius:999px;padding:.05rem .4rem;font-size:max(.56rem,2.8cqw);font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.tag.empty{background:rgba(255,255,255,.4);border-style:dashed;color:#2E5E73;padding:0 .35rem;opacity:.85}
.tag.me{background:#FFF3C9;border-color:#FFD86B}
.rod{position:absolute;width:72%;bottom:20%;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.rod.l{left:42%;transform:scaleX(-1) rotate(-8deg)}
.rod.r{right:42%;transform:rotate(-8deg)}
.float{position:absolute;width:7%;transform:translate(-50%,-60%);cursor:pointer;z-index:2}
.float img{width:100%;display:block;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,40,80,.35))}
.float::after{content:"";position:absolute;left:50%;top:88%;width:150%;height:28%;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ripple 2.2s ease-out infinite;pointer-events:none}
.float.hook img{animation:shake .25s linear infinite}
.float.hook::before{content:"❗";position:absolute;left:50%;top:-70%;transform:translateX(-50%);font-size:max(.9rem,4.4cqw);animation:pulse .6s infinite}
.float .cut{position:absolute;right:-45%;top:-30%;font-size:max(.62rem,3cqw);background:#fff;border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes bob{50%{transform:translateY(-12%)}}
@keyframes shake{0%{transform:translate(0,8%) rotate(-10deg)}50%{transform:translate(0,22%) rotate(10deg)}100%{transform:translate(0,8%) rotate(-10deg)}}
@keyframes ripple{0%{opacity:.9;transform:translateX(-50%) scale(.6)}100%{opacity:0;transform:translateX(-50%) scale(1.4)}}
.snip{position:absolute;width:13%;transform:translate(-50%,-60%);z-index:4;pointer-events:none;animation:snip 1.1s ease-out forwards}
@keyframes snip{0%{opacity:0;transform:translate(-50%,-20%) scale(.4)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}45%{transform:translate(-50%,-70%) scale(1) rotate(-12deg)}60%{transform:translate(-50%,-70%) rotate(12deg)}100%{opacity:0;transform:translate(-50%,-110%) scale(.8)}}
.mission{position:absolute;left:4%;right:4%;top:3%;background:linear-gradient(rgba(255,248,225,.97),rgba(255,239,190,.97));border:3px solid #fff;outline:2px solid var(--gold);border-radius:1rem;padding:.35rem .5rem;display:flex;gap:.5rem;align-items:center;box-shadow:0 6px 18px rgba(80,50,0,.3);z-index:3}

.mission .s{font-size:max(.6rem,2.9cqw);color:#8a6a2a;font-weight:600;margin-top:.1rem}
.mission.idle img{filter:grayscale(.2)}
.pondname{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);font-weight:800;color:#fff;font-size:max(.7rem,3.4cqw);text-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none}
/* overlays */
.ann{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 3.4rem);transform:translate(-50%,-10px);opacity:0;background:var(--cream);border:2px solid var(--mint);border-radius:1rem;padding:.35rem .8rem .35rem .35rem;font-size:.78rem;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:.25s;pointer-events:none;width:max-content;max-width:94vw;display:flex;gap:.4rem;align-items:center;font-weight:600}
.ann img{width:2.1rem;height:2.1rem;flex:none;object-fit:contain}.ann.show{opacity:1;transform:translate(-50%,0)}.ann.err{border-color:var(--pig);background:#FFF4F6}
.shade{position:fixed;inset:0;z-index:18;background:rgba(10,30,60,.5);opacity:0;pointer-events:none;transition:.2s}.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:19;left:50%;bottom:0;width:min(27rem,100vw);transform:translate(-50%,105%);transition:transform .18s ease-out;background:var(--cream);border:3px solid #fff;border-bottom:0;border-radius:1.6rem 1.6rem 0 0;padding:.9rem .9rem calc(env(safe-area-inset-bottom,0px) + 1.1rem);max-height:86vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
h3{margin:0 0 .3rem;font-size:1.02rem;text-align:center}.hint{font-size:.7rem;color:var(--soft);text-align:center;margin-bottom:.5rem;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.opt{background:#fff;border:2px solid #F3E9DE;border-radius:1rem;padding:.45rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;font-weight:700;font-size:.74rem;text-align:center}

.cat{display:flex;align-items:center;gap:.6rem;background:#fff;border:2px solid #F3E9DE;border-radius:1rem;padding:.55rem .7rem;margin-bottom:.35rem;cursor:pointer;font-weight:700}

.item{display:flex;align-items:center;gap:.6rem;background:#fff;border:2px solid #F3E9DE;border-radius:.9rem;padding:.35rem .6rem;margin-bottom:.3rem;font-size:.78rem}
.item img{width:2.6rem;height:2.6rem;object-fit:contain}.item b{flex:1}.item span{font-weight:800;color:#2E7FA6}
.btns{display:flex;gap:.5rem;justify-content:center;margin-top:.7rem;flex-wrap:wrap}
.ghost{border:2px solid #E9DCCD;background:#fff;border-radius:999px;padding:.5rem 1rem;font-weight:700;cursor:pointer}
.rules{font-size:.74rem;line-height:1.55;background:#fff;border-radius:1rem;padding:.6rem .8rem;border:2px solid #F3E9DE}

table.odds{width:100%;border-collapse:collapse;font-size:.68rem;background:#fff;border-radius:.6rem;overflow:hidden}

.catch{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.3rem 0}
.fcard{background:#fff;border:2px solid #F3E9DE;border-radius:1rem;padding:.35rem;width:7.3rem;text-align:center;font-size:.72rem;font-weight:700;position:relative}
.fcard img{width:100%;height:4.6rem;object-fit:contain}
.fcard .w{color:#2E7FA6;font-weight:800;font-size:.84rem}
.fcard .nb{position:absolute;top:-.4rem;right:-.3rem;background:#FFD86B;border:2px solid #fff;border-radius:999px;font-size:.58rem;padding:0 .35rem}
.total{text-align:center;font-weight:800;font-size:1rem;color:#2E7FA6}
/* lobby signs */
.sign{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;animation:sway 3.2s ease-in-out infinite;z-index:2}
.sign .plank{background:linear-gradient(#D7A86E,#B07B48);border:3px solid #7a5230;border-radius:.7rem;padding:.45rem .8rem .4rem;color:#FFF8E8;font-weight:800;font-size:max(.9rem,4.4cqw);text-shadow:0 2px 0 #7a5230;box-shadow:0 6px 0 #6a4628,0 10px 18px rgba(0,30,50,.4);white-space:nowrap;text-align:center;line-height:1.15}
.sign .plank small{display:block;font-size:max(.6rem,2.8cqw);font-weight:700;text-shadow:0 1px 0 #7a5230;opacity:.95}
.sign.vip .plank{background:linear-gradient(#F7D774,#D9A23A);border-color:#9a6a1c;box-shadow:0 6px 0 #8a5d16,0 10px 18px rgba(0,30,50,.4)}
.sign .post{width:.5rem;height:max(1.4rem,7cqw);background:linear-gradient(90deg,#7a5230,#a77649,#7a5230);border-radius:0 0 .3rem .3rem}
.sign .rip{width:3.2rem;height:.7rem;margin-top:-.3rem;border:2px solid rgba(255,255,255,.7);border-radius:50%;animation:ripple2 2.6s ease-out infinite}
.sign.locked .plank{filter:grayscale(.7)}
@keyframes sway{50%{transform:translate(-50%,-54%) rotate(-1.5deg)}}
@keyframes ripple2{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.4)}}
.badge{position:absolute;top:-.2rem;right:-.2rem;background:var(--red);color:#fff;border:2px solid #fff;border-radius:999px;font-size:.6rem;font-weight:800;min-width:1.2rem;height:1.2rem;display:grid;place-items:center}
.ib{position:relative}
.giftbox{font-size:3.4rem;line-height:1;animation:pulse 1s ease-in-out infinite}
/* lobby icon buttons */
.ibtns{display:flex;gap:.9rem;justify-content:center}
.ib{display:flex;flex-direction:column;align-items:center;gap:.15rem;background:none;border:0;padding:0;cursor:pointer}
.ib .rbtn{pointer-events:none}
.ib span{font-size:.64rem;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap}
.mainp{display:flex;gap:.5rem;justify-content:center;width:min(25rem,94vw)}
.mainp .pbtn{flex:1;justify-content:center;text-align:left}
.pcard{display:flex;align-items:center;gap:.6rem;border:3px solid #fff;border-radius:1rem;padding:.6rem .8rem;margin-bottom:.4rem;cursor:pointer;background:linear-gradient(#8ED6F0,#5BB6D4);color:#fff;font-weight:800;box-shadow:0 4px 0 #3e8fae}
.pcard.vip{background:linear-gradient(#F5CF6A,#E2A93B);box-shadow:0 4px 0 #b9822a}
.pcard small{display:block;font-weight:600;font-size:.68rem}
.pcard.locked{filter:grayscale(.85);opacity:.7}
.pcard .e{font-size:1.5rem}
.ings{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin:.4rem 0}
.ing{display:flex;align-items:center;gap:.35rem;background:#fff;border:2px solid #F3E9DE;border-radius:.8rem;padding:.2rem .45rem;font-size:.68rem;font-weight:700}
.ing img{width:1.8rem;height:1.8rem;object-fit:contain}
.ing .q{margin-left:auto;font-weight:800;white-space:nowrap}
.ing.lack{border-color:#F6A9BD;background:#FFF4F6}.ing.lack .q{color:#D2506A}
.ing.ok .q{color:#2E9E6A}
.picker{display:flex;gap:.3rem;overflow-x:auto;padding:.2rem 0 .4rem}
.pk{flex:none;width:3.6rem;background:#fff;border:2px solid #F3E9DE;border-radius:.8rem;padding:.2rem;text-align:center;font-size:.56rem;font-weight:700;cursor:pointer}
.pk img{width:2.2rem;height:2.2rem;object-fit:contain;display:block;margin:0 auto}
.pk.on{border-color:#6CC9A8;background:#E9FBF4}
.lbl2{font-size:.72rem;font-weight:800;margin:.35rem 0 .1rem}
.stepper{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:.4rem 0}
.stepper button{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid #E9DCCD;background:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.stepper b{font-size:1.1rem;min-width:2rem;text-align:center}
/* minigame */
.mini{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:rgba(5,30,55,.55)}
.mini.on{display:grid}

.track{position:relative;height:2.2rem;margin:.8rem .2rem;background:linear-gradient(#FDE3E8,#F8C9D3);border:3px solid #fff;border-radius:999px;box-shadow:0 0 0 2px #F3D3DA inset;overflow:hidden}

.mres{font-weight:800;font-size:1.05rem;min-height:1.4rem}

.book{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;background:radial-gradient(circle at 50% 40%,#2f6f8f,#123247);padding:calc(env(safe-area-inset-top,0px) + .6rem) .4rem calc(env(safe-area-inset-bottom,0px) + .6rem)}

.ptitle{position:absolute;left:0;right:0;top:3.2%;text-align:center;font-weight:800;font-size:4.6cqw;color:#7a4b25;text-shadow:0 1px 0 #fff}

.stat{position:absolute;transform:translate(-50%,0);font-size:2.9cqw;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:999px;padding:.1em .55em;color:#2E7FA6}
