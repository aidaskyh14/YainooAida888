 try{const out=await HC('battery',{});syncFromHost();ann('🔋 '+(MB[out.battery?.id]?.n||'งาน')+' เสร็จทันที');view='factory';openFactory();}catch(e){syncFromHost();ann(e?.message||'ใช้แบตไม่สำเร็จ',1);}finally{fBusy=false;}}

function openPlace(){closeAll();const ks=Object.keys(S.bag).filter(k=>k.startsWith('al-')&&S.bag[k]>0);
 open('<h3>🦙 วางอัลปาก้าลงคอก '+(S.cur+1)+'</h3><div class="hint">คอกละไม่เกิน 12 ตัว • อยู่ได้ 7 วัน • ครบแล้วได้เนื้อ 10 อัตโนมัติ</div><div class="list">'+(ks.length?ks.map(k=>{const[,c,g]=k.split('-');return '<div class="li"><span style="font-size:1.4rem">'+COL[c][1]+'</span><b>'+COL[c][0]+(g?' ✨ทอง':'')+'</b><span>×'+S.bag[k]+'</span><button class="btn sm" data-k="'+k+'">วาง</button></div>'}).join(''):'<div class="hint">ยังไม่มีอัลปาก้าในกระเป๋า • เปิดกล่องสุ่มหรือรับจากยัยหนู</div>')+'</div>');
 $('sb').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(pen().length>=12)return ann('คอกเต็ม 12 ตัวแล้ว',1);const k=b.dataset.k,[,c,g]=k.split('-'),used=pen().map(a=>a.slot),slot=[...Array(12).keys()].find(i=>!used.includes(i));S.bag[k]--;
  pen().push({id:Date.now().toString(36)+rnd(10,99),color:c,gold:!!g,slot,at:Date.now(),woolAt:Date.now()});save();draw();openPlace()})}

 '<div class="row"><button class="btn sm" id="s1">🦙 รับอัลปาก้า 5 สี + ตัวทอง</button><button class="btn sm" id="s2">🌼 เติมวัตถุดิบทุกอย่าง 5,000</button><button class="btn sm" id="s3">🥗 อาหารอัลปาก้า 20 ชาม/อย่าง</button><button class="btn sm" id="s4">🎁 กล่องสุ่ม +100</button><button class="btn sm" id="s5">🔋🧪 แบต+ยา 5</button><button class="btn sm" id="s6">💦 ดูอัลปาก้าถ่มน้ำลายใส่เพื่อน</button></div><div class="sec">👑 มุมแอดมิน</div><div class="row"><button class="btn sm" id="s7">ส่งอัลปาก้าให้ผู้เล่น (ทดลอง: เข้ากระเป๋าตัวเอง)</button></div><div class="row"><button class="btn gray sm" id="s8">🔄 ล้างทั้งหมด</button></div>');

 $('s2').onclick=()=>{Object.keys(ING).forEach(k=>add(k,5000));save();ann('🌼 เติมวัตถุดิบทุกอย่าง 5,000')};$('s3').onclick=()=>{[0,1,2].forEach(i=>add('afood'+i,20));save();ann('🥗 อาหารอัลปาก้า 20 ชาม/อย่าง')};
 $('s4').onclick=()=>{add('box',100);save();ann('🎁 กล่องสุ่มอัลปาก้า +100')};$('s5').onclick=()=>{add('battery',5);add('potion',5);save();ann('🔋 แบต 5 • 🧪 ยาเร่งขน 5')};$('s6').onclick=spit;

function spit(){closeAll();const w=$('wipe'),sp=$('spitSp');sp.style.backgroundImage='url('+IMG.spit+')';w.classList.add('on');let f=0;const iv=setInterval(()=>{sp.style.backgroundPosition=((f%4)*100/3)+'% '+(Math.floor(f/4)*100/3)+'%';if(++f>=16){clearInterval(iv);w.classList.remove('on');let n=3;const s=$('splat');s.innerHTML='💦 โดนอัลปาก้าของเพื่อนถ่มน้ำลาย!<br><small>แตะเช็ดจอ '+n+' ครั้ง</small>';s.classList.add('on');s.onclick=()=>{n--;if(n>0)s.innerHTML='💦 เช็ดอีก '+n+' ครั้ง';else{s.classList.remove('on');if(Math.random()<.3){add('rawwool',20);save();ann('🧶 เช็ดเจอขนร่วงแถม 20!')}else ann('✨ สะอาดแล้ว')}}}},90)}
