 /* 1) โพเดียม (เร็ว ไม่รอโหลดโมเดล) */
 /* โพเดียม: ตกรอบ = ไฟดับ+เทา แล้วค่อย ๆ จมลงน้ำ · คนที่อยู่ต่อเลื่อนเข้าหากันเป็นแถวโค้งกลางเวที */
 const alive=stage.pods.filter(pod=>{const uid=Object.keys(cont).find(u=>cont[u].no===pod.userData.no);const c=uid&&cont[uid];return !!c&&c.alive&&!c.gray;});const n=alive.length;const regroup=!['announce','podium','lights'].includes(P.state)&&P.state!=='result';
 alive.forEach((pod,i)=>{if(regroup){/* เรียงโค้งให้พอดีจอแนวตั้ง: ≤5 คน แถวเดียว · มากกว่านั้น 2 แถวสลับ */let x,z;if(n<=5){const sp=Math.min(3.6,17/Math.max(1,n));x=(i-(n-1)/2)*sp;z=-2-Math.abs(i-(n-1)/2)*.6;}else{const row=i%2,col=Math.floor(i/2),cols=Math.ceil(n/2);const sp=Math.min(3.3,17/Math.max(1,cols));x=(col-(cols-1)/2)*sp+(row?sp/2:0);z=row?-5.5:-1.2;}pod.userData.tx=x;pod.userData.tz=z;}else{pod.userData.tx=pod.userData.home[0];pod.userData.tz=pod.userData.home[1];}});
 for(const pod of stage.pods){const uid=Object.keys(cont).find(u=>cont[u].no===pod.userData.no);const c=uid&&cont[uid];const on=!!c&&(c.alive||P.state==='lights')&&!c.gray;const outNow=!!c&&!c.alive&&P.state!=='lights';pod.userData.ring.material.opacity=on?.85:0;if(outNow!==pod.userData.gray){pod.userData.gray=outNow;pod.userData.base.material=outNow?stage.grayM:stage.padM;pod.userData.top.material=outNow?stage.topGray:stage.topM;pod.userData.rim.material=outNow?stage.topGray:stage.rimM;pod.userData.band.material=outNow?stage.grayM:stage.bandM;}pod.userData.sink=(!c)||outNow;pod.visible=P.state==='result'?false:true;}
 /* 2) วางตัวละครที่โหลดแล้ว */
 for(const [uid,ch] of Object.entries(stage.cont)){if(!ch)continue;const c=cont[uid];if(!c){sc.remove(ch.g);delete stage.cont[uid];continue;}const pod=stage.pods[c.no-1];if(!pod)continue;ch.g.visible=true;
  let x=pod.position.x,z=pod.position.z;if(pod.userData.sink&&P.state!=='lights'){ch.g.visible=false;continue;}if(P.state==='result'&&P.result){const r=P.result.find(r=>r.uid===uid);if(!r){ch.g.visible=false;continue;}const pos=[[0,-2,1.2],[-3.6,0,.6],[3.6,0,.6],[-6.8,2.5,0],[6.8,2.5,0]][r.rank-1]||[0,0,0];x=pos[0];z=pos[1];pod.userData.lift=pos[2];}
  if(!(P.state==='swim'&&ch.swimWalk)){ch.g.position.set(stage.group.position.x+x,3.26+(pod.userData.lift||0),stage.group.position.z+z);ch.g.rotation.y=Math.PI;}
  const gray=c.gray||(!c.alive&&P.state!=='lights');ch.body.traverse(o=>{if(o.isMesh&&o.material){if(gray&&!o.material._g){o.material=o.material.clone();o.material.color.multiplyScalar(.35);o.material._g=true;}}});
  if(P.state==='party'||P.state==='result'&&P.result?.[0]?.uid===uid)play(ch,'dance');else if(P.state==='swim')play(ch,'wave');else if(P.state==='thai')play(ch,'wai');else play(ch,'idle');
  if(c.garland>(ch.garland||0)){ch.garland=c.garland;garlandFx(ch.g.position);}}
 /* 3) โหลดตัวละครที่ยังไม่มี ทีละคน ไม่บล็อก (รอบใหม่มาแล้วหยุดรอบเก่า) */
 stageGen++;const gen=stageGen;(async()=>{let loaded=false;for(const [uid,c] of Object.entries(cont)){if(gen!==stageGen)return;const want=wearFor(c);const cur=stage.cont[uid];if(cur&&cur!==0&&cur.wear!==want){sc.remove(cur.g);delete stage.cont[uid];changeFx(cur.g.position);}if(!stage.cont[uid]){stage.cont[uid]=0;try{const ch=await makeChar({wear:want,name:c.name,h:1.75,tagBg:'rgba(255,214,120,.95)'});ch.no=c.no;ch.wear=want;stage.cont[uid]=ch;ch.idleAct='idle';loaded=true;}catch(e){delete stage.cont[uid];}}}
  if(loaded&&gen===stageGen)syncStage(P,Date.now());})();
 if(stage.lastState!==P.state){stage.lastState=P.state;sweep(P.state);}
 stage.spot.intensity=['lights','swim','result','party'].includes(P.state)?30:12;if(P.state==='result'&&!stage.crownDone){stage.crownDone=true;crownDrop();}if(P.state!=='result'&&P.state!=='party')stage.crownDone=false;if(P.state==='party'&&!stage.partyDone){stage.partyDone=true;confetti(160);}if(P.state!=='party')stage.partyDone=false;}
function crownDrop(){const g=new THREE.Group();const c1=new THREE.Mesh(new THREE.TorusGeometry(.5,.12,12,32),mat(0xffd700,{metalness:.6,roughness:.3,emissive:0xffb300,emissiveIntensity:.4}));c1.rotation.x=Math.PI/2;g.add(c1);for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.12,.5,6),mat(0xffd700,{metalness:.6,roughness:.3}));const a=i/5*Math.PI*2;s.position.set(Math.cos(a)*.5,.3,Math.sin(a)*.5);g.add(s);}const l=new THREE.PointLight(0xffe08a,3,8);g.add(l);g.position.set(stage.group.position.x,3.3,stage.group.position.z-2);sc.add(g);/* ออร่าโพเดียมกลาง */const aura=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.6,9,32,1,true),new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:.0,side:THREE.DoubleSide,depthWrite:false}));aura.position.set(stage.group.position.x,4.5+3.3,stage.group.position.z-2);sc.add(aura);const t0=performance.now();const t=()=>{const k=Math.min(1,(performance.now()-t0)/5000);const e=1-Math.pow(1-k,3);g.position.y=3.3+e*(1.2+1.62);/* ลอยจากล่างขึ้นมาวางบนหัว (โพเดียมกลางยก 1.2 + สูงถึงหัว) */g.rotation.y+=.015;aura.material.opacity=.35*e+Math.sin(performance.now()/300)*.08*e;l.intensity=3+6*e;if(k<1)requestAnimationFrame(t);else{confetti(120);const t2=()=>{aura.material.opacity=.4+Math.sin(performance.now()/300)*.12;aura.rotation.y+=.01;if(sc.children.includes(aura))requestAnimationFrame(t2);};t2();}};t();stage.crown=g;stage.aura=aura;setTimeout(()=>{sc.remove(g);sc.remove(aura);},120000);}
function changeFx(pos){const g=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,3,24,1,true),new THREE.MeshBasicMaterial({color:0xffe6f5,transparent:true,opacity:.7,side:THREE.DoubleSide,depthWrite:false}));g.position.set(pos.x,pos.y+1.5,pos.z);sc.add(g);const t0=performance.now();const t=()=>{const k=Math.min(1,(performance.now()-t0)/900);g.scale.set(1+k,1,1+k);g.material.opacity=.7*(1-k);g.rotation.y+=.1;if(k<1)requestAnimationFrame(t);else sc.remove(g);};t();}
function garlandFx(pos){const g=new THREE.Mesh(new THREE.TorusGeometry(.35,.07,8,24),mat(0xff8fc0,{emissive:0xff5a9a,emissiveIntensity:.5}));g.position.set(pos.x,pos.y+6,pos.z+.3);sc.add(g);const t0=performance.now();const t=()=>{const k=Math.min(1,(performance.now()-t0)/1200);g.position.y=pos.y+6-k*4.6;g.rotation.x=k*3;if(k<1)requestAnimationFrame(t);else setTimeout(()=>sc.remove(g),8000);};t();}
function confetti(n){const cf=$('#cf');const cs=['#ffd27a','#fff','#ff8fc0','#9ad9ff','#b8ffb0'];for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cs[i%cs.length];e.style.animationDelay=(Math.random()*1.5)+'s';e.style.animationDuration=(2.2+Math.random()*1.6)+'s';cf.appendChild(e);setTimeout(()=>e.remove(),5000);}}
$('#cam').onclick=()=>{camMode=camMode==='stage'?'follow':'stage';};
/* รอบชุดว่ายน้ำ: รันเวย์น้ำหน้าเวที เดินไปสุดแล้วกลับทีละคน ละอองน้ำที่เท้า */
let stageGen=0;let runway=null,swimIdx=-1;function ensureRunway(){if(runway)return;const g=new THREE.Group();const RZ0=STAGE_Z+1,RZ1=RIVER_Z+1,RL=RZ1-RZ0,RC=(RZ0+RZ1)/2;const w=new THREE.Mesh(new THREE.PlaneGeometry(6,RL),new THREE.MeshStandardMaterial({map:waterT,color:0x9fe0ff,roughness:.2,metalness:.2,transparent:true,opacity:.9,emissive:0x2a7fbf,emissiveIntensity:.45}));w.rotation.x=-Math.PI/2;w.position.set(0,3.3,RC);const edge=new THREE.Mesh(new THREE.BoxGeometry(6.4,.3,RL+.4),mat(0xf7e2b0));edge.position.set(0,3.1,RC);g.add(edge);g.add(w);for(const x of [-3.2,3.2])for(let z=RZ0+1;z<RZ1;z+=3){const l=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),mat(0xfff0b0,{emissive:0xffd27a,emissiveIntensity:1}));l.position.set(x,3.5,z);g.add(l);}sc.add(g);runway=g;}
function tickSwim(now,dt){if(!P||P.state!=='swim'||!stage.group){if(runway){sc.remove(runway);runway=null;swimIdx=-1;}return;}ensureRunway();const alive=Object.entries(P.contestants||{}).filter(([u,c])=>c.alive&&!c.gray).sort((a,b)=>a[1].no-b[1].no);if(!alive.length)return;const per=9000;const t=(now-(P.swimAt||now))%(per*alive.length);const i=Math.floor(t/per);const k=(t%per)/per;const [uid,c]=alive[i];const ch=stage.cont[uid];if(!ch)return;
 const z0=STAGE_Z+1,z1=RIVER_Z+1;const zz=k<.5?z0+(z1-z0)*(k/.5):z1-(z1-z0)*((k-.5)/.5);ch.g.position.set(stage.group.position.x+0,3.36,zz);ch.g.rotation.y=k<.5?0:Math.PI;play(ch,'walk');ch.swimWalk=true;
 if(Math.random()<.5)splash(ch.g.position.x+(Math.random()-.5)*.6,zz,3.4);if(stage.spot){stage.spot.target.position.set(0,1,zz-STAGE_Z);stage.spot.intensity=40;}
 for(const [u,cc] of alive){if(u!==uid){const o=stage.cont[u];if(o&&o.swimWalk){const pod=stage.pods[cc.no-1];o.g.position.set(stage.group.position.x+pod.position.x,3.26,stage.group.position.z+pod.position.z);o.g.rotation.y=Math.PI;o.swimWalk=false;play(o,'idle');}}}}
function splash(x,z,y=.08){const r=new THREE.Mesh(new THREE.RingGeometry(.15,.3,16),new THREE.MeshBasicMaterial({color:0xe6f7ff,transparent:true,opacity:.8}));r.rotation.x=-Math.PI/2;r.position.set(x,y,z);sc.add(r);const t0=performance.now();const t=()=>{const k=(performance.now()-t0)/500;if(k>=1){sc.remove(r);return;}r.scale.setScalar(1+k*3);r.material.opacity=.8*(1-k);requestAnimationFrame(t);};t();}
/* ---------- ข้อความจากแม่ ---------- */
let P=null,lastPresence=[];
addEventListener('message',e=>{const m=e.data&&e.data.city;if(!m)return;
 if(m.c==='state'){ST.view=m.view;ST.world=m.world;ST.me=m.me;ST.admin=m.admin;setRain(!!m.view?.rain);}
 else if(m.c==='world')ST.world=m.world;else if(m.c==='presence'){lastPresence=m.list||[];syncPeers(lastPresence);}
 else if(m.c==='pageant'){P=m.p;syncStage(P,Date.now());}
 else if(m.c==='act'){const c=menC[m.man];if(c&&c!==0){c.busy=Date.now()+2600;const a={talk:'idle',happy:'idle',sad:'idle',date:'idle',propose:'idle'}[m.act]||'idle';play(c,a);if(me){me.g.lookAt(c.g.position.x,0,c.g.position.z);play(me,m.act==='propose'?'kneel':m.act==='happy'?'happy':m.act==='sad'?'sigh':'talk',true);me.idleAct='idle';setTimeout(()=>{if(me)play(me,'idle');},2400);}}}
 else if(m.c==='map'){camDist=camDist>20?17:34;camPitch=camDist>20?.9:.42;}else if(m.c==='idle'){$('#idle').classList.toggle('on',!!m.on);}else if(m.c==='garland'){const ch=stage.cont[m.to];if(ch&&ch!==0)garlandFx(ch.g.position);}});
$('#idle').onclick=()=>{$('#idle').classList.remove('on');post({s:'toast',msg:'เล่นต่อ'});};
/* ---------- เริ่ม ---------- */
(async()=>{applyDayNight(Date.now());try{ld(5,'โหลดอาคาร…');await loadBuildings();ld(75,'โหลดตัวละคร…');await makeMe();ld(100);post({s:'ready'});post({s:'move',x:me.g.position.x,z:me.g.position.z,tx:me.g.position.x,tz:me.g.position.z});setInterval(()=>{if(me)post({s:'move',x:me.g.position.x,z:me.g.position.z,tx:me.tgt?me.tgt.x:me.g.position.x,tz:me.tgt?me.tgt.z:me.g.position.z});},120000);/* ต่ออายุตำแหน่งทุก 2 นาที */}catch(e){console.log('city load',e&&e.message);ld(100,'โหลดไม่ครบ');}})();
let last=performance.now();function tick(){requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta());const now=Date.now();if(me)stepChar(me,dt);for(const c of Object.values(peers))if(c)stepChar(c,dt);for(const c of Object.values(stage.cont))if(c)c.mx.update(dt);tickMen(now,dt);tickSwim(now,dt);
 if(stage.group){for(const p of stage.pods){const y=(stage.rise&&!p.userData.sink)?0:-4;p.position.y+=(y+(p.userData.lift||0)-p.position.y)*Math.min(1,dt*1.2);p.position.x+=(p.userData.tx-p.position.x)*Math.min(1,dt*1.5);p.position.z+=(p.userData.tz-p.position.z)*Math.min(1,dt*1.5);}if(stage.spot&&stage.state==='lights'){stage.spot.target.position.x=Math.sin(now/400)*18;}}
 if(rainPts){const a=rainPts.geometry.attributes.position;for(let i=1;i<a.array.length;i+=3){a.array[i]-=dt*18;if(a.array[i]<0)a.array[i]=30;}a.needsUpdate=true;}
 if(water){waterT.offset.x+=dt*.015;waterT.offset.y+=dt*.006;}for(const c of clouds){c.position.x+=dt*c.userData.v;if(c.position.x>130)c.position.x=-130;}for(const g of krathongs){g.position.x+=dt*.25;if(g.position.x>62)g.position.x=-62;g.position.y=.12+Math.sin(now/700+g.userData.ph)*.06;g.rotation.y+=dt*.2;}if((now|0)%600<20)applyDayNight(now);stars.visible=moon.visible;updateCam(dt);rd.render(sc,cam);}
tick();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight);});
window.__city3d={get camMode(){return camMode;},get P(){return P;},get me(){return me;},menC,peers,stage,walkTo,manPos,manState,B3,sc,cam,THREE,setCam:(m)=>{camMode=m;}};
