function feed(t){const d=document.createElement('div');d.textContent=t;$('feed').prepend(d);while($('feed').children.length>3)$('feed').lastChild.remove();setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),700);},4200);}
// ---- รับสถานะจากหน้าเกม ----
let prev=null;
addEventListener('message',e=>{const v=e.data&&e.data.s4sync;if(!v)return;live=true;G=Object.assign(G,v);
 const cur2={};for(const p of PL){const s=who(p);cur2[pondOf(p)+p.seat]=s?s.w:null;}
 if(prev)for(const p of PL){const k=pondOf(p)+p.seat;if(cur2[k]&&cur2[k]!==prev[k])feed('🎣 '+cur2[k]+' นั่งแท่น '+p.code);}
 prev=cur2;hud();});
function hud(){const st=$('st');st.textContent=G.open?'🟢 บ่อเปิดอยู่':'🌙 ปิด · เปิด 11–17, 21–07';st.classList.toggle('off',!G.open);
 $('vcard').textContent='🎫 '+(G.vip>9999?'9,999+':(G.vip||0).toLocaleString());$('adm').style.display=G.admin?'':'none';
 let me=null;for(const p of PL){const s=who(p);if(s&&s.me)me=p;}
 if(!me){for(const pn of ['n1','n2','v1','v2']){const i=(G.seats[pn]||[]).findIndex(s=>s&&s.me);if(i>=0){me={code:pn[0]==='v'?'V'+(i+1)+' ห้อง '+pn[1]:(pn==='n1'?['A1','A2','A3','B1','B2','B3']:['C1','C2','C3','D1','D2','D3'])[i]};if(pn[0]==='v'&&pn!==vroom){vroom=pn;$('vroom').textContent='👑 VIP ห้อง '+pn[1];}}}}
 const m=$('mine');if(me){const s=(()=>{for(const pn in G.seats){const x=(G.seats[pn]||[]).find(s=>s&&s.me);if(x)return x;}})();m.textContent=(s&&s.ph==='hook'?'🐟 ปลากินเบ็ดแล้ว! ':'⭐ ')+'คุณอยู่แท่น '+me.code+' · แตะไปตกต่อ';m.classList.add('on');}else m.classList.remove('on');}

// ---- S4: ฉากนั่งตกปลา 3D — ตัวละครเรานั่งที่แท่นจริง ใช้กติกาซีซัน 3 (หย่อนเบ็ด/รอ/ดึง ส่งไปหน้าเกม) ----
const ZK={A:'falls',B:'bamboo',C:'beach',D:'lotus',V:'vip'};let P3=null,p3open=false,p3code=null,p3skip=null,prevMine=null;
function mySeatInfo(){for(const p of PL){const s=who(p);if(s&&s.me)return {p,s};}return null;}
function openP3(){const m=mySeatInfo();if(!m){send('mine');return;}if(p3open)return;p3open=true;p3code=m.p.code;
 const zs=PL.filter(q=>q.z===m.p.z&&pondOf(q)===pondOf(m.p));
 import('./pond3d.js?h=963b4a30').then(mod=>{P3=mod;window.__p3people=()=>mod.people();return mod.openPond({zone:ZK[m.p.z]||'lotus',idx:Math.max(0,zs.indexOf(m.p)),name:' '+m.p.code,seats:zs.map(q=>{const s=who(q);return s?(s.me?'ฉัน':s.w):null;}),outfits:zs.map(q=>{const s=who(q);return s&&!s.me?(s.o||null):null;}),post:a=>a==='resit'?send('seat',pondOf(m.p)+':'+m.p.seat):(String(a).startsWith('tool:')?(()=>{const q=zs[+String(a).slice(5)];if(q)send('p3tool',pondOf(q)+':'+q.seat);})():send(a)),onClose:()=>{p3open=false;p3skip=p3code;}});}).then(()=>{const m2=mySeatInfo();if(P3&&m2)P3.sync(m2.s);}).catch(e=>{p3open=false;console.error(e);feed('⚠️ เปิดฉากนั่งตกปลาไม่สำเร็จ ลองแตะอีกครั้ง');});}
addEventListener('message',e=>{const d=e.data;if(!d)return;if(d.p3res&&P3&&p3open)P3.result(d.p3res);
 if(d.s4sync){const m=mySeatInfo();if(m){if(p3open&&P3&&P3.isOpen()){P3.sync(m.s);/* S4 3.6: เพื่อนมานั่ง/ลุกระหว่างเราอยู่ในฉาก */try{const zs=PL.filter(q=>q.z===m.p.z&&pondOf(q)===pondOf(m.p));P3.roster(zs.map(q=>{const s=who(q);return s?(s.me?'ฉัน':s.w):null;}),zs.map(q=>{const s=who(q);return s&&!s.me?(s.o||null):null;}));}catch(e){}}else if(!p3open&&prevMine!==m.p.code&&p3skip!==m.p.code)openP3();prevMine=m.p.code;}else{prevMine=null;p3skip=null;if(p3open&&P3&&P3.isOpen())P3.standby();}}});
window.__fzP3=()=>({open:p3open,code:p3code});
hud();
setTimeout(()=>{if(!live)feed('🗺️ แตะแท่นที่ว่างเพื่อนั่งตกปลา');},1500);
})();
</script>
