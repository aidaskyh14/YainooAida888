 clearInterval(syncT);syncT=setInterval(()=>{if(!document.hidden)sync();},450);$('#liteBtn').textContent='🔋 ประหยัด';setTimeout(()=>{$('#loading').style.display='none';},9000);}
function closeFarm(){CUR=null;clearInterval(syncT);clearInterval(cntT);const f=F();if(f)f.remove();/* ปิดฉาก = คืนหน่วยความจำ/GPU ทันที */$('#viewer').classList.remove('on');$('#lite').classList.remove('on');}
$('#vClose').onclick=closeFarm;$('#liteBtn').onclick=()=>{LITE=!LITE;LS('yv-lite',LITE?'1':'0');if(!CUR)return;if(LITE)showLite();else show3D();toast(LITE?'🔋 เปิดโหมดประหยัด (ไม่โหลด 3D)':'🎮 เปิดฉาก 3D');};$('#lite3d').onclick=()=>{LITE=false;LS('yv-lite','0');show3D();};
$('#vote').onclick=async e=>{if(!CUR||CUR.busy)return;CUR.busy=true;paintVote();const uid=CUR.uid;try{const r=await call('vote',{uid,token:CUR.token});CUR.votes=r.votes;$('#vVotes').textContent='💗 '+fmt(r.votes);if(ST){ST.left=r.left;ST.total=r.total;const row=ST.list.find(x=>x.uid===uid);if(row)row.v=r.votes;ST.list.sort((a,b)=>b.v-a.v||a.n.localeCompare(b.n,'th'));let rk=0,prev=null;ST.list.forEach((x,i)=>{if(x.v!==prev){rk=i+1;prev=x.v;}x.r=rk;});paintState();paintList();}
  fly(e.clientX||innerWidth/2,e.clientY||innerHeight-80);toast('💗 ให้ใจ '+CUR.name+' แล้ว! เหลือ '+r.left+' ใจในชั่วโมงนี้');if(navigator.vibrate)try{navigator.vibrate(25);}catch(_){}}
 catch(err){toast('⚠️ '+err.message,3200);if(/โทเคน|เปิดดูสวน/.test(err.message)){try{const d=await call('farm',{uid});Object.assign(CUR,d,{okAt:Date.now()+(d.viewMs||10000)+300});}catch(_){}}else refresh(true);}
 finally{if(CUR){CUR.busy=false;paintVote();}}};
function fly(x,y){for(let i=0;i<7;i++){const s=document.createElement('span');s.className='fly';s.textContent=['💗','💖','💕','✨'][i%4];s.style.left=(x-13)+'px';s.style.top=(y-13)+'px';s.style.setProperty('--dx',(Math.random()*160-80)+'px');s.style.animationDelay=(i*70)+'ms';document.body.appendChild(s);setTimeout(()=>s.remove(),1500);}}

await new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res();}};try{onAuthStateChanged(auth,()=>fin(),()=>fin());}catch(e){fin();}setTimeout(fin,2500);});authReady=true;
