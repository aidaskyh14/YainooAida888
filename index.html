      if(!c)return false;

    }
    function kill(){
      if(!isArenaModal())return false;
      const modal=document.getElementById("modal");
      const c=document.getElementById("modalContent");
      if(c)c.replaceChildren();
      if(modal){
        modal.classList.add("hidden");
        modal.setAttribute("aria-hidden","true");
        modal.style.setProperty("display","none","important");
        modal.style.setProperty("pointer-events","none","important");
      }
      return true;
    }
    function arm(){
      const modal=document.getElementById("modal");
      const c=document.getElementById("modalContent");
      if(!modal||!c)return requestAnimationFrame(arm);
      const obs=new MutationObserver(kill);
      obs.observe(c,{childList:true,subtree:true,characterData:true});
      obs.observe(modal,{attributes:true,attributeFilter:["class","style"]});
      window.addEventListener("pageshow",kill,{passive:true});
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)kill()},{passive:true});
      setInterval(kill,250);
      kill();
