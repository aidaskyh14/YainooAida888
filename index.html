<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#21112d">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="สวนยัยหนู">
  <link rel="manifest" href="manifest.webmanifest?v=8">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>ในสวนของยัยหนู x ปลูกผักแบบเปรตเปรต</title>
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <main id="app">
    <section id="loginScreen" class="screen login-screen">
      <div class="art-board" aria-label="หน้าเข้าสวนของยัยหนู">
        <img class="login-art" src="login-art.jpg?v=20" alt="ในสวนของยัยหนู">

        <select id="memberSelect" class="hotspot member-field" aria-label="ชื่อสมาชิก"></select>
        <input id="memberCode" class="hotspot code-field" type="password" placeholder="กรอกรหัสสมาชิก" aria-label="รหัสสมาชิก">
        <input id="playerName" class="hotspot player-field" type="text" maxlength="20" placeholder="พิมพ์ชื่อผู้เล่นในเกม" aria-label="ชื่อผู้เล่นในเกม">

        <button id="startBtn" class="tap-area start-area" aria-label="เริ่มเล่น"></button>
        <button id="howBtn" class="tap-area how-area" aria-label="วิธีเล่น"></button>
        <button id="menuBtn" class="tap-area menu-area" aria-label="สมุดเมนู"></button>
        <button id="settingsBtn" class="tap-area settings-area" aria-label="ตั้งค่า"></button>
        <button id="rewardBtn" class="tap-area reward-area" aria-label="ของรางวัล"></button>

        <p id="loginError" class="login-error" aria-live="polite"></p>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="topbar">
        <div>
          <strong id="displayPlayer">ผู้เล่น</strong>
          <small id="displayMember">สมาชิก</small>
        </div>
        <div class="actions">
          <button id="inventoryBtn">🎒 กระเป๋า</button>
          <button id="kitchenBtn">🍲 ครัว</button>
          <button id="logoutBtn">🚪 ออก</button>
        </div>
      </header>

      <section class="garden">
        <h1>สวนของ <span id="gardenOwner"></span></h1>
        <p>แตะแปลงว่างเพื่อปลูก • แตะแปลงที่โตแล้วเพื่อเก็บเกี่ยว</p>
        <div id="plots" class="plots"></div>
      </section>
    </section>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button id="closeModal" class="close">×</button>
        <div id="modalContent"></div>
      </div>
    </div>
  </main>
<script src="game.js?v=9"></script>
</body>
</html>
