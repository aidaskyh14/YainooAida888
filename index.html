  <script>
    window.firebaseReady = new Promise((resolve,reject)=>{
      window.__resolveFirebase = resolve;
      window.__rejectFirebase = reject;
    });
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      collection,
      addDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      runTransaction,
      writeBatch,
      serverTimestamp,
      onSnapshot,
      increment
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAwg72Kj2gMsv9cOCCwmLiEY6CioF_1b64",
      authDomain: "yainoo-ghost-farm.firebaseapp.com",
      projectId: "yainoo-ghost-farm",
      storageBucket: "yainoo-ghost-farm.firebasestorage.app",
      messagingSenderId: "223708504826",
      appId: "1:223708504826:web:8f0f71ebf84cb6c4545f43",
      measurementId: "G-P3KRYBYF0C"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const bridge = {
        auth,
        db,
        getCurrentUser(){ return auth.currentUser; },
        waitForAuth(){
          return new Promise(resolve=>{
            const unsubscribe=onAuthStateChanged(auth,user=>{
              unsubscribe();
              resolve(user||null);
            });
          });
        },
        async signIn(email,password){
          const credential=await signInWithEmailAndPassword(auth,email,password);
          return credential.user;
        },
        async signInOrCreate(email,password){
          try{
            const credential=await signInWithEmailAndPassword(auth,email,password);
            return credential.user;
          }catch(error){
            const code=String(error?.code||"");
            if(!["auth/user-not-found","auth/invalid-credential","auth/invalid-login-credentials"].includes(code))throw error;
            try{
              const credential=await createUserWithEmailAndPassword(auth,email,password);
              return credential.user;
            }catch(createError){
              if(String(createError?.code||"")==="auth/email-already-in-use") {
                const credential=await signInWithEmailAndPassword(auth,email,password);
                return credential.user;
              }
              throw createError;
            }
          }
        },
        async signOut(){ await signOut(auth); },
        async getSignedInMember(){
          const user=auth.currentUser;
          if(!user)return null;
          const snap=await getDoc(doc(db,"members",user.uid));
          return snap.exists()?{id:snap.id,...snap.data()}:null;
        },
        firestore:{doc,getDoc,setDoc,updateDoc,deleteDoc,collection,addDoc,getDocs,query,where,orderBy,limit,runTransaction,writeBatch,serverTimestamp,onSnapshot,increment}
      };

      window.firebaseBridge=bridge;
      window.__resolveFirebase(bridge);
    } catch (error) {
      console.error("Firebase initialization failed",error);
      window.__rejectFirebase(error);
    }
  </script>

  <script>
    (function(){
      const standalone = window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone === true;
      if(standalone) document.documentElement.classList.add("standalone-app");
    })();
  </script>
