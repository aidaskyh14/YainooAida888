  function tick(){
    // Hide retired R34.20 controls/layers so only the new owner remains.
    for(const id of ['r3420HotelBulkFeedBtn','r3420HamsterFeedBtn','r3420HamsterCdGround','r3420RoyalCdGround']){const el=$(id);if(el)el.style.setProperty('display','none','important')}
    const hb=$('r3421HotelFeedAll'),showHotel=!!hb&&typeof currentScene!=='undefined'&&currentScene==='dogHotel'&&!$('sceneScreen')?.classList.contains('hidden');if(hb){hb.classList.toggle('hidden',!showHotel);if(showHotel){const h=hungry(own(),hotelPen());$('r3421HotelStatus').textContent=`คอก ${hotelPen()} • 🐶 ${h.dogs.length} • 🐱 ${h.cats.length} • หิวรวม ${h.total}`}}
    const ham=$('r3421HamsterFeed'),f=farmNo(),showHam=!!ham&&f>=2&&f<=4&&!$('gameScreen')?.classList.contains('hidden');if(ham){ham.classList.toggle('hidden',!showHam);if(showHam){const s=own(),left=s?Math.max(0,hamLast(s,f)+4*3600000-now()):0;$('r3421HamsterStatus').textContent=left?`Farm ${f} • รอ ${cooldownText(left)}`:`Farm ${f} • ใช้ 10 ชิ้น • +30–300 กุศล`}}

  function picker(rows,prefix){

  }

  function hotelPen(){try{return Math.max(1,Math.min(4,N(currentDogHotelPen)||1))}catch(_){return 1}}

    try{
      await settlePendingCloudSave?.();
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey),pref=fs.doc(db,'publicProfiles',currentMemberKey);
      let next,count=0,rewardTotal=0,dogs=0,cats=0;
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref); if(!snap.exists())throw new Error('ไม่พบเซฟสมาชิก');
        const s=normalizeState(snap.data(),currentMember),h=hungry(s,pen,now());
        count=h.total; dogs=h.dogs.length; cats=h.cats.length;
        if(!count)throw new Error('ตอนนี้ไม่มีสัตว์ที่หิวแล้ว');
        if(picks.reduce((a,x)=>a+N(x.qty),0)!==count)throw new Error(`ต้องเลือกอาหารให้ครบ ${count} ถาด`);
        for(const x of picks)if(!consumePetFood(s,x,x.qty))throw new Error('อาหารที่เลือกมีจำนวนไม่พอแล้ว');
        const t=now(),wait=Number(typeof YN_PET_HUNGER_MS!=='undefined'?YN_PET_HUNGER_MS:0)||4*3600000;
        for(const p of [...h.dogs,...h.cats]){
          const r=rand(20,50); rewardTotal+=r; s.merit=(Number(s.merit)||0)+r;
          p.nextFeedAt=t+wait; p.lastPenaltyBucket=0;
        }
        try{incrementMissionOn?.(s,'feedOwnPets',count)}catch(_){}
        s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;
        s.clientLocalEditAt=Date.now(); next=clone(s);
        tx.set(ref,{...clone(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
        tx.set(pref,{memberKey:currentMemberKey,displayName:typeof currentProfileDisplayName==='function'?currentProfileDisplayName():currentMember,merit:Number(s.merit)||0,initialized:true,updatedAt:fs.serverTimestamp()},{merge:true});
      });
      applyLocal(next); closeModal?.(); try{renderDogHotelScene?.()}catch(_){}
      message?.('🍽️ ให้อาหารทั้งหมดแล้ว',`🐶 หมา ${dogs} ตัว • 🐱 แมว ${cats} ตัว<br>ใช้อาหารรวม ${count} ถาด<br><b>ได้รับกุศลรวม +${rewardTotal}</b>`);
    }catch(e){message?.('ให้อาหารทั้งหมดไม่ได้',e?.message||'กรุณาลองใหม่')}
    finally{hotelBusy=false}
  }

  // ==========================================================
  // 2) HAMSTER — feed 10, merit + rock CD, 4h cooldown
  // ==========================================================
  function farmNo(){try{return Math.max(1,Math.min(4,N(farmPlotPage)+1))}catch(_){return 1}}
  function hams(s,f){return (s?.farmGuardians?.[String(f)]?.hamsters||[]).filter(x=>x&&x.id)}
  function hamFoodRows(s){
    const out=[],add=(type,key,name,image,count)=>{count=N(count);if(count>0)out.push({type,key,name,image,count})};
    try{for(const r of (RECIPES||[]))add('dish',r.id,r.name,r.image,typeof dishCountInState==='function'?dishCountInState(r.id,s):s?.dishInventory?.[r.id])}catch(_){}
    try{for(const [k,r] of Object.entries(HOME_FOODS||{}))add('homeFood',k,r.name,r.image,s?.homeFoods?.[k])}catch(_){}
    try{for(const [k,r] of Object.entries(window.YN_V240?.products||{}))add('factory',k,r.name,r.image,s?.alpaca?.factory?.products?.[k])}catch(_){}
    return out;
  }
  function consumeHam(s,x,q){
    q=N(q); if(isAdminNow())return true;
    if(x.type==='dish')return !!removeDishesFromState?.(s,x.key,q);
    if(x.type==='homeFood'){if(N(s?.homeFoods?.[x.key])<q)return false;s.homeFoods[x.key]-=q;return true}
    if(x.type==='factory'){if(N(s?.alpaca?.factory?.products?.[x.key])<q)return false;s.alpaca.factory.products[x.key]-=q;return true}
    return false;
  }
  function ensureHam22(s){
    s.hamsterGroupFeedAt=s.hamsterGroupFeedAt&&typeof s.hamsterGroupFeedAt==='object'?s.hamsterGroupFeedAt:{};
    s.hamsterFeedDropsV3422=s.hamsterFeedDropsV3422&&typeof s.hamsterFeedDropsV3422==='object'?s.hamsterFeedDropsV3422:{};
    for(const f of [2,3,4])s.hamsterFeedDropsV3422[String(f)]=Array.isArray(s.hamsterFeedDropsV3422[String(f)])?s.hamsterFeedDropsV3422[String(f)]:[];
    return s;
  }
  function hamLast(s,f){ensureHam22(s);return Number(s.hamsterGroupFeedAt[String(f)]||0)}

  function openHam22(){
    const s=own(),f=farmNo(); if(!s||f<2||f>4)return;
    const hs=hams(s,f); if(!hs.length)return message?.('🐹 ให้อาหาร','Farm นี้ไม่มีแฮมสเตอร์ค่ะ');
    const left=Math.max(0,hamLast(s,f)+4*3600000-now());
    if(left)return message?.('🐹 ยังให้อาหารไม่ได้',`คูลดาวน์เหลือ ${cooldownText(left)}`);
    const rows=hamFoodRows(s),pre='r3422-ham';
    $('modalContent').innerHTML=`<section class="feature-panel r3421-panel"><h2>🐹 ให้อาหารรวม • Farm ${f}</h2><div class="r3421-summary"><b>แฮมสเตอร์ ${hs.length} ตัว</b><strong>ใช้อาหารรวม 10 ชิ้น</strong></div><p>อาหารในสวน / อาหารในบ้าน / ของแปรรูปอัลปาก้า<br>เลือกเมนูเดียว 10 ชิ้นหรือคละกันก็ได้</p><div class="r3421-foodlist">${picker(rows,pre)}</div><div class="r3421-total">เลือกแล้ว <b id="${pre}-total">0</b> / 10</div><button id="r3422HamConfirm" class="primary-spooky-action" type="button" disabled>ยืนยันให้อาหาร 10 ชิ้น</button></section>`;
    openModal?.(); wire(rows,pre,10,'r3422HamConfirm',p=>feedHam22(f,p));
  }

  let hamBusy=false;
  async function feedHam22(f,picks){
    if(hamBusy||!currentMemberKey)return; hamBusy=true;
    try{
      await settlePendingCloudSave?.();
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey),pref=fs.doc(db,'publicProfiles',currentMemberKey);
      let next,reward=0,cdCount=0;
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref); if(!snap.exists())throw new Error('ไม่พบเซฟสมาชิก');
        const s=ensureHam22(normalizeState(snap.data(),currentMember)),hs=hams(s,f),t=now();
        if(!hs.length)throw new Error('Farm นี้ไม่มีแฮมสเตอร์แล้ว');
        const last=hamLast(s,f); if(last&&t-last<4*3600000)throw new Error(`คูลดาวน์เหลือ ${cooldownText(last+4*3600000-t)}`);
        if(picks.reduce((a,x)=>a+N(x.qty),0)!==10)throw new Error('ต้องเลือกอาหารรวม 10 ชิ้น');
        for(const x of picks)if(!consumeHam(s,x,x.qty))throw new Error('อาหารที่เลือกมีจำนวนไม่พอแล้ว');
        reward=rand(30,300); s.merit=(Number(s.merit)||0)+reward; s.hamsterGroupFeedAt[String(f)]=t;
        const arr=s.hamsterFeedDropsV3422[String(f)];
        for(const h of hs){arr.push({id:`r3422-ham-${h.id}-${t}-${Math.random().toString(36).slice(2)}`,hamsterId:String(h.id),qty:1,createdAt:t});cdCount++}
        if(arr.length>60)arr.splice(0,arr.length-60);
        s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1; s.clientLocalEditAt=Date.now(); next=clone(s);
        tx.set(ref,{...clone(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
        tx.set(pref,{memberKey:currentMemberKey,displayName:typeof currentProfileDisplayName==='function'?currentProfileDisplayName():currentMember,merit:Number(s.merit)||0,initialized:true,updatedAt:fs.serverTimestamp()},{merge:true});
      });
      applyLocal(next); closeModal?.(); renderHamGround22(); tick22();
      message?.('🐹 ให้อาหารสำเร็จ',`ใช้อาหาร 10 ชิ้น<br><b>ได้รับ +${reward} กุศล</b><br>💿 แผ่นร็อกดรอปบนพื้น ×${cdCount}<br>คูลดาวน์รอบต่อไป 4 ชั่วโมง`);
    }catch(e){message?.('ให้อาหารแฮมสเตอร์ไม่ได้',e?.message||'กรุณาลองใหม่')}
    finally{hamBusy=false}
  }

  function renderHamGround22(){
    const screen=$('gameScreen'); if(!screen)return;
    let layer=$('r3422HamGround');
    if(!layer){layer=document.createElement('div');layer.id='r3422HamGround';layer.className='r3422-ham-ground';screen.appendChild(layer)}
    const s=own(),f=farmNo();
    if(!s||visitContext||f<2||f>4||screen.classList.contains('hidden')){layer.replaceChildren();layer.classList.add('hidden');return}
    layer.classList.remove('hidden'); ensureHam22(s);
    const arr=s.hamsterFeedDropsV3422[String(f)]||[],show=arr.slice(-24);
    layer.innerHTML=show.map((d,i)=>`<button type="button" class="r3422-ground-disc rock" data-r3422-ham="${esc(d.id)}" style="left:${20+(i%8)*8.1}%;top:${76+Math.floor(i/8)*4.8}%"><img src="therapy-disc-rock.png" alt="Rock CD"></button>`).join('');
    layer.querySelectorAll('[data-r3422-ham]').forEach(b=>b.onclick=()=>claimHam22(f,b.dataset.r3422Ham,false));
  }

  async function claimHam22(f,id=null,all=false){
    if(!currentMemberKey)return false;
    try{
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey); let next,qty=0;
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref); if(!snap.exists())throw new Error('ไม่พบเซฟ');
        const s=ensureHam22(normalizeState(snap.data(),currentMember)),arr=s.hamsterFeedDropsV3422[String(f)];
        const take=all?arr.splice(0,arr.length):(()=>{const i=arr.findIndex(x=>String(x.id)===String(id));return i>=0?arr.splice(i,1):[]})();
        if(!take.length)throw new Error('ไม่มี CD บนพื้นแล้ว');
        qty=take.reduce((n,x)=>n+N(x.qty||1),0); s.specials=s.specials||{};
        s.specials.therapyDiscRock=isAdminNow()?9999:N(s.specials.therapyDiscRock)+qty;
        next=clone(s); tx.set(ref,{...clone(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
      });
      applyLocal(next); renderHamGround22(); showWeatherToast?.(`💿 Rock CD ×${qty} เข้ากระเป๋าแล้ว`); return true;
    }catch(e){message?.('เก็บ CD ไม่ได้',e?.message||'กรุณาลองใหม่'); return false}
  }

  // ==========================================================
  // 3) ROYAL ALPACA — smaller ground layer under animals + collect
  // ==========================================================
  const RKEY='royalCdDropsV3421', CKEY='royalCdClockV3421', SEEDED='royalCdSeededV3421';
  function currentPen(){try{return typeof currentAlpacaPen==='function'?currentAlpacaPen():1}catch(_){return 1}}
  function ensureRoyal22(s){s.alpaca=s.alpaca&&typeof s.alpaca==='object'?s.alpaca:{};s.alpaca[RKEY]=s.alpaca[RKEY]&&typeof s.alpaca[RKEY]==='object'?s.alpaca[RKEY]:{};for(let p=1;p<=5;p++)s.alpaca[RKEY]['pen'+p]=Array.isArray(s.alpaca[RKEY]['pen'+p])?s.alpaca[RKEY]['pen'+p]:[];return s}

  function renderRoyal22(){
    const stage=$('alpacaPenStage'); if(!stage)return;
    let layer=$('r3422RoyalGround');
    if(!layer){layer=document.createElement('div');layer.id='r3422RoyalGround';layer.className='r3422-royal-ground';stage.appendChild(layer)}
    const old=$('r3421RoyalCdGround'); if(old)old.style.setProperty('display','none','important');
    const s=own(),p=currentPen();
    if(!s||$('alpacaPenScreen')?.classList.contains('hidden')){layer.replaceChildren();layer.classList.add('hidden');return}
    layer.classList.remove('hidden'); ensureRoyal22(s);
    const arr=s.alpaca[RKEY]['pen'+p]||[],show=arr.slice(-24);
    layer.innerHTML=show.map((d,i)=>`<button type="button" class="r3422-ground-disc pink" data-r3422-royal="${esc(d.id)}" style="left:${23+(i%8)*7.7}%;top:${55+Math.floor(i/8)*6.4}%"><img src="therapy-disc-pink.png" alt="Pink CD"><small>×${N(d.qty||2)}</small></button>`).join('');
    layer.querySelectorAll('[data-r3422-royal]').forEach(b=>b.onclick=()=>claimRoyal22(p,b.dataset.r3422Royal,false));
    syncAlpacaCollectButton22(arr.length);
  }

  async function claimRoyal22(p,id=null,all=false){
    if(!currentMemberKey)return false;
    try{
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey); let next,qty=0;
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref); if(!snap.exists())throw new Error('ไม่พบเซฟ');
        const s=ensureRoyal22(normalizeState(snap.data(),currentMember)),arr=s.alpaca[RKEY]['pen'+p];
        const take=all?arr.splice(0,arr.length):(()=>{const i=arr.findIndex(x=>String(x.id)===String(id));return i>=0?arr.splice(i,1):[]})();
        if(!take.length)throw new Error('ไม่มี CD บนพื้นแล้ว');
        qty=take.reduce((n,x)=>n+N(x.qty||2),0); s.specials=s.specials||{};
        s.specials.therapyDiscPink=isAdminNow()?9999:N(s.specials.therapyDiscPink)+qty;
        next=clone(s); tx.set(ref,{...clone(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
      });
      applyLocal(next); renderRoyal22(); showWeatherToast?.(`💿 Pink CD ×${qty} เข้ากระเป๋าแล้ว`); return true;
    }catch(e){message?.('เก็บ CD ไม่ได้',e?.message||'กรุณาลองใหม่'); return false}
  }

  function syncAlpacaCollectButton22(royalCount){
    const b=$('v240CollectTreasureAll'); if(!b)return;
    if(royalCount>0){
      b.classList.remove('hidden'); b.innerHTML='<span>🧺</span><b>เก็บของทั้งหมด</b>';
      b.onclick=async()=>{
        let gotRoyal=false;
        try{gotRoyal=await claimRoyal22(currentPen(),null,true)}catch(_){}
        try{if(typeof v240CollectTreasure==='function')await v240CollectTreasure(null,true)}catch(_){}
        return gotRoyal;
      };
    }
  }

  // Farm collect-drop basket: if hamster CDs exist, collect them first.
  const baseCollectBtn=$('collectDropsBtn')?.onclick;
  async function collectCurrentFarm22(){
    const s=own(),f=farmNo();
    if(s&&f>=2&&f<=4){ensureHam22(s);if((s.hamsterFeedDropsV3422[String(f)]||[]).length)return claimHam22(f,null,true)}
    if(typeof baseCollectBtn==='function')return baseCollectBtn.call($('collectDropsBtn'));
    try{return collectAllCatDropsCurrentFarm?.()}catch(_){}
  }
  if($('collectDropsBtn'))$('collectDropsBtn').onclick=collectCurrentFarm22;

  function tick22(){
    const badge=$('r3421BuildBadge'); 
    const idx=$('r3420BuildBadge'); 

    const hb=$('r3421HotelFeedAll');
    const showHotel=!!hb&&typeof currentScene!=='undefined'&&currentScene==='dogHotel'&&!$('sceneScreen')?.classList.contains('hidden');
    if(hb){
      hb.onclick=openHotel22; hb.classList.toggle('hidden',!showHotel);
      if(showHotel){const h=hungry(own(),hotelPen());const st=$('r3421HotelStatus');if(st)st.textContent=`🐶 ${h.dogs.length} • 🐱 ${h.cats.length} • หิว ${h.total}`}
    }

    const ham=$('r3421HamsterFeed'),f=farmNo(),showHam=!!ham&&f>=2&&f<=4&&!$('gameScreen')?.classList.contains('hidden');
    if(ham){
      ham.onclick=openHam22; ham.classList.toggle('hidden',!showHam);
      if(showHam){const s=own(),left=s?Math.max(0,hamLast(s,f)+4*3600000-now()):0,st=$('r3421HamsterStatus');if(st)st.textContent=left?`Farm ${f} • อีก ${cooldownText(left)}`:`Farm ${f} • ใช้ 10 ชิ้น • +30–300 กุศล`}
    }
    renderHamGround22(); renderRoyal22();
  }

  setInterval(tick22,800);
  setTimeout(tick22,250);
  window.addEventListener('pageshow',()=>setTimeout(tick22,120),{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(tick22,120)},{passive:true});
  document.addEventListener('click',e=>{if(e.target?.closest?.('#shortcutAlpacaPenBtn,#alpacaPenSwitchBtn,[data-alpaca-pen],#plotPageNextBtn,#plotPagePrevBtn,[data-s2-farm]'))setTimeout(tick22,80)},false);

  window.YN_R3422={BUILD,openHotel22,openHam22,renderHamGround22,renderRoyal22,claimHam22,claimRoyal22};
  window.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>


<script id="r3423-fix4-controller">
(()=>{
  'use strict';
  const BUILD='S2-R34.23-FIX4';
  const $=id=>document.getElementById(id);
  const n=v=>Math.max(0,Math.floor(Number(v)||0));
  const now=()=>typeof gameNow==='function'?gameNow():Date.now();
  const cp=v=>{try{return structuredClone(v)}catch(_){return JSON.parse(JSON.stringify(v))}};
  const esc=v=>{try{return typeof safeHtml==='function'?safeHtml(String(v??'')):String(v??'')}catch(_){return String(v??'')}};
  const admin=()=>{try{return String(currentMember||'')==='Aida'||String(currentMemberKey||'').toLowerCase()==='aida'||adminProfile?.role==='admin'||(typeof isAdmin==='function'&&isAdmin())}catch(_){return false}};
  const live=()=>{try{return visitContext?null:(ownState||state||null)}catch(_){return null}};
  const farm=()=>{try{return Math.max(1,Math.min(4,n(farmPlotPage)+1))}catch(_){return 1}};
  const pen=()=>{try{return typeof currentAlpacaPen==='function'?currentAlpacaPen():1}catch(_){return 1}};
  const fmt=ms=>{ms=Math.max(0,n(ms));const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);return h?`${h} ชม. ${m} นาที`:`${m} นาที ${String(s).padStart(2,'0')} วิ`};
  const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

  function apply(s){
    if(!s)return;
    try{s=typeof normalizeState==='function'?normalizeState(s,currentMember):s}catch(_){}
    ownState=s;if(!visitContext)state=s;
    try{saveLocalOnly?.(s)}catch(_){}
    try{save?.()}catch(_){}
    try{queueCloudSave?.()}catch(_){}
    try{updateMeritUI?.()}catch(_){}
  }

  async function publishProfile(s=live()){
    if(!s||!cloudReady||!currentMemberKey||visitContext)return;
    try{
      const {db,fs}=await getFirebaseContext();
      const pens=Array.isArray(s?.alpaca?.pens)?s.alpaca.pens.map(p=>Number(p?.happiness)||0):[];
      const total=pens.reduce((a,b)=>a+b,0);
      const claimed=Number(s?.alpaca?.factory?.claimedCount)||0;
      await fs.setDoc(fs.doc(db,'publicProfiles',currentMemberKey),{
        memberKey:currentMemberKey,
        displayName:typeof currentProfileDisplayName==='function'?currentProfileDisplayName():currentMember,
        merit:Number(s.merit)||0,
        alpacaHappiness:total,
        alpacaHappinessPens:pens,
        alpacaFactoryClaimed:claimed,
        initialized:true,
        updatedAt:fs.serverTimestamp()
      },{merge:true});
    }catch(e){console.warn('R34.23 profile publish',e)}
  }

  function picker(rows,prefix){
    return rows.length?rows.map((x,i)=>`<article class="r3423-food"><img src="${esc(x.image||'')}" alt=""><div><b>${esc(x.name||x.key)}</b><small>มี ×${n(x.count)}</small></div><div class="r3423-step"><button type="button" data-minus="${prefix}-${i}">−</button><input id="${prefix}-${i}" type="number" min="0" max="${n(x.count)}" value="0"><button type="button" data-plus="${prefix}-${i}">+</button></div></article>`).join(''):'<p class="empty-feature">ยังไม่มีอาหารที่ใช้ได้ในกระเป๋าค่ะ</p>';
  }

  function wire(rows,prefix,need,confirmId,submit){
    const inputs=rows.map((_,i)=>$(prefix+'-'+i)).filter(Boolean),total=$(prefix+'-total'),btn=$(confirmId);
    const sync=()=>{
      let sum=0;
      for(const x of inputs){let v=Math.min(n(x.max),n(x.value));x.value=v;sum+=v}
      if(total)total.textContent=sum;
      if(btn)btn.disabled=sum!==need;
    };
    rows.forEach((_,i)=>{
      const inp=$(prefix+'-'+i),m=document.querySelector(`[data-minus="${prefix}-${i}"]`),p=document.querySelector(`[data-plus="${prefix}-${i}"]`);
      if(m)m.onclick=()=>{inp.value=Math.max(0,n(inp.value)-1);sync()};
      if(p)p.onclick=()=>{inp.value=Math.min(n(inp.max),n(inp.value)+1);sync()};
      if(inp)inp.oninput=sync;
    });
    if(btn)btn.onclick=()=>submit(rows.map((x,i)=>({...x,qty:n($(prefix+'-'+i)?.value)})).filter(x=>x.qty));
    sync();
  }

  // ---------------- HOTEL ----------------
  function hotelPen(){try{return Math.max(1,Math.min(4,n(currentDogHotelPen)||1))}catch(_){return 1}}
  function petPen(s,p){return Math.max(1,Math.min(4,n(s?.hotelPetPenMap?.[String(p?.id||'')]||p?.hotelPen||1)||1))}
  function hungry(s,p=hotelPen(),t=now()){
    const dogs=[],cats=[];
    for(const x of (s?.dogs||[])){
      if(!x?.id||!x.placedHotel||petPen(s,x)!==p)continue;
      if(Number(x.expiresAt||0)>0&&Number(x.expiresAt)<=t)continue;
      if(Number(x.medicineUntil||0)>t)continue;
      if(Number(x.nextFeedAt||0)<=t)dogs.push(x);
    }
    for(const x of (s?.cats||[])){
      if(!x?.id||!(x.placedHotel||Number(x.placedFarm)===-1)||petPen(s,x)!==p)continue;
      if(Number(x.expiresAt||0)>0&&Number(x.expiresAt)<=t)continue;
      if(Number(x.medicineUntil||0)>t)continue;
      if(Number(x.nextFeedAt||0)<=t)cats.push(x);
    }
    return {dogs,cats,total:dogs.length+cats.length};
  }
  function hotelFoods(s){
    try{
      const rows=globalThis.YN_PET_FOOD_ENTRIES_R3423?.(s)||[];
      if(rows.length)return rows.filter(x=>n(x.count)>0);
    }catch(e){console.warn('R34.23 hotel foods',e)}
    const out=[];
    try{for(const r of (RECIPES||[])){const c=typeof dishCountInState==='function'?dishCountInState(r.id,s):0;if(c>0)out.push({type:'dish',key:r.id,name:r.name,image:r.image,count:c})}}catch(_){}
    return out;
  }
  function consumeHotel(s,x,q){
    if(admin())return true;
    try{if(globalThis.YN_CONSUME_PET_FOOD_R3423)return !!globalThis.YN_CONSUME_PET_FOOD_R3423(s,x.type,x.key,q)}catch(_){}
    if(x.type==='dish'&&typeof removeDishesFromState==='function')return !!removeDishesFromState(s,x.key,q);
    return false;
  }
  function openHotel(){
    const s=live();if(!s)return;
    const p=hotelPen(),h=hungry(s,p),rows=hotelFoods(s),pre='r3423-hotel';
    if(!h.total)return message?.('🍽️ ให้อาหารทั้งหมด','ตอนนี้คอกนี้ไม่มีหมาหรือแมวที่หิวค่ะ');
    $('modalContent').innerHTML=`<section class="feature-panel r3423-panel"><h2>🍽️ ให้อาหารทั้งหมด • คอก ${p}</h2><div class="r3423-summary"><b>🐶 หิว ${h.dogs.length} ตัว</b><b>🐱 หิว ${h.cats.length} ตัว</b><strong>รวม ${h.total} ตัว</strong></div><p>ต้องใช้อาหาร <b>${h.total} ถาด</b> • เลือกให้ครบตามจำนวนสัตว์ที่หิว</p><div class="r3423-foodlist">${picker(rows,pre)}</div><div class="r3423-total">เลือกแล้ว <b id="${pre}-total">0</b> / ${h.total} ถาด</div><button id="r3423HotelConfirm" class="primary-spooky-action" type="button" disabled>ยืนยันให้อาหารทั้งหมด</button></section>`;
    openModal?.();
    wire(rows,pre,h.total,'r3423HotelConfirm',picks=>feedHotel(p,picks));
  }
  function feedHotel(p,picks){
    try{
      const s=typeof normalizeState==='function'?normalizeState(cp(live()),currentMember):cp(live()),h=hungry(s,p,now());
      if(!h.total)throw new Error('ตอนนี้ไม่มีสัตว์ที่หิวแล้ว');
      if(picks.reduce((a,x)=>a+n(x.qty),0)!==h.total)throw new Error(`ต้องเลือกอาหารให้ครบ ${h.total} ถาด`);
      for(const x of picks)if(!consumeHotel(s,x,x.qty))throw new Error('อาหารที่เลือกมีจำนวนไม่พอแล้ว');
      const t=now(),wait=Number(typeof YN_PET_HUNGER_MS!=='undefined'?YN_PET_HUNGER_MS:0)||4*3600000;
      let reward=0;
      for(const x of [...h.dogs,...h.cats]){const r=rand(20,50);reward+=r;s.merit=(Number(s.merit)||0)+r;x.nextFeedAt=t+wait;x.lastPenaltyBucket=0}
      s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
      apply(s);closeModal?.();try{renderDogHotelScene?.()}catch(_){}
      publishProfile(s);
      message?.('🍽️ ให้อาหารทั้งหมดแล้ว',`🐶 หมา ${h.dogs.length} ตัว • 🐱 แมว ${h.cats.length} ตัว<br>ใช้อาหารรวม ${h.total} ถาด<br><b>ได้รับกุศลรวม +${reward}</b>`);
    }catch(e){message?.('ให้อาหารทั้งหมดไม่ได้',e?.message||'กรุณาลองใหม่')}
  }

  // ---------------- HAMSTER ----------------
  function hams(s,f){return (s?.farmGuardians?.[String(f)]?.hamsters||[]).filter(x=>x&&x.id)}
  function hamFoods(s){
    const out=[],add=(type,key,name,image,count)=>{count=n(count);if(count>0)out.push({type,key,name,image,count})};
    try{for(const r of (RECIPES||[]))add('dish',r.id,r.name,r.image,typeof dishCountInState==='function'?dishCountInState(r.id,s):0)}catch(_){}
    try{for(const [k,r] of Object.entries(globalThis.YN_R16?.HOME_FOODS||{}))add('homeFood',k,r.name,r.image,s?.homeFoods?.[k])}catch(_){}
    try{for(const [k,r] of Object.entries(globalThis.YN_V240?.products||{}))add('factory',k,r.name,r.image,s?.alpaca?.factory?.products?.[k])}catch(_){}
    return out;
  }
  function consumeHam(s,x,q){
    q=n(q);if(admin())return true;
    if(x.type==='dish')return !!removeDishesFromState?.(s,x.key,q);
    if(x.type==='homeFood'){if(n(s?.homeFoods?.[x.key])<q)return false;s.homeFoods[x.key]-=q;return true}
    if(x.type==='factory'){if(n(s?.alpaca?.factory?.products?.[x.key])<q)return false;s.alpaca.factory.products[x.key]-=q;return true}
    return false;
  }
  function ensureHam(s){
    s.hamsterGroupFeedAt=s.hamsterGroupFeedAt&&typeof s.hamsterGroupFeedAt==='object'?s.hamsterGroupFeedAt:{};
    s.hamsterFeedDropsV3423=s.hamsterFeedDropsV3423&&typeof s.hamsterFeedDropsV3423==='object'?s.hamsterFeedDropsV3423:{};
    for(const f of [2,3,4])s.hamsterFeedDropsV3423[String(f)]=Array.isArray(s.hamsterFeedDropsV3423[String(f)])?s.hamsterFeedDropsV3423[String(f)]:[];
    return s;
  }
  function lastHam(s,f){ensureHam(s);return Number(s.hamsterGroupFeedAt[String(f)]||0)}
  function openHam(){
    const s=ensureHam(live()),f=farm(),hs=hams(s,f);if(!s||f<2||f>4)return;
    if(!hs.length)return message?.('🐹 ให้อาหาร','Farm นี้ไม่มีแฮมสเตอร์ค่ะ');
    const left=Math.max(0,lastHam(s,f)+4*3600000-now());
    if(left)return message?.('🐹 ยังให้อาหารไม่ได้',`คูลดาวน์เหลือ ${fmt(left)}`);
    const rows=hamFoods(s),pre='r3423-ham';
    $('modalContent').innerHTML=`<section class="feature-panel r3423-panel"><h2>🐹 ให้อาหารรวม • Farm ${f}</h2><div class="r3423-summary"><b>แฮมสเตอร์ ${hs.length} ตัว</b><strong>ใช้อาหารรวม 10 ชิ้น</strong></div><p>เลือกอาหารในสวน / อาหารในบ้าน / ของแปรรูปอัลปาก้า รวมให้ครบ 10 ชิ้น</p><div class="r3423-foodlist">${picker(rows,pre)}</div><div class="r3423-total">เลือกแล้ว <b id="${pre}-total">0</b> / 10</div><button id="r3423HamConfirm" class="primary-spooky-action" type="button" disabled>ยืนยันให้อาหาร 10 ชิ้น</button></section>`;
    openModal?.();wire(rows,pre,10,'r3423HamConfirm',picks=>feedHam(f,picks));
  }
  function feedHam(f,picks){
    try{
      const s=ensureHam(typeof normalizeState==='function'?normalizeState(cp(live()),currentMember):cp(live())),hs=hams(s,f),t=now();
      if(!hs.length)throw new Error('Farm นี้ไม่มีแฮมสเตอร์แล้ว');
      const left=Math.max(0,lastHam(s,f)+4*3600000-t);if(left)throw new Error(`คูลดาวน์เหลือ ${fmt(left)}`);
      if(picks.reduce((a,x)=>a+n(x.qty),0)!==10)throw new Error('ต้องเลือกอาหารรวม 10 ชิ้น');
      for(const x of picks)if(!consumeHam(s,x,x.qty))throw new Error('อาหารที่เลือกมีจำนวนไม่พอแล้ว');
      const reward=rand(30,300);s.merit=(Number(s.merit)||0)+reward;s.hamsterGroupFeedAt[String(f)]=t;
      const arr=s.hamsterFeedDropsV3423[String(f)];
      for(const h of hs)arr.push({id:`r3423-${h.id}-${t}-${Math.random().toString(36).slice(2)}`,hamsterId:String(h.id),qty:1,createdAt:t});
      if(arr.length>60)arr.splice(0,arr.length-60);
      s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
      apply(s);closeModal?.();renderHam();publishProfile(s);
      message?.('🐹 ให้อาหารสำเร็จ',`ใช้อาหาร 10 ชิ้น<br><b>ได้รับ +${reward} กุศล</b><br>💿 Rock CD ดรอปบนพื้น ×${hs.length}<br>คูลดาวน์รอบต่อไป 4 ชั่วโมง`);
    }catch(e){message?.('ให้อาหารแฮมสเตอร์ไม่ได้',e?.message||'กรุณาลองใหม่')}
  }
  function renderHam(){
    const screen=$('gameScreen');if(!screen)return;
    let layer=$('r3423HamGround');if(!layer){layer=document.createElement('div');layer.id='r3423HamGround';layer.className='r3423-ham-ground';screen.appendChild(layer)}
    const s=live(),f=farm();
    if(!s||visitContext||f<2||f>4||screen.classList.contains('hidden')){layer.innerHTML='';layer.classList.add('hidden');return}
    layer.classList.remove('hidden');ensureHam(s);
    const arr=s.hamsterFeedDropsV3423[String(f)]||[];
    layer.innerHTML=arr.slice(-24).map((d,i)=>`<button type="button" class="r3423-disc rock" data-r3423-ham="${esc(d.id)}" style="left:${23+(i%8)*7.6}%;top:${77+Math.floor(i/8)*4.2}%"><img src="therapy-disc-rock.png" alt="Rock CD"></button>`).join('');
  }
  function claimHam(id=null,all=false){
    try{
      const s=ensureHam(typeof normalizeState==='function'?normalizeState(cp(live()),currentMember):cp(live())),f=farm(),arr=s.hamsterFeedDropsV3423[String(f)]||[];
      const take=all?arr.splice(0,arr.length):(()=>{const i=arr.findIndex(x=>String(x.id)===String(id));return i>=0?arr.splice(i,1):[]})();
      if(!take.length)return false;
      const qty=take.reduce((a,x)=>a+n(x.qty||1),0);s.specials=s.specials||{};s.specials.therapyDiscRock=admin()?9999:n(s.specials.therapyDiscRock)+qty;
      apply(s);renderHam();showWeatherToast?.(`💿 Rock CD ×${qty} เข้ากระเป๋าแล้ว`);return true;
    }catch(e){message?.('เก็บ CD ไม่ได้',e?.message||'กรุณาลองใหม่');return false}
  }

  // ---------------- ROYAL ALPACA ----------------
  function ensureRoyal(s){
    s.alpaca=s.alpaca&&typeof s.alpaca==='object'?s.alpaca:{};
    s.alpaca.royalCdDropsV3423=s.alpaca.royalCdDropsV3423&&typeof s.alpaca.royalCdDropsV3423==='object'?s.alpaca.royalCdDropsV3423:{};
    s.alpaca.royalCdClockV3423=s.alpaca.royalCdClockV3423&&typeof s.alpaca.royalCdClockV3423==='object'?s.alpaca.royalCdClockV3423:{};
    for(let p=1;p<=5;p++)s.alpaca.royalCdDropsV3423['pen'+p]=Array.isArray(s.alpaca.royalCdDropsV3423['pen'+p])?s.alpaca.royalCdDropsV3423['pen'+p]:[];
    return s;
  }
  function processRoyal(){
    const base=live();if(!base||visitContext)return;
    const s=ensureRoyal(typeof normalizeState==='function'?normalizeState(cp(base),currentMember):cp(base)),t=now();let changed=false;
    for(let pi=0;pi<(s.alpaca?.pens||[]).length;pi++){
      for(const a of (s.alpaca.pens[pi]?.alpacas||[])){
        if(!a?.id||a.type!=='adult'||!['prince','princess'].includes(String(a.color||'').toLowerCase()))continue;
        const id=String(a.id),key='pen'+(pi+1),arr=s.alpaca.royalCdDropsV3423[key];
        let last=Number(s.alpaca.royalCdClockV3423[id]||0);
        if(!last){last=t-3600000;s.alpaca.royalCdClockV3423[id]=last;changed=true}
        const due=Math.floor((t-last)/3600000);
        if(due>0){
          for(let r=1;r<=Math.min(due,8);r++)arr.push({id:`r3423-royal-${id}-${last+r*3600000}`,animalId:id,qty:2,createdAt:last+r*3600000});
          s.alpaca.royalCdClockV3423[id]=last+due*3600000;changed=true;
        }
      }
    }
    if(changed){apply(s);setTimeout(renderRoyal,50)}
  }
  function royalArrays(s,p){
    ensureRoyal(s);
    const rows=[];
    const add=(src,arr)=>{for(const d of (Array.isArray(arr)?arr:[]))rows.push({src,d})};
    add('v3423',s.alpaca.royalCdDropsV3423['pen'+p]);
    add('v3421',s.alpaca?.royalCdDropsV3421?.['pen'+p]);
    add('legacy',s.alpaca?.royalDiscDrops?.['pen'+p]);
    return rows;
  }
  function renderRoyal(){
    const stage=$('alpacaPenStage');if(!stage)return;
    for(const id of ['r3421RoyalCdGround','r3420RoyalCdGround','r34RoyalDiscLayer','r34120RoyalDiscLayer','r3411RoyalDropLayer']){const x=$(id);if(x)x.style.setProperty('display','none','important')}
    let layer=$('r3423RoyalGround');if(!layer){layer=document.createElement('div');layer.id='r3423RoyalGround';layer.className='r3423-royal-ground';stage.appendChild(layer)}
    const s=live(),p=pen();
    if(!s||$('alpacaPenScreen')?.classList.contains('hidden')){layer.innerHTML='';layer.classList.add('hidden');return}
    layer.classList.remove('hidden');const rows=royalArrays(s,p).slice(-24);
    layer.innerHTML=rows.map((x,i)=>`<button type="button" class="r3423-disc pink" data-r3423-royal="${esc(String(x.d.id))}" data-r3423-src="${x.src}" style="left:${24+(i%8)*7.3}%;top:${58+Math.floor(i/8)*6.1}%"><img src="therapy-disc-pink.png" alt="Pink CD"><small>×${n(x.d.qty||2)}</small></button>`).join('');
    const basket=$('v240CollectTreasureAll');
    if(basket&&rows.length){
      basket.classList.remove('hidden');
      basket.innerHTML='<span>🧺</span><b>เก็บของทั้งหมด</b>';
    }
  }
  function claimRoyal(id=null,src=null,all=false){
    try{
      const s=ensureRoyal(typeof normalizeState==='function'?normalizeState(cp(live()),currentMember):cp(live())),p=pen();let take=[];
      const takeFrom=(arr,source)=>{
        if(!Array.isArray(arr))return;
        if(all){take.push(...arr.splice(0,arr.length));return}
        if(source!==src)return;
        const i=arr.findIndex(x=>String(x.id)===String(id));if(i>=0)take.push(...arr.splice(i,1));
      };
      takeFrom(s.alpaca.royalCdDropsV3423['pen'+p],'v3423');
      if(s.alpaca?.royalCdDropsV3421)takeFrom(s.alpaca.royalCdDropsV3421['pen'+p],'v3421');
      if(s.alpaca?.royalDiscDrops)takeFrom(s.alpaca.royalDiscDrops['pen'+p],'legacy');
      if(!take.length)return false;
      const qty=take.reduce((a,x)=>a+n(x.qty||2),0);s.specials=s.specials||{};s.specials.therapyDiscPink=admin()?9999:n(s.specials.therapyDiscPink)+qty;
      apply(s);renderRoyal();showWeatherToast?.(`💿 Pink CD ×${qty} เข้ากระเป๋าแล้ว`);return true;
    }catch(e){message?.('เก็บ CD ไม่ได้',e?.message||'กรุณาลองใหม่');return false}
  }

  // ---------------- RANK ----------------
  async function showRanks(tab='happiness'){
    const factory=tab==='factory';
    $('modalContent').innerHTML=`<section class="feature-panel v240-rank-panel"><header><div><small>🦙 ระบบอัลปาก้า</small><h2>${factory?'Rank แปรรูป':'Rank ความสุข'}</h2></div><button id="r3423RankClose">×</button></header><p>กำลังโหลดคะแนนล่าสุด...</p></section>`;openModal?.();
    try{
      const {db,fs}=await getFirebaseContext(),profiles={},saves={};
      try{const ps=await fs.getDocs(fs.collection(db,'publicProfiles'));ps.forEach(d=>profiles[d.id]=d.data()||{})}catch(_){}
      try{const ss=await fs.getDocs(fs.collection(db,'saves'));ss.forEach(d=>saves[d.id]=d.data()||{})}catch(_){}
      const names=Object.keys(typeof MEMBERS!=='undefined'?MEMBERS:{}).filter(x=>x!=='Aida');
      const rows=names.map(name=>{
        const key=typeof memberKeyFromName==='function'?memberKeyFromName(name):String(name).toLowerCase(),sv=saves[key],pf=profiles[key]||{};
        const pens=Array.isArray(sv?.alpaca?.pens)?sv.alpaca.pens.map(p=>Number(p?.happiness)||0):(Array.isArray(pf.alpacaHappinessPens)?pf.alpacaHappinessPens:[]);
        const happiness=sv?pens.reduce((a,b)=>a+b,0):Number(pf.alpacaHappiness)||0;
        const claimed=sv?Number(sv?.alpaca?.factory?.claimedCount)||0:Number(pf.alpacaFactoryClaimed)||0;
        return {name,happiness,claimed};
      }).sort((a,b)=>(factory?b.claimed-a.claimed:b.happiness-a.happiness)||a.name.localeCompare(b.name,'th'));
      $('modalContent').innerHTML=`<section class="feature-panel v240-rank-panel"><header><div><small>🦙 ระบบอัลปาก้า</small><h2>${factory?'Rank แปรรูป':'Rank ความสุข'}</h2></div><button id="r3423RankClose">×</button></header><div class="v240-rank-tabs"><button data-r3423-rank="happiness" class="${!factory?'active':''}">ความสุข</button><button data-r3423-rank="factory" class="${factory?'active':''}">แปรรูป</button></div><div class="v240-rank-scroll">${rows.map((r,i)=>`<article class="v240-rank-row ${i<3?'top'+(i+1):''}"><strong>#${i+1}</strong><div><b>${esc(r.name)}</b><small>${factory?'คะแนนแปรรูป':'คะแนนความสุข'}</small></div><span>${factory?r.claimed:r.happiness}</span></article>`).join('')}</div></section>`;
      document.querySelectorAll('[data-r3423-rank]').forEach(b=>b.onclick=()=>showRanks(b.dataset.r3423Rank));
      $('r3423RankClose').onclick=closeModal;
    }catch(e){message?.('โหลด Rank ไม่ได้',e?.message||'กรุณาลองใหม่')}
  }

  // Exact-button capture prevents old handlers from stealing these actions.
  document.addEventListener('click',e=>{
    const hotel=e.target.closest?.('#r3421HotelFeedAll');
    if(hotel){e.preventDefault();e.stopImmediatePropagation();openHotel();return}
    const ham=e.target.closest?.('#r3421HamsterFeed');
    if(ham){e.preventDefault();e.stopImmediatePropagation();openHam();return}
    const rc=e.target.closest?.('[data-r3423-royal]');
    if(rc){e.preventDefault();e.stopImmediatePropagation();claimRoyal(rc.dataset.r3423Royal,rc.dataset.r3423Src,false);return}
    const hc=e.target.closest?.('[data-r3423-ham]');
    if(hc){e.preventDefault();e.stopImmediatePropagation();claimHam(hc.dataset.r3423Ham,false);return}
  },true);

  let lastProfileSig='';
  function tick(){
    const badge=$('r3421BuildBadge');
    const core=$('r3420BuildBadge');
    const hb=$('r3421HotelFeedAll');
    if(hb&&currentScene==='dogHotel'){
      hb.classList.remove('hidden');const h=hungry(live(),hotelPen());const st=$('r3421HotelStatus');if(st)st.textContent=`🐶 ${h.dogs.length} • 🐱 ${h.cats.length} • หิว ${h.total}`;
    }
    const hbtn=$('r3421HamsterFeed'),f=farm();
    if(hbtn){
      const show=f>=2&&f<=4&&!$('gameScreen')?.classList.contains('hidden');hbtn.classList.toggle('hidden',!show);
      if(show){const s=ensureHam(live()),left=Math.max(0,lastHam(s,f)+4*3600000-now()),st=$('r3421HamsterStatus');if(st)st.textContent=left?`Farm ${f} • อีก ${fmt(left)}`:`Farm ${f} • 10 ชิ้น • +30–300 กุศล`}
    }
    renderHam();renderRoyal();
    const s=live();
    if(s&&!visitContext){
      const pens=Array.isArray(s?.alpaca?.pens)?s.alpaca.pens.map(p=>Number(p?.happiness)||0):[],sig=JSON.stringify([pens,Number(s?.alpaca?.factory?.claimedCount)||0]);
      if(sig!==lastProfileSig){lastProfileSig=sig;publishProfile(s)}
    }
    const rankBtn=$('alpacaRankBtn');if(rankBtn)rankBtn.onclick=()=>showRanks('happiness');
    if(globalThis.YN_V240)globalThis.YN_V240.showRanks=showRanks;
    const basket=$('v240CollectTreasureAll');
    if(basket&&royalArrays(ensureRoyal(live()),pen()).length){
      if(!basket.__r3423){
        basket.__r3423=true;basket.__r3423Old=basket.onclick;
        basket.onclick=async ev=>{ev?.preventDefault?.();claimRoyal(null,null,true);try{return await basket.__r3423Old?.call(basket,ev)}catch(_){}};
      }
    }
  }

  setInterval(tick,900);
  setInterval(processRoyal,30000);
  setTimeout(()=>{processRoyal();tick()},250);
  window.addEventListener('pageshow',()=>setTimeout(tick,120),{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>{processRoyal();tick()},120)},{passive:true});
  window.YN_R3423={BUILD,openHotel,openHam,feedHotel,feedHam,claimHam,claimRoyal,showRanks,processRoyal};
  window.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>


<script id="r3424-collect-ui-controller">
(()=>{
  'use strict';
  const BUILD='S2-R34.24-COLLECT-UI';
  const $=id=>document.getElementById(id);
  const n=v=>Math.max(0,Math.floor(Number(v)||0));
  const cp=v=>{try{return structuredClone(v)}catch(_){return JSON.parse(JSON.stringify(v))}};
  const now=()=>typeof gameNow==='function'?gameNow():Date.now();
  const live=()=>{try{return visitContext?null:(ownState||state||null)}catch(_){return null}};
  const farm=()=>{try{return Math.max(1,Math.min(4,n(farmPlotPage)+1))}catch(_){return 1}};

      if(i>=0)take.push(...arr.splice(i,1));

  }

  function collectRoyal(id=null,src=null,all=false){

    }catch(e){message?.('เก็บ CD ไม่ได้',e?.message||'กรุณาลองใหม่');return false}
  }

  function collectHam(id=null,src=null,all=false){

    [20,61],[31,66],[43,62],[56,67],[69,61],[80,66],
    [24,72],[37,76],[51,72],[64,76],[77,72],[47,81]
  ];
  const HAM_POS=[
    [21,76],[31,74],[42,77],[53,74],[64,77],[75,74],
    [26,81],[38,80],[50,82],[62,80],[73,82],[83,79]
  ];

  function renderRoyal(){
    for(const id of ['r3423RoyalGround','r3422RoyalGround','r3421RoyalCdGround','r3420RoyalCdGround','r34RoyalDiscLayer','r34120RoyalDiscLayer','r3411RoyalDropLayer']){
      const x=$(id);if(x)x.style.setProperty('display','none','important');
    }
    const stage=$('alpacaPenStage');if(!stage)return;
    let layer=$('r3424RoyalGround');
    if(!layer){layer=document.createElement('div');layer.id='r3424RoyalGround';layer.className='r3424-ground r3424-royal-ground';stage.appendChild(layer)}
    const s=live(),p=pen();
    if(!s||$('alpacaPenScreen')?.classList.contains('hidden')){layer.innerHTML='';layer.classList.add('hidden');return}
    const rows=sourceRows(royalSources(s,p));
    layer.classList.toggle('hidden',!rows.length);
    layer.innerHTML=rows.slice(-12).map((x,i)=>{
      const pos=ROYAL_POS[i%ROYAL_POS.length];
      return `<button type="button" class="r3424-disc pink" data-r3424-kind="royal" data-r3424-src="${x.src}" data-r3424-id="${String(x.d.id)}" style="left:${pos[0]}%;top:${pos[1]}%" aria-label="เก็บ Pink CD"><img src="therapy-disc-pink.png" alt=""></button>`;
    }).join('');

    }

      return `<button type="button" class="r3424-disc rock" data-r3424-kind="ham" data-r3424-src="${x.src}" data-r3424-id="${String(x.d.id)}" style="left:${pos[0]}%;top:${pos[1]}%" aria-label="เก็บ Rock CD"><img src="therapy-disc-rock.png" alt=""></button>`;

  // ----------- small stable icon-only feed buttons -----------
  function ensureIcons(){
    // Kill old flashing / bar-size controls.
    for(const id of ['r3421HotelFeedAll','r3421HamsterFeed'])$(id)?.remove();

    if(!$('r3424HotelIcon')){
      const b=document.createElement('button');

      document.body.appendChild(b);
    }
    if(!$('r3424HamIcon')){
      const b=document.createElement('button');
      b.id='r3424HamIcon';b.type='button';b.className='r3424-feed-icon ham';b.innerHTML='<span>🐹</span><i id="r3424HamCd">พร้อม</i>';b.setAttribute('aria-label','ให้อาหารแฮมสเตอร์');
      document.body.appendChild(b);
    }
  }

  function hotelHungryCount(){
    const s=live();if(!s)return 0;
    const p=Math.max(1,Math.min(4,n(typeof currentDogHotelPen!=='undefined'?currentDogHotelPen:1)||1)),t=now();
    const petPen=x=>Math.max(1,Math.min(4,n(s?.hotelPetPenMap?.[String(x?.id||'')]||x?.hotelPen||1)||1));
    let c=0;
    for(const x of [...(s.dogs||[]),...(s.cats||[])]){
      if(!x?.id||petPen(x)!==p)continue;
      const placed=x.placedHotel||Number(x.placedFarm)===-1;if(!placed)continue;
      if(Number(x.expiresAt||0)>0&&Number(x.expiresAt)<=t)continue;

  function hamCooldown(){

  // ----------- earliest capture point: window runs before document blockers -----------
  window.addEventListener('click',e=>{
    const target=e.target?.closest?.('[data-r3424-kind],#r3424HotelIcon,#r3424HamIcon,#v240CollectTreasureAll,#collectDropsBtn,[data-s2-tool="drops"]');

      e.preventDefault();e.stopImmediatePropagation();openHam();return;

    }

    /* R34.26 owns all bulk-basket collection so animation + summary stay in sync. */
    if(target.id==='v240CollectTreasureAll'||target.id==='collectDropsBtn'||target.matches('[data-s2-tool="drops"]'))return;
  },true);

  // Hide all visible build/version badges permanently.
  function removeBadges(){
    for(const id of ['r3420BuildBadge','r3421BuildBadge'])$(id)?.remove();
    document.querySelectorAll('.r3420-build-badge,.r3421-build').forEach(x=>x.remove());
  }

  let lastScene='',lastFarm=-1,lastPen=-1;
  function tick(){
    ensureIcons();removeBadges();
    const scene=String(typeof currentScene!=='undefined'?currentScene:'');
    const f=farm(),p=pen();
    const hb=$('r3424HotelIcon'),mb=$('r3424HamIcon');

    const showHotel=scene==='dogHotel'&&!$('sceneScreen')?.classList.contains('hidden');
    const showHam=f>=2&&f<=4&&!$('gameScreen')?.classList.contains('hidden');
    if(hb){
      const display=showHotel?'grid':'none';if(hb.style.display!==display)hb.style.display=display;
      const c=$('r3424HotelCount');if(c)c.textContent=String(hotelHungryCount());
    }
    if(mb){
      const display=showHam?'grid':'none';if(mb.style.display!==display)mb.style.display=display;
      const cd=$('r3424HamCd'),left=hamCooldown();if(cd)cd.textContent=left?fmt(left):'พร้อม';
    }

    renderHam();renderRoyal();
    lastScene=scene;lastFarm=f;lastPen=p;
  }

  setInterval(tick,1200);
  setTimeout(tick,180);
  window.addEventListener('pageshow',()=>setTimeout(tick,100),{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(tick,100)},{passive:true});

  globalThis.YN_R3424={BUILD,collectRoyal,collectHam,renderRoyal,renderHam};
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>

    ];

  function royalSources(s,p){ensure(s);return [

  function summaryHtml(items){
    return items.map(x=>`<div class="r3426-summary-row">${x.icon||''}<b>${x.name}</b><span>×${x.qty}</span></div>`).join('');

  let busy=false,lastKey='',lastAt=0;
  function dedupe(key){
    const t=Date.now();if(key===lastKey&&t-lastAt<700)return false;lastKey=key;lastAt=t;return true;
  }

  async function collectFarmAll(){
    if(busy||visitContext||!cloudReady||!currentMemberKey)return;
    const f=farm(),base=live();if(!base)return;
    const initial=ensure(cp(base));
    const hamInitial=(f>=2&&f<=4)?rows(hamSources(initial,f)):[];

        let rockQty=0;

        const catSummary={};
        for(const cat of (s.cats||[])){
          if(Number(cat?.placedFarm)!==f)continue;
          for(const drop of (cat.drops||[])){
            const item=(typeof CAT_DROP_POOL!=='undefined'?CAT_DROP_POOL:[]).find(x=>x.id===drop.itemId);
            if(!item)continue;
            try{applyPetDropReward?.(s,item)}catch(_){}
            if(!catSummary[item.id])catSummary[item.id]={name:item.name||item.id,qty:0};
            catSummary[item.id].qty+=n(item.qty||1);
          }
          cat.drops=[];
        }
        for(const x of Object.values(catSummary))summary.push({icon:'🎁',name:x.name,qty:x.qty});

        if(!summary.length){
          /* Do not show a false error after a successful earlier event; just finish quietly. */
          next=s;return;
        }
        s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
        next=cp(s);
        tx.set(ref,{...cp(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
      });

      if(next){
        ownState=normalizeState(next,currentMember);if(!visitContext)state=ownState;saveLocalOnly?.(ownState);
        try{globalThis.YN_R3424?.renderHam?.()}catch(_){}
        try{renderCatPendingDrop?.()}catch(_){}
      }
      await sleep(220);
      showSummary('🧺 เก็บของดรอปทั้งหมดแล้ว',summary);
    }catch(e){
      hideWorking();message?.('เก็บของดรอปไม่ได้',e?.message||'กรุณาลองใหม่');
    }finally{busy=false}
  }

  async function collectAlpacaAll(){
    if(busy||visitContext||!cloudReady||!currentMemberKey)return;
    const p=pen(),base=live();if(!base)return;
    const initial=ensure(cp(base)),cdInitial=rows(royalSources(initial,p)),boxInitial=(initial.alpaca.treasureDrops['pen'+p]||[]);
    if(!cdInitial.length&&!boxInitial.length)return message?.('ยังเก็บไม่ได้','ตอนนี้ยังไม่มีของดรอปในคอกนี้ค่ะ');

    busy=true;showWorking($('alpacaPenScreen')||$('sceneScreen'));
    try{
      await sleep(950);
      await settlePendingCloudSave?.();
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey);
      let next=null,summary=[];
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref);if(!snap.exists())throw new Error('ไม่พบเซฟสมาชิก');
        const s=ensure(normalizeState(snap.data(),currentMember));
        try{assertCurrentCloudSession?.(snap.data(),currentMember)}catch(_){}

        const gotCd=takeAll(royalSources(s,p));
        const pinkQty=gotCd.reduce((a,d)=>a+n(d?.qty||2),0);
        if(pinkQty){
          s.specials.therapyDiscPink=admin()?9999:n(s.specials.therapyDiscPink)+pinkQty;
          summary.push({icon:'💿',name:'Pink CD',qty:pinkQty});
        }

        const boxes=s.alpaca.treasureDrops['pen'+p].splice(0);
        if(boxes.length){
          s.alpaca.inventory.other.treasureBox=n(s.alpaca.inventory.other.treasureBox)+boxes.length;
          summary.push({icon:'🧰',name:'กล่องสมบัติอัลปาก้า',qty:boxes.length});
        }

        if(!summary.length){next=s;return}
        s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
        next=cp(s);
        tx.set(ref,{...cp(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
      });

      if(next){
        ownState=normalizeState(next,currentMember);if(!visitContext)state=ownState;saveLocalOnly?.(ownState);
        try{globalThis.YN_R3424?.renderRoyal?.()}catch(_){}
        try{globalThis.YN_V240_RENDER_TREASURE_R3426?.()}catch(_){}
      }
      await sleep(220);
      showSummary('🧺 เก็บของในคอกแล้ว',summary);
    }catch(e){
      hideWorking();message?.('ยังเก็บไม่ได้',e?.message||'กรุณาลองใหม่');
    }finally{busy=false}
  }

  function route(e){
    const target=e.target?.closest?.('#v240CollectTreasureAll,#collectDropsBtn,[data-s2-tool="drops"]');
    if(!target)return;
    if(target.id==='v240CollectTreasureAll'){

      return;
    }

      e.preventDefault();e.stopImmediatePropagation();
      if(dedupe('farm-all:'+farm()))collectFarmAll();
    }
  }

  /* Own all bulk collection events; single-CD taps remain owned by R34.25. */
  window.addEventListener('pointerup',route,true);
  window.addEventListener('touchend',route,{capture:true,passive:false});
  window.addEventListener('click',route,true);

  globalThis.YN_R3426={BUILD,collectFarmAll,collectAlpacaAll};
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>
<script id="r3431-time-limits-temple-fast">
(()=>{
  'use strict';
  const BUILD='S2-R34.31-TIME-LIMITS-TEMPLE-FAST';
  const cp=v=>{try{return structuredClone(v)}catch(_){return JSON.parse(JSON.stringify(v))}};
  const N=v=>Math.max(0,Math.floor(Number(v)||0));
  const NOW=()=>typeof gameNow==='function'?gameNow():Date.now();

  /* ============================================================
     GLOBAL TIME WINDOWS — Bangkok time only
     Home food   CLOSED 09:00–13:00, opens 13:00
     Fishing     CLOSED 09:00–12:00, opens 12:00
     Honey       CLOSED 16:00–21:00, opens 21:00
     ============================================================ */
  function bangkokMinute(){
    try{if(typeof v15BangkokMinute==='function')return Number(v15BangkokMinute())||0}catch(_){}
    const d=new Date(Date.now()+7*60*60*1000);
    return d.getUTCHours()*60+d.getUTCMinutes();
  }
  const inWindow=(start,end)=>{const m=bangkokMinute();return m>=start&&m<end};
  const homeFoodClosed=()=>inWindow(9*60,13*60);
  const fishingClosed=()=>inWindow(9*60,12*60);
  const honeyClosed=()=>inWindow(16*60,21*60);

  function closedMessage(kind,openAt){
    const titles={
      home:'🍳 ครัวอาหารบ้านปิดอยู่',
      fishing:'🎣 บ่อตกปลายัยหนูปิดอยู่',
      honey:'🛵 ระบบน้องน้ำผึ้งปิดอยู่'
    };
    try{message?.(titles[kind]||'ปิดอยู่',`ปิดอยู่ รบกวนกลับมาอีกครั้ง เวลา ${openAt} น.`)}catch(_){}
  }
  const blockHome=()=>{closedMessage('home','13.00');return false};
  const blockFishing=()=>{closedMessage('fishing','12.00');return false};
  const blockHoney=()=>{closedMessage('honey','21.00');return false};

  /* R35: Thai temple retired. Keep only the active fishing time gate here. */
  try{
    const openSceneBase3431=openScene;
    openScene=function(name){
      if(fishingClosed()&&['fishingLobby','fishingPondV2','underwater'].includes(String(name)))return blockFishing();
      return openSceneBase3431.apply(this,arguments);
    };
  }catch(_){}

  /* ============================================================
     HOME FOOD 09:00–13:00
     ============================================================ */
  try{
    const api=globalThis.YN_R16;
    if(api){
      for(const k of ['openKitchen','openHomeRecipe','craftHomeFood']){
        const base=api[k];
        if(typeof base==='function')api[k]=function(){if(homeFoodClosed())return blockHome();return base.apply(this,arguments)};
      }
    }
  }catch(_){}

  /* ============================================================
     HONEY 16:00–21:00
     Wrap the proven APIs instead of changing delivery mechanics.
     ============================================================ */
  function wrapHoneyApi(obj,keys){
    if(!obj)return;
    for(const k of keys){
      const base=obj[k];
      if(typeof base==='function'&&!base.__r3431){
        const f=function(){if(honeyClosed())return blockHoney();return base.apply(this,arguments)};
        f.__r3431=true;obj[k]=f;
      }
    }
  }
  try{wrapHoneyApi(globalThis.YN_HONEY_DELIVERY,['openFuel','call','openSend','refill'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R34133,['openHoney'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R34132,['openHoney'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R34131,['openHoneyMenu'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_HONEY_1220,['open'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_HONEY_REFUEL_1211,['open'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_HONEY_REFUEL_1212,['open'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R341208,['openHoney128'])}catch(_){}

  /* ============================================================
     EARLY INPUT GATES
     Capture at window so old onclick handlers never execute while closed.
     ============================================================ */
  function routeClosedInput(e){
    const t=e.target?.closest?.(
      '#r17Kitchen,#r16StoveHotspot,#r28HomeFood,[data-r16-food],#r16CraftHomeFood,'+
      '#wellHotspot,#shortcutFishingBtn,[data-ynu-pond],'+
      '[data-s2-main="honey"],#honeyFuelHud,#honeyFuelCallHoney,#yn128HoneyConfirm,#r34133HoneyConfirm'
    );
    if(!t)return;
    let blocked=false;
    if(homeFoodClosed()&&t.matches('#r17Kitchen,#r16StoveHotspot,#r28HomeFood,[data-r16-food],#r16CraftHomeFood')){
      blocked=true;blockHome();
    }else if(fishingClosed()&&t.matches('#wellHotspot,#shortcutFishingBtn,[data-ynu-pond]')){
      blocked=true;blockFishing();
    }else if(honeyClosed()&&t.matches('[data-s2-main="honey"],#honeyFuelHud,#honeyFuelCallHoney,#yn128HoneyConfirm,#r34133HoneyConfirm')){
      blocked=true;blockHoney();
    }
    if(blocked){
      try{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}catch(_){}
    }
  }
  window.addEventListener('pointerdown',routeClosedInput,true);
  window.addEventListener('touchend',routeClosedInput,{capture:true,passive:false});
  window.addEventListener('click',routeClosedInput,true);

  globalThis.YN_R3431={
    BUILD,homeFoodClosed,fishingClosed,honeyClosed
  };
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>

const R365_WIG_WOOL=["white","black","pink","brown","green"];
const R365_WIG_WOOL_TH={white:"ขาว",black:"ดำ",pink:"ชมพู",brown:"น้ำตาล",green:"เขียว"};
function r365EnsureWigState(s){
  if(!s||typeof s!=="object")return s;
  s.alpaca=s.alpaca&&typeof s.alpaca==="object"?s.alpaca:{};
  s.alpaca.inventory=s.alpaca.inventory&&typeof s.alpaca.inventory==="object"?s.alpaca.inventory:{};
  s.alpaca.inventory.wool=s.alpaca.inventory.wool&&typeof s.alpaca.inventory.wool==="object"?s.alpaca.inventory.wool:{};
  s.alpaca.inventory.other=s.alpaca.inventory.other&&typeof s.alpaca.inventory.other==="object"?s.alpaca.inventory.other:{};
  R365_WIG_WOOL.forEach(k=>s.alpaca.inventory.wool[k]=iv(s.alpaca.inventory.wool[k]));
  s.alpaca.inventory.other[R365_WIG_KEY]=iv(s.alpaca.inventory.other[R365_WIG_KEY]);
  return s;
}
function r365WigHave(s,k){
  r365EnsureWigState(s);
  return admin()?9999:iv(s?.alpaca?.inventory?.wool?.[k]);
}
function r365WigStockHTML(s,qty=1){
  qty=Math.max(1,Math.min(10,iv(qty)||1));
  const need=qty*2;
  return R365_WIG_WOOL.map(k=>{
    const have=r365WigHave(s,k),ok=have>=need;
    return `<article class="r365-wool-chip ${ok?"ok":"missing"}"><span class="r365-wool-dot ${k}"></span><div><b>สี${R365_WIG_WOOL_TH[k]}</b><small>มี ×${have.toLocaleString("th-TH")} • ใช้ ×${need}</small></div></article>`;
  }).join("");
}
async function r365ScoreWig(success,receipt){
  if(!success||admin()||visitContext||!cloudReady||!currentMemberKey)return false;
  try{
    const api=globalThis.YN_S2_CAMPAIGNS;
    if(api?.scoreDetailed)return await api.scoreDetailed("wool",success*10,String(receipt||""),{fancyWig:success});
  }catch(e){console.warn("R36.8 inline wig score bridge",e)}
  return false;
}

async function r365CraftWig(){
  const qty=Math.max(1,Math.min(10,iv($("r365WigQty")?.value)||1));

  const craftId=`wig-${currentMemberKey||"member"}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  let success=0,failed=0,merit=0,next=null;

    if(!cloudReady||!currentMemberKey)throw new Error("ระบบบันทึกยังไม่พร้อมค่ะ");

    const {db,fs}=await getFirebaseContext(),saveRef=fs.doc(db,"saves",currentMemberKey),profileRef=fs.doc(db,"publicProfiles",currentMemberKey);
    await fs.runTransaction(db,async tr=>{
      const snap=await tr.get(saveRef);if(!snap.exists())throw new Error("ไม่พบเซฟสมาชิก");
      const s=r365EnsureWigState(normalizeState(snap.data(),currentMember));
      try{assertCurrentCloudSession?.(snap.data(),currentMember)}catch(_){}
      const need=qty*2;
      if(!admin())for(const k of R365_WIG_WOOL)if(iv(s.alpaca.inventory.wool[k])<need)throw new Error(`ขนอัลปาก้าสี${R365_WIG_WOOL_TH[k]}ไม่พอ • ต้องใช้ ${need} ชิ้น`);
      if(!admin())R365_WIG_WOOL.forEach(k=>s.alpaca.inventory.wool[k]=iv(s.alpaca.inventory.wool[k])-need);
      for(let i=0;i<qty;i++){if(Math.random()<0.30)success++;else{failed++;merit+=1+Math.floor(Math.random()*50)}}
      if(success)s.alpaca.inventory.other[R365_WIG_KEY]=iv(s.alpaca.inventory.other[R365_WIG_KEY])+success;
      if(failed)s.merit=(Number(s.merit)||0)+merit;
      if(admin()){R365_WIG_WOOL.forEach(k=>s.alpaca.inventory.wool[k]=9999);s.alpaca.inventory.other[R365_WIG_KEY]=9999}
      s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;
      next=clone(s);
      tr.set(saveRef,{...clone(s),activeSessionId:cloudSessionId,updatedAt:fs.serverTimestamp()},{merge:false});
      if(failed)tr.set(profileRef,{memberKey:currentMemberKey,displayName:typeof currentProfileDisplayName==="function"?currentProfileDisplayName():currentMember,merit:Number(s.merit)||0,initialized:true,updatedAt:fs.serverTimestamp()},{merge:true});
    });

/* R35.28 — 4 existing baits:
   Keep each bait's ORIGINAL fish-count distribution and ORIGINAL result/claim flow.
   Only expand the fish-species roll using the previously coded R35 rule:
   per fish = 50% new bad / 25% new good / 25% original rolled fish.
   New good fish are equal; new bad fish use 45/30/17/8. */
const R3528_OLD_BAITS=new Set(["bait1","bait2","bait3","bait4"]);
const R3528_GOOD=["r35Good1","r35Good2","r35Good3","r35Good4"];
const R3528_BAD=[["r35Bad1",45],["r35Bad2",30],["r35Bad3",17],["r35Bad4",8]];
function r3528FishFromKey(k){

function r3528Bad(){

}
const r3528RollBase=rollFishingCatches;

    catches,

async function startSpecial(slotNo,baitKey,selected){
