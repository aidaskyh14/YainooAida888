      overlay.innerHTML='<div class="drop-basket-working-card"><img src="drop-collection-basket.png?v=1" alt="ตะกร้า"><b>กำลังเก็บของดรอปทั้งหมด...</b></div>';
      host.appendChild(overlay);
    }
    overlay.classList.remove('hidden');
  }
  function hideWorking(){document.querySelectorAll('.r3426-collect-overlay').forEach(x=>x.classList.add('hidden'))}

  function summaryHtml(items){
    return items.map(x=>`<div class="r3426-summary-row">${x.icon||''}<b>${x.name}</b><span>×${x.qty}</span></div>`).join('');
  }
  function showSummary(title,items){
    hideWorking();
    if(!items.length)return message?.(title,'เก็บของดรอปเรียบร้อยแล้วค่ะ');
    $('modalContent').innerHTML=`<section class="feature-panel r3426-result"><h2>${title}</h2><p>ของดรอปรอบนี้เข้ากระเป๋าแล้ว</p><div class="r3426-summary">${summaryHtml(items)}</div><button id="r3426Done" class="primary-spooky-action" type="button">รับทราบ</button></section>`;
    openModal?.();$('r3426Done').onclick=closeModal;
  }

  let busy=false,lastKey='',lastAt=0;
  function dedupe(key){
    const t=Date.now();if(key===lastKey&&t-lastAt<700)return false;lastKey=key;lastAt=t;return true;
  }

  async function collectFarmAll(){
    if(busy||visitContext||!cloudReady||!currentMemberKey)return;
    const f=farm(),base=live();if(!base)return;
    const initial=ensure(cp(base));
    const hamInitial=(f>=2&&f<=4)?rows(hamSources(initial,f)):[];
    const catInitial=(initial.cats||[]).filter(c=>Number(c?.placedFarm)===f).reduce((a,c)=>a+(Array.isArray(c?.drops)?c.drops.length:0),0);
    if(!hamInitial.length&&!catInitial)return message?.('เก็บของดรอปไม่ได้','ตอนนี้ยังไม่มีของดรอปให้เก็บ');

    busy=true;showWorking($('gameScreen'));
    try{
      /* Let the basket animation actually play before items disappear from the ground. */
      await sleep(950);
      await settlePendingCloudSave?.();
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey);
      let next=null,summary=[];
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref);if(!snap.exists())throw new Error('ไม่พบเซฟสมาชิก');
        const s=ensure(normalizeState(snap.data(),currentMember));
        try{assertCurrentCloudSession?.(snap.data(),currentMember)}catch(_){}

        let rockQty=0;
        if(f>=2&&f<=4){
          const got=takeAll(hamSources(s,f));
          rockQty=got.reduce((a,d)=>a+n(d?.qty||1),0);
          if(rockQty){
            s.specials.therapyDiscRock=admin()?9999:n(s.specials.therapyDiscRock)+rockQty;
            summary.push({icon:'💿',name:'Rock CD',qty:rockQty});
          }
        }

        const catSummary={};
        for(const cat of (s.cats||[])){
          if(Number(cat?.placedFarm)!==f)continue;
          for(const drop of (cat.drops||[])){
            const item=(typeof CAT_DROP_POOL!=='undefined'?CAT_DROP_POOL:[]).find(x=>x.id===drop.itemId);
            if(!item)continue;
            try{applyPetDropReward?.(s,item)}catch(_){}
            if(!catSummary[item.id])catSummary[item.id]={name:item.name||item.id,qty:0};
            catSummary[item.id].qty+=n(item.qty||1);
          }
          cat.drops=[];
        }
        for(const x of Object.values(catSummary))summary.push({icon:'🎁',name:x.name,qty:x.qty});

        if(!summary.length){
          /* Do not show a false error after a successful earlier event; just finish quietly. */
          next=s;return;
        }
        s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
        next=cp(s);
        tx.set(ref,{...cp(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
      });

      if(next){
        ownState=normalizeState(next,currentMember);if(!visitContext)state=ownState;saveLocalOnly?.(ownState);
        try{globalThis.YN_R3424?.renderHam?.()}catch(_){}
        try{renderCatPendingDrop?.()}catch(_){}
      }
      await sleep(220);
      showSummary('🧺 เก็บของดรอปทั้งหมดแล้ว',summary);
    }catch(e){
      hideWorking();message?.('เก็บของดรอปไม่ได้',e?.message||'กรุณาลองใหม่');
    }finally{busy=false}
  }

  async function collectAlpacaAll(){
    if(busy||visitContext||!cloudReady||!currentMemberKey)return;
    const p=pen(),base=live();if(!base)return;
    const initial=ensure(cp(base)),cdInitial=rows(royalSources(initial,p)),boxInitial=(initial.alpaca.treasureDrops['pen'+p]||[]);
    if(!cdInitial.length&&!boxInitial.length)return message?.('ยังเก็บไม่ได้','ตอนนี้ยังไม่มีของดรอปในคอกนี้ค่ะ');

    busy=true;showWorking($('alpacaPenScreen')||$('sceneScreen'));
    try{
      await sleep(950);
      await settlePendingCloudSave?.();
      const {db,fs}=await getFirebaseContext(),ref=fs.doc(db,'saves',currentMemberKey);
      let next=null,summary=[];
      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref);if(!snap.exists())throw new Error('ไม่พบเซฟสมาชิก');
        const s=ensure(normalizeState(snap.data(),currentMember));
        try{assertCurrentCloudSession?.(snap.data(),currentMember)}catch(_){}

        const gotCd=takeAll(royalSources(s,p));
        const pinkQty=gotCd.reduce((a,d)=>a+n(d?.qty||2),0);
        if(pinkQty){
          s.specials.therapyDiscPink=admin()?9999:n(s.specials.therapyDiscPink)+pinkQty;
          summary.push({icon:'💿',name:'Pink CD',qty:pinkQty});
        }

        const boxes=s.alpaca.treasureDrops['pen'+p].splice(0);
        if(boxes.length){
          s.alpaca.inventory.other.treasureBox=n(s.alpaca.inventory.other.treasureBox)+boxes.length;
          summary.push({icon:'🧰',name:'กล่องสมบัติอัลปาก้า',qty:boxes.length});
        }

        if(!summary.length){next=s;return}
        s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
        next=cp(s);
        tx.set(ref,{...cp(s),activeSessionId:typeof cloudSessionId!=='undefined'?cloudSessionId:null,updatedAt:fs.serverTimestamp()},{merge:false});
      });

      if(next){
        ownState=normalizeState(next,currentMember);if(!visitContext)state=ownState;saveLocalOnly?.(ownState);
        try{globalThis.YN_R3424?.renderRoyal?.()}catch(_){}
        try{globalThis.YN_V240_RENDER_TREASURE_R3426?.()}catch(_){}
      }
      await sleep(220);
      showSummary('🧺 เก็บของในคอกแล้ว',summary);
    }catch(e){
      hideWorking();message?.('ยังเก็บไม่ได้',e?.message||'กรุณาลองใหม่');
    }finally{busy=false}
  }

  function route(e){
    const target=e.target?.closest?.('#v240CollectTreasureAll,#collectDropsBtn,[data-s2-tool="drops"]');
    if(!target)return;
    if(target.id==='v240CollectTreasureAll'){
      e.preventDefault();e.stopImmediatePropagation();
      if(dedupe('alpaca-all'))collectAlpacaAll();
      return;
    }
    if(target.id==='collectDropsBtn'||target.matches('[data-s2-tool="drops"]')){
      e.preventDefault();e.stopImmediatePropagation();
      if(dedupe('farm-all:'+farm()))collectFarmAll();
    }
  }

  /* Own all bulk collection events; single-CD taps remain owned by R34.25. */
  window.addEventListener('pointerup',route,true);
  window.addEventListener('touchend',route,{capture:true,passive:false});
  window.addEventListener('click',route,true);

  globalThis.YN_R3426={BUILD,collectFarmAll,collectAlpacaAll};
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>
<script id="r3428-temple-fast-input">
(()=>{
  'use strict';
  const BUILD='S2-R34.28-TEMPLE-FAST';
  let lastKey='',lastAt=0;
  function fire(key,fn,e){
    const t=performance.now();if(key===lastKey&&t-lastAt<420)return;
    lastKey=key;lastAt=t;
    try{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}catch(_){}
    try{fn()}catch(err){console.warn(BUILD,key,err)}
  }
  window.addEventListener('pointerdown',e=>{
    const b=e.target?.closest?.(
      '[data-solo-accept],[data-solo-send],[data-solo-claim],[data-group-join],[data-group-send],#templeSoloBtn,#templeGroupBtn'
    );
    if(!b)return;
    if(b.disabled)return;
    if(b.id==='templeSoloBtn')return fire('nav-solo',()=>openScene('templeSolo'),e);
    if(b.id==='templeGroupBtn')return fire('nav-group',()=>openScene('templeGroup'),e);
    if(b.hasAttribute('data-solo-accept'))return fire('solo-accept:'+b.dataset.soloAccept,()=>v15AcceptSolo(Number(b.dataset.soloAccept)),e);
    if(b.hasAttribute('data-solo-send'))return fire('solo-send:'+b.dataset.soloSend+':'+b.dataset.reqId,()=>v15SendSolo(Number(b.dataset.soloSend),b.dataset.reqId),e);
    if(b.hasAttribute('data-solo-claim'))return fire('solo-claim:'+b.dataset.soloClaim,()=>v15ClaimSolo(Number(b.dataset.soloClaim)),e);
    if(b.hasAttribute('data-group-join'))return fire('group-join:'+b.dataset.groupJoin,()=>v15JoinGroup(Number(b.dataset.groupJoin)),e);
    if(b.hasAttribute('data-group-send'))return fire('group-send:'+b.dataset.groupSend+':'+b.dataset.reqId,()=>v15SendGroup(Number(b.dataset.groupSend),b.dataset.reqId),e);
  },true);

  /* A snapshot may repaint the board while a request is in flight. The busy flags
     above prevent a second network transaction, and this keeps the tap feeling immediate. */
  document.addEventListener('pointerdown',e=>{
    const b=e.target?.closest?.('.temple-mission-board button');
    if(!b||b.disabled)return;
    b.classList.add('r3428-pressed');
    setTimeout(()=>b.classList.remove('r3428-pressed'),500);
  },true);

  globalThis.YN_R3428={BUILD};
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>


<script id="r3429-temple-sharded">
(()=>{
  'use strict';
  const BUILD='S2-R34.29-TEMPLE-SHARDED';
  const COLL='templeMissionSlotsV2';
  const $=id=>document.getElementById(id);
  const cp=v=>{try{return structuredClone(v)}catch(_){return JSON.parse(JSON.stringify(v))}};
  const now=()=>typeof gameNow==='function'?gameNow():Date.now();
  const key=(date,type,i)=>`${date}_${type}_${i}`;
  const refFor=(db,fs,date,type,i)=>fs.doc(db,COLL,key(date,type,i));
  let unsub=null, loadPromise=null, migrationDoneFor='', outcomeBusy=false;

  function newSlot(type,date,i,cycle=0){
    return type==='solo'?v15NewSoloSlot(date,i,cycle):v15NewGroupSlot(date,i,cycle);
  }
  function newDoc(type,date,i,slot=null){
    return {dateKey:date,type,index:i,slot:slot||newSlot(type,date,i,0),outcomes:{},updatedAtMs:now()};
  }
  function normalizeDoc(raw,type,date,i){
    const d=raw&&typeof raw==='object'?cp(raw):newDoc(type,date,i);
    d.dateKey=date;d.type=type;d.index=i;
    d.slot=d.slot&&typeof d.slot==='object'?d.slot:newSlot(type,date,i,0);
    d.outcomes=d.outcomes&&typeof d.outcomes==='object'?d.outcomes:{};
    return d;
  }
  function completeGroupDoc(d,t=now()){
    const slot=d.slot,i=d.index,date=d.dateKey;
    if(!slot||slot.status!=='active'||!v15AllReqDone(slot))return false;
    const id=slot.attemptId||`${date}-group-${i}-${slot.cycle}`;
    if(!d.outcomes[id]){
      const ps=Array.isArray(slot.participants)?slot.participants:[];
      const names=Object.fromEntries(ps.map(p=>[p.key,p.name]));
      const total=Number(slot.rewardTotal)||300;
      d.outcomes[id]={
        type:'group',status:'success',title:slot.title,names,
        rewards:v15AllocateGroupReward(total,ps,id),penalties:{},appliedKeys:[],
        createdAt:t,total
      };
    }
    slot.status='cooldown';slot.lastResult='success';slot.cooldownUntil=t+V15_GROUP_COOLDOWN_MS;
    slot.requirements=[];slot.sent={};slot.participants=[];
    return true;
  }
  function refreshDoc(d,t=now()){
    d=normalizeDoc(d,d.type,d.dateKey,d.index);
    let slot=d.slot, changed=false;
    const today=d.dateKey===currentBangkokDateKey(), canRespawn=today&&v15TempleIsOpen();

    if(d.type==='solo'){
      if(slot.status==='active'&&Number(slot.deadlineAt||0)>0&&t>=Number(slot.deadlineAt)){
        const id=slot.attemptId||`${d.dateKey}-solo-${d.index}-${slot.cycle}`;
        if(!d.outcomes[id])d.outcomes[id]={
          type:'solo',status:'failed',title:slot.title,
          names:{[slot.ownerKey]:slot.ownerName},rewards:{},
          penalties:{[slot.ownerKey]:100},appliedKeys:[],createdAt:t
        };
        slot.status='cooldown';slot.lastResult='failed';slot.cooldownUntil=t+V15_SOLO_COOLDOWN_MS;
        slot.requirements=[];slot.sent={};changed=true;
      }
      if(slot.status==='cooldown'&&t>=Number(slot.cooldownUntil||0)&&canRespawn){
        d.slot=newSlot('solo',d.dateKey,d.index,(Number(slot.cycle)||0)+1);changed=true;
      }
    }else{
      if(slot.status==='closed'&&slot.lastResult==='incomplete'&&today){
        d.slot=newSlot('group',d.dateKey,d.index,(Number(slot.cycle)||0)+1);slot=d.slot;changed=true;
      }
      if(slot.status==='active'&&v15AllReqDone(slot)){
        if(completeGroupDoc(d,t))changed=true;
      }
      if(slot.status==='active'&&Number(slot.deadlineAt||0)>0&&t>=Number(slot.deadlineAt)){
        const id=slot.attemptId||`${d.dateKey}-group-${d.index}-${slot.cycle}`;
        const ps=Array.isArray(slot.participants)?slot.participants:[];
        if(!d.outcomes[id]){
          const names=Object.fromEntries(ps.map(p=>[p.key,p.name]));
          d.outcomes[id]={
            type:'group',status:'failed',title:slot.title,names,rewards:{},
            penalties:Object.fromEntries(ps.map(p=>[p.key,150])),
            appliedKeys:[],createdAt:t,total:0
          };
        }
        slot.status='cooldown';slot.lastResult='failed';slot.cooldownUntil=t+V15_GROUP_COOLDOWN_MS;
        slot.requirements=[];slot.sent={};slot.participants=[];changed=true;
      }
      if(slot.status==='cooldown'&&t>=Number(slot.cooldownUntil||0)&&canRespawn){
        d.slot=newSlot('group',d.dateKey,d.index,(Number(slot.cycle)||0)+1);changed=true;
      }
    }
    d.updatedAtMs=t;
    return {doc:d,changed};
  }

  function composeDay(date,docs){
    const day=v15NewTempleDay(date);day.outcomes={};
    for(const d of docs){
      if(!d)continue;
      const nd=normalizeDoc(d,d.type,date,Number(d.index)||0);
      if(nd.type==='solo')day.soloSlots[nd.index]=cp(nd.slot);
      else day.groupSlots[nd.index]=cp(nd.slot);
      Object.assign(day.outcomes,cp(nd.outcomes||{}));
    }
    day.updatedAtMs=now();
    return day;
  }

  async function readAll(date){
    const {db,fs}=await getFirebaseContext();
    const pairs=[];
    for(const type of ['solo','group'])for(let i=0;i<6;i++)pairs.push([type,i,refFor(db,fs,date,type,i)]);
    const snaps=await Promise.all(pairs.map(x=>fs.getDoc(x[2])));
    const docs=snaps.map((snap,j)=>snap.exists()?normalizeDoc(snap.data(),pairs[j][0],date,pairs[j][1]):null);
    return {db,fs,pairs,snaps,docs};
  }

  async function migrateIfNeeded(date){
    if(migrationDoneFor===date)return;
    migrationDoneFor=date;
    const {db,fs,pairs,snaps,docs}=await readAll(date);
    if(docs.every(Boolean))return;

    let legacy=null;
    try{
      const ls=await fs.getDoc(fs.doc(db,'templeMissions',date));
      if(ls.exists())legacy=v15RefreshTempleDay(cp(ls.data()));
    }catch(_){}
    const batch=fs.writeBatch(db);
    let wrote=0;
    pairs.forEach(([type,i,ref],j)=>{
      if(snaps[j].exists())return;
      const slot=legacy
        ? cp(type==='solo'?legacy.soloSlots?.[i]:legacy.groupSlots?.[i])
        : newSlot(type,date,i,0);
      const d=newDoc(type,date,i,slot||newSlot(type,date,i,0));
      /* carry legacy outcomes relevant to this slot when attempt IDs match */
      if(legacy?.outcomes){
        for(const [oid,o] of Object.entries(legacy.outcomes)){
          if(type==='solo'&&String(oid).includes(`-solo-${i}-`))d.outcomes[oid]=cp(o);
          if(type==='group'&&String(oid).includes(`-group-${i}-`))d.outcomes[oid]=cp(o);
        }
      }
      batch.set(ref,{...d,updatedAt:fs.serverTimestamp()},{merge:false});wrote++;
    });
    if(wrote)await batch.commit();
  }

  async function loadDay(){
    const date=currentBangkokDateKey();
    if(loadPromise)return loadPromise;
    loadPromise=(async()=>{
      await migrateIfNeeded(date);
      const {docs}=await readAll(date);
      const refreshed=[];
      for(const d of docs){
        if(!d)continue;
        refreshed.push(refreshDoc(d).doc);
      }
      v15TempleCache=composeDay(date,refreshed);
      setTimeout(()=>applyOwnOutcomes().catch(()=>{}),0);
      return v15TempleCache;
    })().finally(()=>{loadPromise=null});
    return loadPromise;
  }

  function stopSub(){try{unsub?.()}catch(_){}unsub=null}
  async function startSub(){
    if(!cloudReady)return;
    stopSub();
    const date=currentBangkokDateKey(),{db,fs}=await getFirebaseContext();
    if(fs.query&&fs.where){
      const q=fs.query(fs.collection(db,COLL),fs.where('dateKey','==',date));
      unsub=fs.onSnapshot(q,snap=>{
        const docs=[];snap.forEach(x=>docs.push(normalizeDoc(x.data(),x.data()?.type,date,Number(x.data()?.index)||0)));
        if(docs.length){
          v15TempleCache=composeDay(date,docs);
          if(currentScene==='templeSolo')v15RenderSoloPanel();
          else if(currentScene==='templeGroup')v15RenderGroupPanel();
        }
      },e=>console.warn(BUILD,'query listener',e));
    }else{
      const us=[];
      for(const type of ['solo','group'])for(let i=0;i<6;i++){
        us.push(fs.onSnapshot(refFor(db,fs,date,type,i),()=>loadDay().then(()=>{
          if(currentScene==='templeSolo')v15RenderSoloPanel();
          else if(currentScene==='templeGroup')v15RenderGroupPanel();
        }).catch(()=>{})));
      }
      unsub=()=>us.forEach(u=>{try{u()}catch(_){}});
    }
    v15TempleUnsub=()=>stopSub();
  }

  async function refreshOne(type,i){
    const date=currentBangkokDateKey(),{db,fs}=await getFirebaseContext(),ref=refFor(db,fs,date,type,i);
    let result=null;
    await fs.runTransaction(db,async tx=>{
      const snap=await tx.get(ref);
      const base=snap.exists()?normalizeDoc(snap.data(),type,date,i):newDoc(type,date,i);
      const r=refreshDoc(base);
      result=r.doc;
      if(!snap.exists()||r.changed)tx.set(ref,{...cp(r.doc),updatedAt:fs.serverTimestamp()},{merge:false});
    });
    return result;
  }

  async function touchDay(){
    const day=v15TempleCache;if(!day)return loadDay();
    const jobs=[];
    const t=now();
    day.soloSlots.forEach((s,i)=>{
      if((s.status==='active'&&Number(s.deadlineAt||0)>0&&t>=Number(s.deadlineAt))||
         (s.status==='cooldown'&&t>=Number(s.cooldownUntil||0)))jobs.push(refreshOne('solo',i));
    });
    day.groupSlots.forEach((s,i)=>{
      if((s.status==='active'&&v15AllReqDone(s))||
         (s.status==='active'&&Number(s.deadlineAt||0)>0&&t>=Number(s.deadlineAt))||
         (s.status==='cooldown'&&t>=Number(s.cooldownUntil||0)))jobs.push(refreshOne('group',i));
    });
    if(jobs.length)await Promise.all(jobs);
    return loadDay();
  }

  function updateCacheSlot(type,i,slot){
    if(!v15TempleCache||v15TempleCache.dateKey!==currentBangkokDateKey())v15TempleCache=v15NewTempleDay(currentBangkokDateKey());
    if(type==='solo')v15TempleCache.soloSlots[i]=cp(slot);
    else v15TempleCache.groupSlots[i]=cp(slot);
  }

  async function acceptSolo(i){
    if(v15AcceptSolo._busy)return;v15AcceptSolo._busy=true;
    const btn=document.querySelector(`[data-solo-accept="${i}"]`);
    if(btn){btn.disabled=true;btn.textContent='กำลังรับ...'}
    try{
      const date=currentBangkokDateKey(),{db,fs}=await getFirebaseContext(),
        sref=refFor(db,fs,date,'solo',i),saveRef=fs.doc(db,'saves',currentMemberKey);
      let slotOut=null,nextState=null;
      await fs.runTransaction(db,async tx=>{
        const [slotSnap,saveSnap]=await Promise.all([tx.get(sref),tx.get(saveRef)]);
        if(!saveSnap.exists())throw new Error('ไม่พบเซฟสมาชิก');
        let d=slotSnap.exists()?normalizeDoc(slotSnap.data(),'solo',date,i):newDoc('solo',date,i);
        d=refreshDoc(d).doc;
        const s=normalizeState(saveSnap.data(),currentMember);v15EnsureTemplePlayerState(s);
        if(s.templeHourly.solo.count>=2)throw new Error('ชั่วโมงนี้คุณรับคำท้าครบ 2 ภารกิจแล้ว พักก่อนนะคะ');
        const slot=d.slot;if(slot.status!=='open')throw new Error('มีคนรับคำท้าภารกิจนี้ไปแล้ว');
        const t=now(),attemptId=`${date}-solo-${i}-${slot.cycle}-${t}`,requirements=v15SoloRequirements(attemptId);
        Object.assign(slot,{status:'active',ownerKey:currentMemberKey,ownerName:currentMember,attemptId,requirements,sent:{},reward:v15SoloReward(requirements,attemptId),startedAt:t,deadlineAt:t+V15_SOLO_DURATION_MS,cooldownUntil:0,lastResult:''});
        s.templeHourly.solo.count++;s.clientSaveRevision=(Number(s.clientSaveRevision)||0)+1;s.clientLocalEditAt=Date.now();
        slotOut=cp(slot);nextState=cp(s);
        tx.set(sref,{...cp(d),updatedAt:fs.serverTimestamp()},{merge:false});
        tx.set(saveRef,{...cp(s),activeSessionId:cloudSessionId,updatedAt:fs.serverTimestamp()},{merge:false});
      });

    try{
      if(!beforeState||!beforeSlot)throw new Error('ข้อมูลภารกิจยังไม่พร้อม');
      if(beforeSlot.status!=='active')throw new Error('ภารกิจนี้ยังไม่อยู่ในสถานะส่งเสบียง');
      if(type==='solo'&&beforeSlot.ownerKey!==currentMemberKey)throw new Error('ภารกิจนี้ไม่ใช่ของคุณ');
      if(type==='group'&&!(beforeSlot.participants||[]).some(p=>p.key===currentMemberKey))throw new Error('คุณไม่ได้อยู่ในทีมนี้');

      req=(beforeSlot.requirements||[]).find(r=>v15ReqId(r)===reqId);
      if(!req)throw new Error('ไม่พบเสบียงนี้');

      const sent=N(beforeSlot.sent?.[reqId]);
      const remain=Math.max(0,N(req.qty)-sent);
      const have=N(v15ReqHave(beforeState,req));
      optimisticQty=Math.min(remain,have);
      if(optimisticQty<=0)throw new Error('ของในกระเป๋าไม่พอ');

      /* Immediate local deduction + immediate visible mission progress. */
      const optimisticState=typeof normalizeState==='function'?normalizeState(cp(beforeState),currentMember):cp(beforeState);
      if(!v15ConsumeReq(optimisticState,req,optimisticQty))throw new Error('หักของจากกระเป๋าไม่สำเร็จ');
      optimisticState.clientSaveRevision=(Number(optimisticState.clientSaveRevision)||0)+1;
      optimisticState.clientLocalEditAt=Date.now();

      const optimisticSlot=cp(beforeSlot);
      optimisticSlot.sent=optimisticSlot.sent||{};
      optimisticSlot.sent[reqId]=sent+optimisticQty;
      if(type==='solo'&&v15AllReqDone(optimisticSlot))optimisticSlot.status='completed';

      applyLocalState(optimisticState);
      setLocalSlot(type,i,optimisticSlot);
      renderTemple(type);
      try{showWeatherToast?.(`🍱 กำลังส่งเสบียง ×${optimisticQty}...`)}catch(_){}

      /* Shared mission write touches ONLY this slot document. */
      const date=currentBangkokDateKey(),{db,fs}=await getFirebaseContext(),ref=slotRef(db,fs,date,type,i);
      let serverSlot=null,actualQty=0,completedGroup=false;

      await fs.runTransaction(db,async tx=>{
        const snap=await tx.get(ref);
        if(!snap.exists())throw new Error('ข้อมูลภารกิจยังไม่พร้อม');
        const d=cp(snap.data()),slot=d.slot;
        if(!slot||slot.status!=='active')throw new Error('ภารกิจนี้จบหรือเปลี่ยนสถานะแล้ว');
        if(type==='solo'&&slot.ownerKey!==currentMemberKey)throw new Error('ภารกิจนี้ไม่ใช่ของคุณ');
        if(type==='group'&&!(slot.participants||[]).some(p=>p.key===currentMemberKey))throw new Error('คุณไม่ได้อยู่ในทีมนี้');

        const serverReq=(slot.requirements||[]).find(r=>v15ReqId(r)===reqId);
        if(!serverReq)throw new Error('ไม่พบเสบียงนี้');
        const serverSent=N(slot.sent?.[reqId]);
        const serverRemain=Math.max(0,N(serverReq.qty)-serverSent);
        actualQty=Math.min(optimisticQty,serverRemain);
        if(actualQty<=0)throw new Error('เสบียงรายการนี้ครบแล้ว');

        slot.sent=slot.sent||{};
        slot.sent[reqId]=serverSent+actualQty;

        if(type==='solo'&&v15AllReqDone(slot))slot.status='completed';
        if(type==='group'&&v15AllReqDone(slot)){
          completeGroupDoc(d,NOW());
          completedGroup=true;
        }

        d.updatedAtMs=NOW();serverSlot=cp(d.slot);
        tx.set(ref,{...d,updatedAt:fs.serverTimestamp()},{merge:false});
      });

      /* If another group member filled part of it at the same moment, refund only
         the excess optimistic deduction instead of losing extra supplies. */
      if(actualQty<optimisticQty){
        const cur=typeof normalizeState==='function'?normalizeState(cp(ownState||state),currentMember):cp(ownState||state);
        refundReq(cur,req,optimisticQty-actualQty);
        cur.clientSaveRevision=(Number(cur.clientSaveRevision)||0)+1;
        cur.clientLocalEditAt=Date.now();
        applyLocalState(cur);
      }

      if(serverSlot)setLocalSlot(type,i,serverSlot);
      renderTemple(type);
      persistTempleInventory(req);

      if(completedGroup){
        try{showWeatherToast?.(`✅ ส่ง ×${actualQty} • ภารกิจหมู่สำเร็จแล้ว`)}catch(_){}
        setTimeout(()=>{try{v15ApplyOwnTempleOutcomes?.()}catch(_){}},0);
      }else{
        try{showWeatherToast?.(`🍱 ส่งเสบียงสำเร็จ ×${actualQty}`)}catch(_){}
      }
    }catch(e){
      /* Roll back the optimistic UI and inventory only when the server write fails. */
      if(beforeState)applyLocalState(beforeState);
      if(beforeSlot)setLocalSlot(type,i,beforeSlot);
      renderTemple(type);
      try{message?.('ส่งเสบียงไม่ได้',e?.message||'กรุณาลองใหม่ค่ะ')}catch(_){}
    }finally{
      templeBusy.delete(busyKey);
    }
  }

  /* These globals are the functions used by the existing temple buttons.
     We replace only SEND. Accept/join/claim keep R34.29 sharded behavior. */
  try{
    v15SendSolo=function(i,reqId){return fastSend('solo',Number(i),reqId)};
    v15SendGroup=function(i,reqId){return fastSend('group',Number(i),reqId)};
  }catch(_){}

  /* Time guards for every temple action, including stale modal buttons. */
  for(const name of ['v15AcceptSolo','v15JoinGroup','v15ClaimSolo']){
    try{
      const base=globalThis[name];
      if(typeof base==='function')globalThis[name]=function(){if(templeClosed())return blockTemple();return base.apply(this,arguments)};
    }catch(_){}
  }

  /* ============================================================
     HOME FOOD 09:00–13:00
     ============================================================ */
  try{
    const api=globalThis.YN_R16;
    if(api){
      for(const k of ['openKitchen','openHomeRecipe','craftHomeFood']){
        const base=api[k];
        if(typeof base==='function')api[k]=function(){if(homeFoodClosed())return blockHome();return base.apply(this,arguments)};
      }
    }
  }catch(_){}

  /* ============================================================
     HONEY 16:00–21:00
     Wrap the proven APIs instead of changing delivery mechanics.
     ============================================================ */
  function wrapHoneyApi(obj,keys){
    if(!obj)return;
    for(const k of keys){
      const base=obj[k];
      if(typeof base==='function'&&!base.__r3431){
        const f=function(){if(honeyClosed())return blockHoney();return base.apply(this,arguments)};
        f.__r3431=true;obj[k]=f;
      }
    }
  }
  try{wrapHoneyApi(globalThis.YN_HONEY_DELIVERY,['openFuel','call','openSend','refill'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R34133,['openHoney'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R34132,['openHoney'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R34131,['openHoneyMenu'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_HONEY_1220,['open'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_HONEY_REFUEL_1211,['open'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_HONEY_REFUEL_1212,['open'])}catch(_){}
  try{wrapHoneyApi(globalThis.YN_R341208,['openHoney128'])}catch(_){}

  /* ============================================================
     EARLY INPUT GATES
     Capture at window so old onclick handlers never execute while closed.
     ============================================================ */
  function routeClosedInput(e){
    const t=e.target?.closest?.(
      '#almsBtn,#templeSoloBtn,#templeGroupBtn,[data-solo-accept],[data-solo-send],[data-solo-claim],[data-group-join],[data-group-send],'+
      '#r17Kitchen,#r16StoveHotspot,#r28HomeFood,[data-r16-food],#r16CraftHomeFood,'+
      '#wellHotspot,#shortcutFishingBtn,[data-ynu-pond],'+
      '[data-s2-main="honey"],#honeyFuelHud,#honeyFuelCallHoney,#yn128HoneyConfirm,#r34133HoneyConfirm'
    );
    if(!t)return;
    let blocked=false;
    if(templeClosed()&&t.matches('#almsBtn,#templeSoloBtn,#templeGroupBtn,[data-solo-accept],[data-solo-send],[data-solo-claim],[data-group-join],[data-group-send]')){
      blocked=true;blockTemple();
    }else if(homeFoodClosed()&&t.matches('#r17Kitchen,#r16StoveHotspot,#r28HomeFood,[data-r16-food],#r16CraftHomeFood')){
      blocked=true;blockHome();
    }else if(fishingClosed()&&t.matches('#wellHotspot,#shortcutFishingBtn,[data-ynu-pond]')){
      blocked=true;blockFishing();
    }else if(honeyClosed()&&t.matches('[data-s2-main="honey"],#honeyFuelHud,#honeyFuelCallHoney,#yn128HoneyConfirm,#r34133HoneyConfirm')){
      blocked=true;blockHoney();
    }
    if(blocked){
      try{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}catch(_){}
    }
  }
  window.addEventListener('pointerdown',routeClosedInput,true);
  window.addEventListener('touchend',routeClosedInput,{capture:true,passive:false});
  window.addEventListener('click',routeClosedInput,true);

  /* If a player is sitting inside the temple exactly when 08:00 arrives,
     the existing temple clock will eject them because v15TempleIsOpen above
     is now the final authoritative time check. */
  globalThis.YN_R3431={
    BUILD,templeClosed,homeFoodClosed,fishingClosed,honeyClosed,fastSend
  };
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>

    try{const {db,fs}=await firebase(),ref=fs.doc(db,"shared","farmerBingo");bingoUnsub=fs.onSnapshot(ref,snap=>{const d=snap.exists()?snap.data():{};bingoData={cells:d?.cells&&typeof d.cells==="object"?d.cells:{},winner:String(d?.winner||"")};if(!s.classList.contains("hidden"))renderBingo()},e=>message?.("เปิดบิงโกไม่ได้",e?.message||"กรุณาลองใหม่ค่ะ"))}catch(e){message?.("เปิดบิงโกไม่ได้",e?.message||"กรุณาลองใหม่ค่ะ")}

  /* ---------------- Recycler ---------------- */
  const PATHS={product:["animalProducts"],special:["specials"],jelly:["specialAnimals"],jellyV2:["jellyfishV2"],fishingBait:["fishingBaits"],coconutRiver:["coconutRiverItems"],medicine:["medicines"],rainyMenu:["rainyMenus"],boatDrink:["boatDrinks"],farmFruit:["farmFruits"],homeFood:["homeFoods"],hedgehogItem:["hedgehogItems"],wine:["wines"],warehouseTool:["warehouseTools"],animal:["pendingAnimals"]};
  function at(s,path){let x=s;for(const k of path||[]){if(!x||typeof x!=="object")return null;x=x[k]}return x}

  function stackCount(s,e){
