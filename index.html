        tx.set(iRef,{...clone(finalInv),memberKey:tg.key,updatedAt:fs.serverTimestamp()},{merge:false});
        const lines=bundle.map(({item,qty})=>`${item.name} ×${qty}`).join(' • ');
        tx.set(mailRef,{source:'ostrich',type:'ostrichAdminGrantBundle',title:'🎁 ชุดของจากยัยหนูมาถึงแล้ว',text:`ได้รับ ${lines}`,image:bundle[0]?.item?.image||'ostrich-adult-icon.png',read:false,createdAtClient:now(),createdAt:fs.serverTimestamp()},{merge:false});
      })
    }
    try{
      const queue=targets.slice(),workers=Array.from({length:Math.min(4,queue.length)},async()=>{while(queue.length){const tg=queue.shift();try{await one(tg);done++}catch(e){failed.push(`${tg.name}: ${e?.message||'error'}`)}if(btn?.isConnected)btn.textContent=`กำลังส่ง ${done+failed.length}/${targets.length}...`}});
      await Promise.all(workers);
      if(failed.length)throw new Error(`สำเร็จ ${done} คน • ไม่สำเร็จ ${failed.length} คน\n${failed.slice(0,5).join('\n')}`);
      showWeatherToast?.(`🎁 ส่งชุดของ ${bundle.length} รายการให้ ${done} คนแล้ว`);await openAdminOstrich('send')
    }catch(e){message('ส่งของไม่ครบ',e?.message||'กรุณาลองใหม่ค่ะ')}
    finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=old||'ส่งชุดของให้ผู้รับ'}}
  }
  async function loadAdminRank(){try{const {db,fs}=await getFirebaseContext(),snap=await fs.getDocs(fs.collection(db,STATE_COLLECTION)),rows=[];snap.forEach(d=>{const s=normalizeOState(d.data(),d.id,d.data()?.displayName||d.id);rows.push({key:d.id,name:s.displayName||d.id,count:int(s.lifetimeLureSuccess)})});rows.sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'th'));const host=$('ostrichRankList');if(host)host.innerHTML=rows.length?rows.map((r,i)=>`<article class="${i<3?'top':''}"><strong>#${i+1}</strong><div><b>${esc(r.name)}</b><small>ล่อนกสำเร็จสะสม</small></div><span>${r.count} ตัว</span></article>`).join(''):'<p class="empty-feature">ยังไม่มีข้อมูลค่ะ</p>'}catch(e){const host=$('ostrichRankList');if(host)host.innerHTML=`<p>โหลด Rank ไม่สำเร็จ: ${esc(e?.message||'')}</p>`}}

  /* Integrate a dedicated Ostrich inventory tab without mixing its data into the large /saves document. */
  if(typeof inventory==='function'){
    const baseInventory=inventory;inventory=function(tab='crops'){if(tab==='ostrich'){renderOstrichInventory();return}const r=baseInventory.apply(this,arguments);setTimeout(injectInventoryTab,0);return r};
  }

  /* Admin lure requests also live inside the normal notification center. */
  if(typeof showNotifications==='function'){
    const baseShowNotifications=showNotifications;showNotifications=async function(){const r=await baseShowNotifications.apply(this,arguments);if(admin()){try{if(!adminPendingCache.length)adminPendingCache=await adminPendingRequests()}catch{}setTimeout(injectAdminRequestNotice,0)}return r};
  }
  if(typeof refreshNotificationBadge==='function'){
    const baseRefreshNotificationBadge=refreshNotificationBadge;refreshNotificationBadge=async function(){const r=await baseRefreshNotificationBadge.apply(this,arguments);if(admin()){try{if(!adminReqReady)adminPendingCache=await adminPendingRequests();const badge=$('notificationBadge'),n=int(adminPendingCache.length);if(badge&&n){const base=int(badge.textContent);badge.textContent=String(base+n);badge.classList.remove('hidden')}}catch{}}return r};
  }

  /* Add an entry to whatever Admin center is final after all earlier patches. */
  if(typeof showAdminCenter==='function'){
    const baseAdminCenter=showAdminCenter;showAdminCenter=async function(){const r=await baseAdminCenter.apply(this,arguments);if(!admin())return r;setTimeout(async()=>{const host=document.querySelector('#modalContent .v240-admin-center,#modalContent .admin-panel,#modalContent .feature-panel');if(!host||$('ostrichAdminEntryBtn'))return;const wrap=document.createElement('div');wrap.className='ostrich-admin-entry-wrap';wrap.innerHTML='<button id="ostrichAdminEntryBtn" type="button"><img src="ostrich-adult-icon.png" alt=""><span><b>ระบบนกกระจอกเทศ</b><small id="ostrichAdminPendingCount">คำขอล่อนก / ส่งของ / Rank</small></span><i>›</i></button>';host.appendChild(wrap);$('ostrichAdminEntryBtn').onclick=()=>openAdminOstrich('requests');try{const q=await adminPendingRequests(),x=$('ostrichAdminPendingCount');if(x)x.textContent=`คำขอล่อนกรอ ${q.length} • ส่งของ • Rank`}catch{}},0);return r};
  }

  function bindUI(){
    const entry=$('shortcutOstrichPenBtn');if(entry){let last=0;const go=e=>{const t=Date.now();if(t-last<500)return;last=t;e?.preventDefault?.();e?.stopPropagation?.();openOstrich()};entry.onclick=go;entry.addEventListener('pointerdown',go,{passive:false})}
    $('ostrichBackBtn')&&($('ostrichBackBtn').onclick=leaveOstrich);$('ostrichSwitchBtn')&&($('ostrichSwitchBtn').onclick=switchPen);$('ostrichLureBtn')&&($('ostrichLureBtn').onclick=openLure);$('ostrichCraftBtn')&&($('ostrichCraftBtn').onclick=openCraft);$('ostrichFeedBtn')&&($('ostrichFeedBtn').onclick=openFeed);$('ostrichCollectBtn')&&($('ostrichCollectBtn').onclick=collectAll);$('ostrichVaultBtn')&&($('ostrichVaultBtn').onclick=openVault);$('ostrichAdminBtn')&&($('ostrichAdminBtn').onclick=()=>openAdminOstrich('requests'));
  }
  bindUI();

  document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseMotion()}else{setTimeout(()=>{bindNoticeStream();if(isOstrichOpen()){cleanupExpired(true).then(()=>renderScreen(false)).catch(()=>{})}},120)}});
  window.addEventListener('pageshow',()=>{setTimeout(()=>{bindUI();bindNoticeStream();if(isOstrichOpen())cleanupExpired(true).then(()=>renderScreen(false)).catch(()=>{})},180)},{passive:true});
  window.addEventListener('online',()=>{bindNoticeStream();if(isOstrichOpen())reloadDocs().then(()=>renderScreen(false)).catch(()=>{})},{passive:true});
  setInterval(()=>{try{bindNoticeStream();bindAdminRequestStream();if(isOstrichOpen()){renderHeader();renderBirdLayer();const hasExpired=[...(oState?.pen1||[]),...(oState?.pen2||[])].some(b=>Number(b?.expiresAt)<=now());const modalOpen=$('modal')&&!$('modal').classList.contains('hidden');if(hasExpired&&!expireBusy&&!modalOpen){expireBusy=true;cleanupExpired(true).then(()=>renderScreen(false)).catch(e=>console.warn(BUILD,'expire tick',e)).finally(()=>{expireBusy=false})}}}catch{}},1000);
  setTimeout(()=>{bindNoticeStream();bindAdminRequestStream()},350);

  globalThis.YN_OSTRICH={BUILD,FOODS,PRODUCTS,BOOKS,LURE_ITEMS,open:openOstrich,openAdmin:openAdminOstrich,reload:reloadDocs,reloadInventory,getInventory:()=>normalizeInventory(oInv||defaultInventory()),getState:()=>normalizeOState(oState||defaultState())};
  globalThis.YAINOO_PACKAGE_BUILD=BUILD;globalThis.YAINOO_BUILD=BUILD;
  console.info(BUILD,'loaded');
})();
</script>
