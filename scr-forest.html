function energy(){const k=Math.floor((Date.now()-F.et)/REGEN());if(k>0){F.e=Math.min(MAXE,F.e+k);F.et=F.e>=MAXE?Date.now():F.et+k*REGEN()}if(F.e>=MAXE)F.et=Date.now();return F.e}
function elixirOn(){return F.elixir>Date.now()}
function taps(k){return elixirOn()?Math.ceil(KIND[k].taps/2):KIND[k].taps}
/* ---------- เกิดใหม่: ทุก 1 ชม. 30 นาที ต้นไม้/หิน 3–5 จุด (สูงสุด 24) + หญ้า 2–4 กอ (สูงสุด 10) ---------- */
const bigCount=()=>F.cnt.tree+F.cnt.rock+F.cnt.gold+F.cnt.glow;
const grassCount=()=>Object.values(F.grass).reduce((a,b)=>a+b,0);
function pickGrass(){let r=Math.random()*100;for(const[k,[,w]]of Object.entries(GRASS)){r-=w;if(r<=0)return k}return 'green'}
function spawnOnce(){let n=rnd(3,5);while(n-->0&&bigCount()<24){const t=Math.random()<.5?'tree':'rock',sp=Math.random()<.05;F.cnt[sp?(t==='tree'?'gold':'glow'):t]++}
 let g=rnd(2,4);while(g-->0&&grassCount()<10)F.grass[pickGrass()]++}
function process(){let ch=false,s=0;while(Date.now()>=F.next&&s++<48){spawnOnce();F.next+=HOUR();ch=true}if(F.next-Date.now()>HOUR())F.next=Date.now()+HOUR();return ch}
/* ---------- ฉาก ---------- */
const SLOTS=[];[520,640,760,880,1000,1120,1240].forEach((y,r)=>{[170,345,520,700].forEach((x,c)=>{const xx=x+(r%2?55:0);if(xx>560&&y>=1000)return;if(xx>820)return;SLOTS.push([xx,y])})});
const GSLOTS=[[120,470],[300,580],[470,520],[640,575],[810,610],[240,700],[560,690],[130,820],[420,815],[760,800],[260,940],[600,935],[150,1060],[440,1060],[300,1180],[120,1250],[500,1250]];
let nodes=[],drops=[],busy=false,hits={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function layout(){/* ตำแหน่งสุ่มใหม่ทุกครั้งที่เข้าป่า เพราะเซฟเก็บแค่จำนวน */
 const list=[];Object.entries(F.cnt).forEach(([k,n])=>{for(let i=0;i<n;i++)list.push(k)});
 const sl=shuffle(SLOTS.map((p,i)=>[p[0],p[1],i]));nodes=list.slice(0,sl.length).map((k,i)=>({id:'n'+i+'-'+Date.now(),k,slot:sl[i][2],x:sl[i][0]+rnd(-15,15),y:sl[i][1]+rnd(-12,12),
  img:k==='tree'?['tree-oak','tree-pine','tree-birch'][rnd(0,2)]:k==='rock'?['rock-1','rock-2','rock-3'][rnd(0,2)]:k}));
 const gl=[];Object.entries(F.grass).forEach(([c,n])=>{for(let i=0;i<n;i++)gl.push(c)});const gs=shuffle(GSLOTS.map((p,i)=>[p[0],p[1],i]));
 gl.slice(0,gs.length).forEach((c,i)=>nodes.push({id:'g'+i+'-'+Date.now(),k:'grass',c,slot:gs[i][2],x:gs[i][0]+rnd(-12,12),y:gs[i][1]+rnd(-10,10),img:'g-'+c}))}
function draw(){const s=$('stage');s.innerHTML='<div class="nightfx"></div>';s.style.backgroundImage='url('+IMG.bg+')';
 [...nodes].sort((a,b)=>a.y-b.y).forEach(n=>{const d=document.createElement('div');d.className='nd '+(n.k==='grass'?'grass':(n.k==='tree'||n.k==='gold')?'tree':'rock');d.id=n.id;
  const w=n.k==='grass'?8.5:KIND[n.k].w;Object.assign(d.style,{left:n.x/W*100+'%',top:n.y/H*100+'%',width:w+'%',zIndex:Math.round(n.y/10)});
  d.innerHTML='<img src="'+IMG[n.img]+'" alt="">'+(n.k==='grass'?'':'<div class="pg"><i></i></div><div class="cost">⚡'+KIND[n.k].cost+'</div>');
  d.onclick=e=>tapNode(n,d,e);s.appendChild(d)});
 drops.forEach(dp=>s.appendChild(dp.el));hud()}
function hud(){const e=energy();$('eFill').style.width=(e/MAXE*100)+'%';$('eTxt').textContent=e+'/'+MAXE;
 const b=$('buff');if(elixirOn()){const s=Math.ceil((F.elixir-Date.now())/1000);b.style.display='block';b.textContent='✨ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}else b.style.display='none';
 const ms=Math.max(0,F.next-Date.now()),mm=Math.floor(ms/60000),ss=Math.floor(ms%60000/1000);
 $('ttlSub').textContent='🌱 '+Math.floor(mm/60)+':'+String(mm%60).padStart(2,'0')+':'+String(ss).padStart(2,'0');
 const p=F.pend,g=Object.values(p.grass).reduce((a,b)=>a+b,0),has=p.wood||p.stone||g;
 $('collect').style.display=has?'flex':'none';
 if(has){$('cIc').innerHTML=(p.wood?'<img src="'+IMG.wood+'">':'')+(p.stone?'<img src="'+IMG.stone+'">':'')+(g?'<img src="'+IMG['g-'+(Object.keys(p.grass).find(k=>p.grass[k])||'green')]+'">':'');
  $('cTxt').textContent='เก็บทั้งหมด'}}
/* ---------- แตะต้นไม้/หิน: นับแตะในเครื่อง หักพลังงานตอนล้มเท่านั้น ---------- */
function tapNode(n,d,ev){if(!guardOpen())return;
 if(n.k==='grass'){F.grass[n.c]--;nodes=nodes.filter(x=>x!==n);d.remove();F.pend.grass[n.c]=(F.pend.grass[n.c]||0)+1;spill(n,'g-'+n.c,1);save();hud();return}
 const K=KIND[n.k],need=taps(n.k);
 if(!hits[n.id]&&energy()<K.cost){ann('⚡ พลังงานไม่พอ • '+K.n+'ต้องใช้ ⚡'+K.cost+' (มี '+energy()+')',1);openDrinks();return}
 hits[n.id]=(hits[n.id]||0)+1;d.classList.add('on');d.classList.remove('hit');void d.offsetWidth;d.classList.add('hit');
 d.querySelector('.pg i').style.width=Math.min(100,hits[n.id]/need*100)+'%';chip(n,K.res==='wood'?'🪵':'🪨');
 if(hits[n.id]>=need){if(energy()<K.cost){hits[n.id]=need-1;ann('⚡ พลังงานไม่พอ ต้องใช้ ⚡'+K.cost,1);openDrinks();return}
  energy();F.e-=K.cost;if(F.e<MAXE&&F.et>Date.now())F.et=Date.now();
  const q=rnd(K.y[0],K.y[1]);F.cnt[n.k]--;F.pend[K.res]+=q;nodes=nodes.filter(x=>x!==n);delete hits[n.id];
  d.classList.add(n.k==='tree'||n.k==='gold'?'fallT':'fallR');setTimeout(()=>{d.remove();spill(n,K.res,q)},n.k==='tree'||n.k==='gold'?450:300);save();hud()}}
function chip(n,e){const s=$('stage'),c=document.createElement('div');c.className='chip';c.textContent=e;Object.assign(c.style,{left:n.x/W*100+'%',top:(n.y-120)/H*100+'%'});s.appendChild(c);
 requestAnimationFrame(()=>{c.style.transform='translate('+rnd(-40,40)+'px,'+rnd(-50,-20)+'px) rotate('+rnd(-90,90)+'deg)';c.style.opacity='0'});setTimeout(()=>c.remove(),600)}
function spill(n,img,q){const s=$('stage'),cnt=img.startsWith('g-')?1:Math.min(8,4+Math.floor(q/120));
 for(let i=0;i<cnt;i++){const el=document.createElement('img');el.className='drop pop';el.src=IMG[img];const x=n.x+rnd(-70,70),y=n.y-rnd(0,40)+rnd(-25,25);
  Object.assign(el.style,{left:x/W*100+'%',top:y/H*100+'%','--fx':rnd(-30,30)+'px','--fy':rnd(10,40)+'px',animationDelay:(i*40)+'ms'});s.appendChild(el);drops.push({el})}
 if(!img.startsWith('g-')){const p=document.createElement('div');p.className='plus';p.textContent='+'+fmt(q);Object.assign(p.style,{left:n.x/W*100+'%',top:(n.y-90)/H*100+'%'});s.appendChild(p);setTimeout(()=>p.remove(),1700)}}
/* ---------- เก็บทั้งหมด: กดครั้งเดียววิ่งเข้ากระเป๋า ---------- */
function collectAll(silent){const p=F.pend,g=Object.entries(p.grass).filter(([,v])=>v>0);if(!p.wood&&!p.stone&&!g.length)return false;
 S.bag.forest.wood=(S.bag.forest.wood||0)+p.wood;S.bag.forest.stone=(S.bag.forest.stone||0)+p.stone;g.forEach(([c,v])=>S.bag.grass[c]=(S.bag.grass[c]||0)+v);
 const msg=[p.wood?'🪵 ไม้ +'+fmt(p.wood):'',p.stone?'🪨 หิน +'+fmt(p.stone):'',g.length?'🌿 หญ้า +'+g.reduce((a,[,v])=>a+v,0):''].filter(Boolean).join(' • ');
 F.pend={wood:0,stone:0,grass:{}};save();
 if(!silent){const r=$('collect').getBoundingClientRect(),st=$('stage').getBoundingClientRect();
  drops.forEach(({el},i)=>{setTimeout(()=>{el.classList.remove('pop');el.classList.add('fly');el.style.left=((r.left+r.width/2-st.left)/st.width*100)+'%';el.style.top=((r.top-st.top)/st.height*100)+'%'},i*25)});
  setTimeout(()=>{drops.forEach(d=>d.el.remove());drops=[];hud()},800);ann('🎒 เข้ากระเป๋าแล้ว • '+msg)}else{drops.forEach(d=>d.el.remove());drops=[]}
 hud();return msg}
$('collect').onclick=()=>collectAll();
addEventListener('pagehide',()=>{collectAll(true)});
/* ---------- เปิด/ปิดตามเวลาไทย ---------- */
function guardOpen(){if(ADMIN||isOpen())return true;showClosed();return false}
function showClosed(){const m=collectAll(true);const mins=untilOpen();
 $('closedTxt').innerHTML='เปิดทุกวัน <b style="display:inline;font-size:inherit">18:00–05:59</b> (เวลาไทย)<br>'+(mins?'เปิดอีกครั้งในอีก '+Math.floor(mins/60)+' ชม. '+(mins%60)+' นาที':'')+(m?'<br>🎒 เก็บของที่ค้างบนพื้นเข้ากระเป๋าให้แล้ว':'');$('closed').classList.add('on')}
$('closedBack').onclick=()=>goFarm();

/* ---------- ชีต ---------- */
function open(h){$('sb').innerHTML=h;$('sheet').classList.add('on');$('shade').classList.add('on')}
function closeAll(){$('sheet').classList.remove('on');$('shade').classList.remove('on');$('fan').classList.remove('open');$('toolBtn').classList.remove('open')}
$('shade').onclick=closeAll;
let at;function ann(m,err){$('aImg').src=err?IMG.oops:IMG.happy;$('aTxt').innerHTML=m;$('ann').className='ann show'+(err?' err':'');clearTimeout(at);at=setTimeout(()=>$('ann').className='ann',2800)}
const have=(t,k)=>S.bag[t][k]||0;
const needHTML=(list,times)=>'<div class="needs">'+list.map(([t,k,q])=>{const n=q*times,ok=have(t,k)>=n;return '<span class="need '+(ok?'ok':'no')+'"><img src="'+imgOf(t,k)+'" alt="">'+NAMES[t][k]+' '+fmt(have(t,k))+'/'+fmt(n)+'</span>'}).join('')+'</div>';
const maxTimes=list=>Math.min(10,...list.map(([t,k,q])=>Math.floor(have(t,k)/q)));
/* ---------- เครื่องดื่ม ---------- */
function openDrinks(){closeAll();const e=energy();
 open('<h3>🧃 ดื่มเพิ่มพลังงาน</h3><div class="hint">⚡ '+e+'/'+MAXE+' • พลังงานฟื้นเอง 1 หน่วยทุก 3 นาที • ใช้ได้เฉพาะในป่าต้องห้าม</div>'+
 Object.entries(DRINK).map(([k,d])=>'<div class="opt"><img src="'+IMG['d-'+k]+'" alt=""><b>'+d.n+'<small>'+(d.full?'⚡ เติมเต็ม '+MAXE+' + แตะครึ่งเดียว 30 นาที':'⚡ +'+d.e)+' • มี '+have('drink',k)+'</small></b><button class="btn g sm" data-d="'+k+'"'+(have('drink',k)<1?' disabled':'')+'>ดื่ม</button></div>').join('')+
 '<div class="row"><button class="btn sm" id="toCraft">🔨 ไปคราฟเครื่องดื่ม</button></div>');
 $('sb').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>drink(b.dataset.d));$('toCraft').onclick=()=>openCraft('drink')}
function drink(k){const d=DRINK[k],e=energy();if(have('drink',k)<1)return;
 if(!d.full&&e>=MAXE)return ann('⚡ พลังงานเต็มแล้ว เก็บไว้ดื่มทีหลังนะ',1);
 S.bag.drink[k]--;F.e=Math.min(MAXE,e+d.e);if(F.e>=MAXE)F.et=Date.now();if(d.full)F.elixir=Date.now()+ELIX();save();hud();draw();openDrinks();
 ann(d.full?'✨ ดื่ม'+d.n+' • พลังงานเต็ม + แตะครึ่งเดียว 30 นาที':'🧃 ดื่ม'+d.n+' ⚡+'+Math.min(d.e,MAXE-e))}
/* ---------- คราฟ (ปุ่มขวาบน) ---------- */
let cTab='drink',cq={};
function openCraft(tab){if(tab)cTab=tab;closeAll();
 const items=cTab==='drink'?Object.entries(DRINK).map(([k,d])=>({k,img:IMG['d-'+k],n:d.n,eff:d.full?'⚡ เติมเต็ม + แตะครึ่งเดียว 30 นาที':'⚡ +'+d.e,need:d.need,out:'ได้ 1 ขวด/ครั้ง'}))
  :Object.entries(TOOLR).map(([k,r])=>({k,img:IMG[k],n:RES[k],eff:'ใช้อัปเกรดบ้าน',need:r.need,out:'ได้ '+r.y[0]+'–'+r.y[1]+' ชิ้น/ครั้ง'}));
 open('<h3>🔨 คราฟในป่า</h3><div class="hint">สำเร็จ 100% • คราฟได้ครั้งละ 1–10 ครั้ง</div><div class="tabs"><button data-t="drink" class="'+(cTab==='drink'?'on':'')+'">🧃 เครื่องดื่มพลังงาน</button><button data-t="tool" class="'+(cTab==='tool'?'on':'')+'">🪢 เชือก • เหล็ก</button></div>'+
  items.map(it=>{const mx=maxTimes(it.need),q=Math.max(1,Math.min(cq[it.k]||1,Math.max(1,mx)));cq[it.k]=q;
   return '<div class="rc"><div class="hd"><img src="'+it.img+'" alt=""><div><b>'+it.n+'</b><small>'+it.eff+' • '+it.out+'</small></div></div>'+needHTML(it.need,q)+
   '<div class="qrow"><small>'+(mx>0?'คราฟได้สูงสุด '+mx+' ครั้ง':'วัตถุดิบยังไม่พอ')+'</small><button class="st" data-m="'+it.k+'">−</button><span class="q">'+q+'</span><button class="st" data-p="'+it.k+'">+</button><button class="btn g sm" data-c="'+it.k+'"'+(mx<q?' disabled':'')+'>คราฟ</button></div></div>'}).join(''));
 $('sb').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cTab=b.dataset.t;openCraft()});
 $('sb').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cq[b.dataset.m]=Math.max(1,(cq[b.dataset.m]||1)-1);openCraft()});
 $('sb').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cq[b.dataset.p]=Math.min(10,(cq[b.dataset.p]||1)+1);openCraft()});
 $('sb').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>confirmCraft(b.dataset.c))}
function confirmCraft(k){const isD=cTab==='drink',r=isD?DRINK[k]:TOOLR[k],q=cq[k]||1,nm=isD?DRINK[k].n:RES[k];
 open('<h3>ยืนยันการคราฟ</h3><div class="hint">'+nm+' × '+q+' ครั้ง • จะใช้วัตถุดิบตามนี้</div>'+needHTML(r.need,q)+'<div class="row"><button class="btn gray" id="cBack">ย้อนกลับ</button><button class="btn g" id="cOk">ยืนยันคราฟ</button></div>');
 $('cBack').onclick=()=>openCraft();
 $('cOk').onclick=e=>{e.target.disabled=true;if(maxTimes(r.need)<q)return ann('วัตถุดิบไม่พอแล้ว',1);
  r.need.forEach(([t,kk,n])=>S.bag[t][kk]-=n*q);let got=0;
  if(isD){got=q;S.bag.drink[k]=(S.bag.drink[k]||0)+q}else{for(let i=0;i<q;i++)got+=rnd(r.y[0],r.y[1]);S.bag.forest[k]=(S.bag.forest[k]||0)+got}save();
  closeAll();showCraftResult({title:'คราฟ '+nm,results:Array(q).fill(true),outputs:[{name:nm,image:isD?IMG['d-'+k]:IMG[k],quantity:got}],consumed:r.need.map(([t,kk,n])=>({path:t+'.'+kk,quantity:n*q}))},openCraft);}}

$('energy').onclick=()=>{if(guardOpen())openDrinks()};

 $('sMat').onclick=()=>{const add={crop:{watermelon:500,cucumber:1000,strawberry:1000,banana:1000,grape:1500,lychee:1500},flower:{butterflypea:500},grass:{blue:60,pink:60},bird:{'ostrich-feather':300,'dodo-pebble':300},forest:{wood:9000,stone:9000}};
  Object.entries(add).forEach(([t,o])=>Object.entries(o).forEach(([k,q])=>S.bag[t][k]=(S.bag[t][k]||0)+q));save();ann('🎁 เติมวัตถุดิบสำหรับลองคราฟแล้ว')};
 $('sReset').onclick=()=>{F=freshF();drops.forEach(d=>d.el.remove());drops=[];hits={};save();layout();draw();closeAll();ann('🔄 ล้างข้อมูลป่าแล้ว')}}

/* ---------- เริ่ม ---------- */
function fit(){const u=Math.min(innerWidth/390,innerHeight/760);document.documentElement.style.fontSize=(16*Math.max(.82,Math.min(u,1.35)))+'px';const s=$('stage'),sc=Math.min(innerWidth/W,innerHeight/H);s.style.width=W*sc+'px';s.style.height=H*sc+'px'}
document.documentElement.style.setProperty('--bg','url('+IMG.bg+')');
function tick(){if(!ADMIN&&!isOpen()){if(!$('closed').classList.contains('on'))showClosed();return}$('closed').classList.remove('on');
 if(process()){save();sync();draw()}else hud()}
/* ของเกิดใหม่: เติมลงช่องว่าง ไม่ขยับของเดิม */
function sync(){const usedB=new Set(nodes.filter(n=>n.k!=='grass').map(n=>n.slot)),usedG=new Set(nodes.filter(n=>n.k==='grass').map(n=>n.slot));
 Object.entries(F.cnt).forEach(([k,c])=>{let have=nodes.filter(n=>n.k===k).length;const free=shuffle(SLOTS.map((s,i)=>i).filter(i=>!usedB.has(i)));while(have<c&&free.length){const i=free.pop();usedB.add(i);nodes.push({id:'n'+k+Date.now()+have,k,slot:i,x:SLOTS[i][0]+rnd(-15,15),y:SLOTS[i][1]+rnd(-12,12),img:k==='tree'?['tree-oak','tree-pine','tree-birch'][rnd(0,2)]:k==='rock'?['rock-1','rock-2','rock-3'][rnd(0,2)]:k});have++}});
 Object.entries(F.grass).forEach(([c,n])=>{let have=nodes.filter(x=>x.k==='grass'&&x.c===c).length;const free=shuffle(GSLOTS.map((s,i)=>i).filter(i=>!usedG.has(i)));while(have<n&&free.length){const i=free.pop();usedG.add(i);nodes.push({id:'g'+c+Date.now()+have,k:'grass',c,slot:i,x:GSLOTS[i][0]+rnd(-12,12),y:GSLOTS[i][1]+rnd(-10,10),img:'g-'+c});have++}})}
addEventListener('resize',fit);fit();process();layout();draw();save();
if(!ADMIN&&!isOpen())showClosed();else setTimeout(()=>ann('🌙 แตะต้นไม้หรือหินหลายครั้งให้ล้มนะ'),400);
setInterval(tick,1000);
</script><script>/* ===== 🧰 เมนูเครื่องมือ 2 ชั้น: หมวด → รายการ ===== */
(function(){
const fan=document.getElementById('fan'),tool=document.getElementById('toolBtn');if(!fan||!tool)return;
const st=document.createElement('style');st.textContent='.fan .fg-hide{display:none!important}.fan .fcat i{background:#FFF3C9!important}.fan .fcat.back i{background:#EEE!important}.fan .fcat b{font-weight:700}';document.head.appendChild(st);
const CATS=[['other','⚙️','อื่นๆ',/ตั้งค่าทดลอง|กลับฟาร์ม|กระเป๋า|ขึ้นบ้าน|ลงห้องใต้ดิน/],['box','🎁','กล่องสุ่ม',/กล่องสุ่ม/],['animal','🐾','สัตว์',/^วาง(แมว|แฮมสเตอร์)/],
 ['care','💕','ดูแล',/อาบน้ำ|นวด|เอนเตอร์เทน/],['food','🍽️','อาหาร',/คราฟอาหาร|เตา|ให้อาหาร|ดื่ม/],['craft','🔨','คราฟ',/คราฟ/],
 ['harvest','🧺','เก็บ',/เก็บ|เกี่ยว/],['grow','🌱','ดูแลแปลง',/ปลูก|รดน้ำ|หนอน|เร่ง|ปีก|ปุ๋ย/]];
let cur='',self=false;
const items=()=>[...fan.children].filter(b=>b.tagName==='BUTTON'&&!b.classList.contains('fcat'));
const usable=b=>b.style.display!=='none';
const label=b=>[...b.childNodes].filter(n=>n.nodeName!=='I').map(n=>n.textContent).join('').replace(/\s+/g,' ').trim();
function catOf(b){const t=label(b);for(const c of CATS)if(c[3].test(t))return c[0];return 'other'}
function render(){self=true;fan.querySelectorAll('.fcat').forEach(e=>e.remove());const list=items(),av=list.filter(usable);
 if(av.length<=4){list.forEach(b=>b.classList.remove('fg-hide'));setTimeout(()=>{self=false},0);return}
 const groups={};av.forEach(b=>{const c=catOf(b);(groups[c]=groups[c]||[]).push(b)});
 if(!cur||!groups[cur]){cur='';list.forEach(b=>b.classList.add('fg-hide'));
  CATS.slice().reverse().forEach(([k,ic,nm])=>{const g=groups[k];if(!g)return;
   if(g.length===1){g[0].classList.remove('fg-hide');fan.appendChild(g[0]);return}
   const c=document.createElement('button');c.className='fcat';c.dataset.cat=k;c.innerHTML='<i>'+ic+'</i><b>'+nm+'</b> <small style="opacity:.6">('+g.length+')</small>';fan.appendChild(c)})}
 else{list.forEach(b=>b.classList.toggle('fg-hide',!groups[cur].includes(b)));const back=document.createElement('button');back.className='fcat back';back.dataset.cat='';back.innerHTML='<i>↩</i>หมวดทั้งหมด';fan.insertBefore(back,fan.firstChild)}
 setTimeout(()=>{self=false},0)}
fan.addEventListener('click',e=>{const c=e.target.closest('.fcat');if(!c)return;e.stopImmediatePropagation();e.preventDefault();cur=c.dataset.cat;render()},true);
tool.addEventListener('click',()=>{cur='';setTimeout(render,0)},true);
new MutationObserver(()=>{if(self)return;cur='';render()}).observe(fan,{childList:true});
render();
})();
</script></body></html>
